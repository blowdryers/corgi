<!DOCTYPE html>
<html>
<head>
    <title>simple proxy loader</title>
</head>
<body>

<h2>proxy site loader</h2>

<input type="text" id="urlInput" placeholder="enter website url" style="width:300px;">
<button onclick="loadSite()">go</button>

<br><br>

<iframe id="frame" style="width:100%; height:500px;"></iframe>

<script>
function loadSite() {
    let url = document.getElementById("urlInput").value;
    
    if (!url.startsWith("http")) {
        url = "http://" + url;
    }

    let proxy = "http://185.162.230.230:80/";
    document.getElementById("frame").src = proxy + url;
}
</script>

</body>
</html>
