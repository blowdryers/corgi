<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro Screen</title>
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: auto; /* allow scrolling */
        background: black;
        font-family: Arial, sans-serif;
    }

    #overlay {
        position: fixed;
        inset: 0;
        background: black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        cursor: pointer;
        z-index: 10;
        user-select: none;
        transition: opacity 0.8s ease;
    }

    #overlay.fade-out {
        opacity: 0;
        pointer-events: none;
    }

    #overlay span {
        background: linear-gradient(90deg, #ffffff, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    iframe {
        width: 100%;
        height: 100vh; /* better for mobile */
        border: none;
        display: none;
        overflow: auto;
        -webkit-overflow-scrolling: touch; /* smooth scroll on iOS */
    }
</style>
</head>
<body>

<div id="overlay"><span>press anywhere 2</span></div>

<audio id="introAudio" src="Zombo.com.mp3"></audio>

<iframe id="siteFrame" src="https://csharp.straw.page"></iframe>

<script>
const overlay = document.getElementById("overlay");
const audio = document.getElementById("introAudio");
const frame = document.getElementById("siteFrame");

async function startSite() {
    overlay.removeEventListener("pointerdown", startSite);

    try {
        await audio.play();
    } catch (err) {
        console.log(err);
    }

    frame.style.display = "block";
    overlay.classList.add("fade-out");

    setTimeout(() => {
        overlay.remove();
    }, 800);
}

overlay.addEventListener("pointerdown", startSite);
</script>

</body>
</html>
