<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Crypt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05040b;
    --wall: #0d0b1a;
    --teal: #2ef2c8;
    --pink: #ff4fa3;
    --violet: #6a3bff;
    --text: #ece9ff;
    --muted: #8f89b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    display: grid; place-items: center; color: var(--text);
    font-family: "Press Start 2P", ui-monospace, monospace;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .frame {
    position: relative; overflow: hidden; background: var(--wall);
    width: min(100vw, 460px); height: min(100vh, 880px); height: min(100dvh, 880px);
  }
  @media (min-width: 480px) and (min-height: 700px) {
    .frame { border: 2px solid #1d1940; border-radius: 6px; }
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: absolute; inset: 0 0 auto; z-index: 2; height: 44px; padding: 0 14px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    font-size: 11px; background: var(--bg); border-bottom: 2px solid #1d1940;
    pointer-events: none;
  }
  .hud b { font-weight: normal; }
  .hud .level { color: var(--muted); }
  .hud .level b { color: var(--teal); }
  .hud .score { font-size: 13px; }
  .hud .gems { justify-self: end; display: flex; align-items: center; gap: 8px; color: var(--pink); }
  .hud .gems i { width: 8px; height: 8px; background: var(--pink); transform: rotate(45deg); }
  .overlay {
    position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; padding: 24px;
    text-align: center; background: rgba(5, 4, 11, .86); cursor: pointer;
    transition: opacity .25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 {
    font-size: 30px; line-height: 1.35; font-weight: normal; color: var(--teal);
    text-shadow: 3px 3px 0 var(--violet), 0 0 18px rgba(46, 242, 200, .45);
  }
  .overlay .info { font-size: 10px; line-height: 2.2; color: var(--muted); }
  .overlay .info em { font-style: normal; color: var(--text); }
  .overlay .prompt { font-size: 12px; color: var(--pink); animation: blink 1s steps(2) infinite; }
  .overlay button {
    font: inherit; font-size: 9px; color: var(--muted); background: none;
    border: 2px solid #2a2550; padding: 8px 12px; cursor: pointer;
  }
  .overlay button:hover { color: var(--text); border-color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<main class="frame">
  <canvas id="game"></canvas>
  <header class="hud">
    <span class="level">LVL <b id="level">1</b></span>
    <span class="score"><b id="score">0</b></span>
    <span class="gems"><i></i><b id="gems">0</b></span>
  </header>
  <section class="overlay" id="overlay">
    <h1 id="title">NEON<br>CRYPT</h1>
    <p class="info" id="info"></p>
    <p class="prompt" id="prompt">TAP TO START</p>
    <button id="sound" type="button">SOUND ON</button>
  </section>
</main>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const el = {
    level: document.getElementById("level"),
    score: document.getElementById("score"),
    gems: document.getElementById("gems"),
    overlay: document.getElementById("overlay"),
    title: document.getElementById("title"),
    info: document.getElementById("info"),
    prompt: document.getElementById("prompt"),
    sound: document.getElementById("sound")
  };

  const COLS = 15;
  const HUD = 44;
  const SPEED = 34;
  const COLOR = {
    wall: "#0d0b1a",
    wallDetail: "#15122a",
    floor: "#05040b",
    edge: "#2ef2c8",
    edgeInner: "#137a66",
    dot: "#bfb2ff",
    gem: "#ff4fa3",
    gemLight: "#ffc2e0",
    spike: "#ff3b5c",
    spikeLight: "#ffb0bd",
    gate: "#ffe14f",
    flood: "rgba(106, 59, 255, .82)",
    floodTop: "#b49bff",
    text: "#ece9ff"
  };
  const SPRITE = [
    "OO....OO",
    "OPO..OPO",
    "OOOOOOOO",
    "OKOOOOKO",
    "OOWWWWOO",
    "OWWKKWWO",
    "WWWWWWWW",
    ".WWWWWW."
  ];
  const SPRITE_COLOR = { O: "#ff9a3c", P: "#ffcf9c", W: "#fff4e6", K: "#120f1f" };
  const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  const KEYS = {
    ArrowUp: 0, KeyW: 0, ArrowDown: 1, KeyS: 1,
    ArrowLeft: 2, KeyA: 2, ArrowRight: 3, KeyD: 3
  };

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  };

  let width = 0, height = 0, cell = 24, offsetX = 0;
  let state = "menu";
  let level = 1, score = 0, gems = 0, best = Number(store.get("neoncrypt-best")) || 0;
  let map = null, player = null, queued = null;
  let camera = 0, flood = 0, floodWait = 0;
  let particles = [], shake = 0, flash = 0, fade = 0, banner = 0, timer = 0;
  let swipe = null, lastTime = 0;

  const audio = { ctx: null, on: store.get("neoncrypt-sound") !== "0" };

  function unlockAudio() {
    if (audio.ctx || !audio.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audio.ctx = new AC();
  }

  function tone(freq, duration, type, volume, endFreq, delay) {
    if (!audio.on || !audio.ctx) return;
    const t = audio.ctx.currentTime + (delay || 0);
    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(audio.ctx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }

  const sfx = {
    dot() { tone(1200, 0.025, "square", 0.012); },
    stop() { tone(140, 0.06, "square", 0.04, 90); },
    gem() { tone(880, 0.09, "square", 0.035, 1760); },
    die() { tone(320, 0.5, "sawtooth", 0.06, 50); },
    clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, "square", 0.04, 0, i * 0.07)); }
  };

  const rand = n => Math.floor(Math.random() * n);
  const key = (x, y) => y * COLS + x;

  function slide(grid, rows, x, y, dx, dy, exit) {
    const path = [];
    for (;;) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= rows || grid[ny][nx]) break;
      x = nx;
      y = ny;
      path.push(key(x, y));
      if (key(x, y) === exit) break;
    }
    return { x, y, path };
  }

  function explore(grid, rows, start, danger, exit) {
    const dist = new Map([[start, 0]]);
    const visited = new Set([start]);
    const queue = [start];
    for (let i = 0; i < queue.length; i++) {
      const k = queue[i];
      if (k === exit) continue;
      for (const [dx, dy] of DIRS) {
        const r = slide(grid, rows, k % COLS, Math.floor(k / COLS), dx, dy, exit);
        if (!r.path.length || r.path.some(p => danger.has(p))) continue;
        r.path.forEach(p => visited.add(p));
        const end = key(r.x, r.y);
        if (!dist.has(end)) {
          dist.set(end, dist.get(k) + 1);
          queue.push(end);
        }
      }
    }
    return { dist, visited };
  }

  function buildLevel(lvl) {
    const rows = 34 + Math.min(lvl, 12) * 4;
    const minMoves = Math.min(6 + lvl, 18);

    for (let attempt = 0; attempt < 500; attempt++) {
      const grid = Array.from({ length: rows }, (_, y) =>
        Array.from({ length: COLS }, (_, x) => x === 0 || x === COLS - 1 || y === 0 || y === rows - 1 ? 1 : 0));

      const segments = Math.floor(rows * (1.5 + Math.random() * 0.5));
      for (let i = 0; i < segments; i++) {
        let x = 1 + rand(COLS - 2), y = 1 + rand(rows - 4);
        const horizontal = Math.random() < 0.55;
        const length = 1 + rand(4);
        for (let j = 0; j < length && x < COLS - 1 && y < rows - 3; j++) {
          grid[y][x] = 1;
          if (horizontal) x++; else y++;
        }
      }

      const sx = 1 + rand(COLS - 2), sy = rows - 2;
      const start = key(sx, sy);
      grid[sy][sx] = 0;

      const open = explore(grid, rows, start, new Set());
      let exit = -1, top = rows;
      for (const k of open.dist.keys()) {
        const y = Math.floor(k / COLS);
        if (y < top) { top = y; exit = k; }
      }
      if (top > 2 || open.dist.get(exit) < minMoves) continue;

      const spikes = [];
      const danger = new Set();
      const candidates = [...open.visited].filter(k => k !== start && k !== exit && Math.floor(k / COLS) < sy - 2);
      const tries = Math.floor(rows * (0.2 + Math.min(lvl, 10) * 0.06));
      for (let i = 0; i < tries && candidates.length; i++) {
        const k = candidates[rand(candidates.length)];
        if (danger.has(k)) continue;
        const x = k % COLS, y = Math.floor(k / COLS);
        const [dx, dy] = DIRS[rand(4)];
        if (!grid[y + dy] || grid[y + dy][x + dx] !== 1) continue;
        danger.add(k);
        if (explore(grid, rows, start, danger, exit).dist.has(exit)) {
          spikes.push({ x: x + dx, y: y + dy, dx: -dx, dy: -dy });
        } else {
          danger.delete(k);
        }
      }

      const final = explore(grid, rows, start, danger, exit);
      if (!final.dist.has(exit)) continue;

      for (let y = 1; y < rows - 1; y++) {
        for (let x = 1; x < COLS - 1; x++) {
          if (!grid[y][x] && !open.visited.has(key(x, y))) grid[y][x] = 1;
        }
      }

      const items = new Map();
      for (const k of final.visited) {
        if (k === start || k === exit) continue;
        items.set(k, final.dist.has(k) && Math.random() < 0.2 ? "gem" : "dot");
      }

      return { grid, rows, sx, sy, exit, ex: exit % COLS, ey: Math.floor(exit / COLS), spikes, danger, items };
    }
    return null;
  }

  function loadLevel() {
    map = null;
    while (!map) map = buildLevel(level);
    player = {
      x: map.sx, y: map.sy, px: map.sx, py: map.sy,
      dx: 0, dy: 0, tx: map.sx, ty: map.sy,
      moving: false, squash: 0
    };
    queued = null;
    particles = [];
    flood = map.sy + 4;
    floodWait = 1.5;
    banner = 1.6;
    camera = cameraTarget();
    renderHud();
  }

  function visibleRows() { return (height - HUD) / cell; }

  function cameraTarget() {
    const target = player.py - visibleRows() * 0.6;
    return Math.max(-1, Math.min(map.rows + 1 - visibleRows(), target));
  }

  function renderHud() {
    el.level.textContent = level;
    el.score.textContent = score;
    el.gems.textContent = gems;
  }

  function showOverlay(title, info, prompt) {
    el.title.innerHTML = title;
    el.info.innerHTML = info;
    el.prompt.textContent = prompt;
    el.sound.textContent = audio.on ? "SOUND ON" : "SOUND OFF";
    el.overlay.classList.remove("hidden");
  }

  function saveBest() {
    if (score > best) {
      best = score;
      store.set("neoncrypt-best", best);
    }
  }

  function startRun() {
    if (state !== "menu" && state !== "over") return;
    unlockAudio();
    level = 1;
    score = 0;
    gems = 0;
    loadLevel();
    fade = 1;
    state = "play";
    el.overlay.classList.add("hidden");
  }

  function die() {
    if (state !== "play") return;
    state = "dead";
    timer = 0.9;
    shake = 0.35;
    flash = 1;
    player.moving = false;
    queued = null;
    burst(player.px, player.py, SPRITE_COLOR.O, 28);
    sfx.die();
    saveBest();
  }

  function clearLevel() {
    state = "clear";
    timer = 0.6;
    score += 50 + level * 10;
    renderHud();
    burst(player.px, player.py, COLOR.gate, 36);
    sfx.clear();
    saveBest();
  }

  function gameOver() {
    state = "over";
    showOverlay(
      "GAME<br>OVER",
      `SCORE <em>${score}</em><br>BEST <em>${best}</em><br>REACHED LEVEL <em>${level}</em>`,
      "TAP TO RETRY"
    );
  }

  function move(dir) {
    if (state !== "play") return;
    unlockAudio();
    if (player.moving) {
      queued = dir;
      return;
    }
    const [dx, dy] = DIRS[dir];
    const r = slide(map.grid, map.rows, player.x, player.y, dx, dy, map.exit);
    if (!r.path.length) return;
    player.dx = dx;
    player.dy = dy;
    player.tx = r.x;
    player.ty = r.y;
    player.moving = true;
  }

  function enterCell(x, y) {
    const k = key(x, y);
    if (map.danger.has(k)) {
      player.px = x;
      player.py = y;
      die();
      return;
    }
    const item = map.items.get(k);
    if (!item) return;
    map.items.delete(k);
    if (item === "gem") {
      gems++;
      score += 5;
      burst(x, y, COLOR.gem, 10);
      sfx.gem();
    } else {
      score++;
      sfx.dot();
    }
    renderHud();
  }

  function arrive() {
    player.moving = false;
    player.x = player.px = player.tx;
    player.y = player.py = player.ty;
    player.squash = 1;
    shake = Math.max(shake, 0.06);
    burst(player.x + player.dx * 0.45, player.y + player.dy * 0.45, COLOR.edge, 6);
    if (key(player.x, player.y) === map.exit) {
      clearLevel();
      return;
    }
    sfx.stop();
    if (queued !== null) {
      const next = queued;
      queued = null;
      move(next);
    }
  }

  function burst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 7;
      particles.push({
        x: x + 0.5, y: y + 0.5,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 0.3 + Math.random() * 0.4, size: 0.14, color
      });
    }
  }

  function updatePlayer(dt) {
    if (!player.moving) return;
    let step = SPEED * dt;
    while (step > 0 && player.moving && state === "play") {
      const remaining = Math.abs(player.tx - player.px) + Math.abs(player.ty - player.py);
      const advance = Math.min(step, remaining);
      player.px += player.dx * advance;
      player.py += player.dy * advance;
      step -= advance;
      const cx = Math.round(player.px), cy = Math.round(player.py);
      if (cx !== player.x || cy !== player.y) {
        player.x = cx;
        player.y = cy;
        enterCell(cx, cy);
      }
      if (state === "play" && advance >= remaining) arrive();
    }
    particles.push({ x: player.px + 0.5, y: player.py + 0.5, vx: 0, vy: 0, life: 0.16, size: 0.5, color: SPRITE_COLOR.O });
  }

  function updateFlood(dt) {
    if (floodWait > 0) {
      floodWait -= dt;
      return;
    }
    const base = 0.9 + Math.min(level, 15) * 0.09;
    const gap = flood - player.py;
    const catchUp = Math.max(0, gap - visibleRows() * 0.45) * 0.9;
    flood -= (base + catchUp) * dt;
    if (player.py + 0.7 > flood) die();
  }

  function update(dt) {
    if (state === "play") {
      updatePlayer(dt);
      if (state === "play") updateFlood(dt);
      fade = Math.max(0, fade - dt * 3);
    } else if (state === "clear") {
      timer -= dt;
      fade = Math.min(1, 1 - timer / 0.6);
      if (timer <= 0) {
        level++;
        loadLevel();
        state = "play";
      }
    } else if (state === "dead") {
      timer -= dt;
      if (timer <= 0) gameOver();
    }

    if (player) {
      camera += (cameraTarget() - camera) * Math.min(1, dt * 8);
      player.squash = Math.max(0, player.squash - dt * 6);
    }
    banner = Math.max(0, banner - dt);
    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt * 2.5);
    particles = particles.filter(p => (p.life -= dt) > 0);
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.9;
      p.vy *= 0.9;
    }
  }

  function isWall(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= map.rows) return true;
    return map.grid[y][x] === 1;
  }

  function screenX(x) { return offsetX + x * cell; }
  function screenY(y) { return Math.round(HUD + (y - camera) * cell); }

  function drawMaze(y0, y1) {
    const line = Math.max(2, Math.round(cell / 10));
    const inset = line * 2;
    const minX = Math.floor(-offsetX / cell) - 1;
    const maxX = COLS + Math.ceil(offsetX / cell) + 1;

    for (let y = y0; y < y1; y++) {
      for (let x = minX; x < maxX; x++) {
        const sx = screenX(x), sy = screenY(y);
        if (!isWall(x, y)) {
          ctx.fillStyle = COLOR.floor;
          ctx.fillRect(sx, sy, cell, cell);
        } else if (((x * 73856093) ^ (y * 19349663)) % 7 === 0) {
          ctx.fillStyle = COLOR.wallDetail;
          ctx.fillRect(sx + Math.round(cell * 0.35), sy + Math.round(cell * 0.35), Math.round(cell * 0.3), Math.round(cell * 0.3));
        }
      }
    }

    const edges = (size, gap, color) => {
      ctx.fillStyle = color;
      for (let y = y0; y < y1; y++) {
        for (let x = 0; x < COLS; x++) {
          if (isWall(x, y)) continue;
          const sx = screenX(x), sy = screenY(y);
          const up = isWall(x, y - 1), down = isWall(x, y + 1);
          const left = isWall(x - 1, y), right = isWall(x + 1, y);
          if (up) ctx.fillRect(sx - (left ? gap + size : 0), sy - gap - size, cell + (left ? gap + size : 0) + (right ? gap + size : 0), size);
          if (down) ctx.fillRect(sx - (left ? gap + size : 0), sy + cell + gap, cell + (left ? gap + size : 0) + (right ? gap + size : 0), size);
          if (left) ctx.fillRect(sx - gap - size, sy, size, cell);
          if (right) ctx.fillRect(sx + cell + gap, sy, size, cell);
          if (!up && !left && isWall(x - 1, y - 1)) ctx.fillRect(sx - gap - size, sy - gap - size, size, size);
          if (!up && !right && isWall(x + 1, y - 1)) ctx.fillRect(sx + cell + gap, sy - gap - size, size, size);
          if (!down && !left && isWall(x - 1, y + 1)) ctx.fillRect(sx - gap - size, sy + cell + gap, size, size);
          if (!down && !right && isWall(x + 1, y + 1)) ctx.fillRect(sx + cell + gap, sy + cell + gap, size, size);
        }
      }
    };
    edges(line, inset, COLOR.edgeInner);
    edges(line, 0, COLOR.edge);
  }

  function drawSpike(s) {
    const sx = screenX(s.x), sy = screenY(s.y);
    const teeth = 3, depth = cell * 0.36, w = cell / teeth;
    for (let i = 0; i < teeth; i++) {
      const a = i * w, m = a + w / 2, b = a + w;
      ctx.beginPath();
      if (s.dy) {
        const base = s.dy > 0 ? sy + cell : sy;
        const tip = base + s.dy * depth;
        ctx.moveTo(sx + a, base); ctx.lineTo(sx + m, tip); ctx.lineTo(sx + b, base);
      } else {
        const base = s.dx > 0 ? sx + cell : sx;
        const tip = base + s.dx * depth;
        ctx.moveTo(base, sy + a); ctx.lineTo(tip, sy + m); ctx.lineTo(base, sy + b);
      }
      ctx.closePath();
      ctx.fillStyle = COLOR.spike;
      ctx.fill();
    }
  }

  function drawItems(y0, y1, t) {
    const dot = Math.max(2, Math.round(cell / 9));
    for (const [k, type] of map.items) {
      const x = k % COLS, y = Math.floor(k / COLS);
      if (y < y0 || y >= y1) continue;
      const cx = screenX(x) + cell / 2, cy = screenY(y) + cell / 2;
      if (type === "dot") {
        ctx.fillStyle = COLOR.dot;
        ctx.fillRect(Math.round(cx - dot / 2), Math.round(cy - dot / 2), dot, dot);
      } else {
        const r = cell * 0.26;
        const bob = Math.round(Math.sin(t * 4 + k) * cell * 0.06);
        ctx.fillStyle = COLOR.gem;
        ctx.beginPath();
        ctx.moveTo(cx, cy - r + bob);
        ctx.lineTo(cx + r * 0.8, cy + bob);
        ctx.lineTo(cx, cy + r + bob);
        ctx.lineTo(cx - r * 0.8, cy + bob);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = COLOR.gemLight;
        ctx.fillRect(Math.round(cx - r * 0.3), Math.round(cy - r * 0.35 + bob), Math.max(2, Math.round(r * 0.3)), Math.max(2, Math.round(r * 0.3)));
      }
    }
  }

  function drawGate(t) {
    const sx = screenX(map.ex), sy = screenY(map.ey);
    const pulse = 0.5 + 0.5 * Math.sin(t * 6);
    const pad = Math.round(cell * 0.12);
    const line = Math.max(2, Math.round(cell / 10));
    ctx.globalAlpha = 0.15 + pulse * 0.15;
    ctx.fillStyle = COLOR.gate;
    ctx.fillRect(sx, sy, cell, cell);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = COLOR.gate;
    ctx.lineWidth = line;
    ctx.strokeRect(sx + pad + line / 2, sy + pad + line / 2, cell - pad * 2 - line, cell - pad * 2 - line);
    const core = Math.round(cell * (0.18 + pulse * 0.08));
    ctx.fillRect(Math.round(sx + cell / 2 - core / 2), Math.round(sy + cell / 2 - core / 2), core, core);
  }

  function drawPlayer(t) {
    const size = cell * 0.84;
    const unit = size / 8;
    let sx = 1, sy = 1;
    if (player.moving) {
      sx = player.dx ? 1.18 : 0.84;
      sy = player.dy ? 1.18 : 0.84;
    } else if (player.squash > 0) {
      const s = player.squash * 0.22;
      sx = player.dx ? 1 - s : 1 + s;
      sy = player.dy ? 1 - s : 1 + s;
    }
    const blink = (t % 3.2) < 0.12;
    ctx.save();
    ctx.translate(Math.round(screenX(player.px) + cell / 2), Math.round(screenY(player.py) + cell / 2));
    ctx.scale(sx, sy);
    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        let c = SPRITE[row][col];
        if (c === ".") continue;
        if (blink && row === 3 && c === "K") c = "O";
        ctx.fillStyle = SPRITE_COLOR[c];
        ctx.fillRect(-size / 2 + col * unit, -size / 2 + row * unit, unit + 0.5, unit + 0.5);
      }
    }
    ctx.restore();
  }

  function drawFlood(t) {
    const top = screenY(flood);
    if (top > height) return;
    const wave = x => top + Math.sin(x * 0.045 + t * 3.5) * cell * 0.14;
    ctx.fillStyle = COLOR.flood;
    ctx.beginPath();
    ctx.moveTo(0, height);
    for (let x = 0; x <= width + 6; x += 6) ctx.lineTo(x, wave(x));
    ctx.lineTo(width, height);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = COLOR.floodTop;
    const crest = Math.max(2, Math.round(cell / 10));
    for (let x = 0; x <= width; x += 4) ctx.fillRect(x, Math.round(wave(x)) - 1, 4, crest);
    ctx.fillStyle = "rgba(180, 155, 255, .45)";
    for (let i = 0; i < 14; i++) {
      const bx = (i * 97.3 + Math.sin(i) * 40) % width;
      const by = top + cell * 0.6 + ((i * 53 - t * 30 * (1 + i % 3)) % (height - top + cell) + (height - top + cell)) % (height - top + cell);
      ctx.fillRect(Math.round(bx), Math.round(by), 3, 3);
    }
  }

  function drawBanner() {
    if (banner <= 0 || state !== "play") return;
    const alpha = Math.min(1, banner * 2);
    const y = HUD + (height - HUD) * 0.32;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(5, 4, 11, .75)";
    ctx.fillRect(0, y - 26, width, 52);
    ctx.fillStyle = COLOR.text;
    ctx.font = `${Math.max(14, Math.round(cell * 0.6))}px "Press Start 2P", monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(`LEVEL ${level}`, width / 2, y + 1);
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    ctx.fillStyle = COLOR.wall;
    ctx.fillRect(0, 0, width, height);
    if (!map) return;

    ctx.save();
    if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * shake * 24), Math.round((Math.random() - 0.5) * shake * 24));

    const y0 = Math.max(-2, Math.floor(camera) - 1);
    const y1 = Math.ceil(camera + visibleRows()) + 1;
    drawMaze(y0, y1);
    map.spikes.forEach(s => { if (s.y >= y0 && s.y < y1) drawSpike(s); });
    drawItems(y0, y1, t);
    if (map.ey >= y0 && map.ey < y1) drawGate(t);

    for (const p of particles) {
      const s = Math.max(2, Math.round(cell * p.size));
      ctx.globalAlpha = Math.min(1, p.life * 4) * (p.size > 0.3 ? 0.35 : 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(screenX(p.x) - s / 2), Math.round(screenY(p.y) - s / 2), s, s);
    }
    ctx.globalAlpha = 1;

    if (state !== "dead" && state !== "over") drawPlayer(t);
    drawFlood(t);
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 59, 92, ${flash * 0.3})`;
      ctx.fillRect(0, 0, width, height);
    }
    drawBanner();
    if (fade > 0) {
      ctx.fillStyle = `rgba(5, 4, 11, ${fade})`;
      ctx.fillRect(0, 0, width, height);
    }
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    width = rect.width;
    height = rect.height;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    cell = Math.floor(width / COLS);
    offsetX = Math.floor((width - cell * COLS) / 2);
  }

  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("keydown", e => {
    if (e.code in KEYS) {
      e.preventDefault();
      move(KEYS[e.code]);
    } else if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      startRun();
    } else if (e.code === "KeyM") {
      toggleSound();
    }
  });

  function toggleSound() {
    audio.on = !audio.on;
    store.set("neoncrypt-sound", audio.on ? "1" : "0");
    el.sound.textContent = audio.on ? "SOUND ON" : "SOUND OFF";
    if (audio.on) unlockAudio();
  }

  el.sound.addEventListener("click", e => {
    e.stopPropagation();
    toggleSound();
  });
  el.overlay.addEventListener("click", startRun);

  canvas.addEventListener("pointerdown", e => {
    swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", e => {
    if (!swipe || swipe.id !== e.pointerId) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.hypot(dx, dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 3 : 2);
    else move(dy > 0 ? 1 : 0);
    swipe.x = e.clientX;
    swipe.y = e.clientY;
  });
  canvas.addEventListener("pointerup", () => { swipe = null; });
  canvas.addEventListener("pointercancel", () => { swipe = null; });

  resize();
  loadLevel();
  banner = 0;
  showOverlay(
    "NEON<br>CRYPT",
    "SWIPE OR USE ARROW KEYS<br>YOU SLIDE UNTIL YOU HIT A WALL<br>DODGE THE SPIKES<br>OUTRUN THE FLOOD" + (best ? `<br><br>BEST <em>${best}</em>` : ""),
    "TAP TO START"
  );
  requestAnimationFrame(now => {
    lastTime = now;
    frame(now);
  });
})();
</script>
</body>
</html>
