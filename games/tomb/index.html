<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mask of the Deep</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center; background: #100f12;
    color: #f5e8cb; font: 14px/1.4 system-ui, sans-serif;
  }
  .game {
    width: min(100vw, 500px); height: min(100dvh, 900px); min-height: 500px;
    position: relative; overflow: hidden; background: #17171a;
    border: 1px solid #655541; box-shadow: 0 20px 80px #000b;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .hud {
    position: absolute; inset: 0 0 auto; z-index: 2; padding: 18px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; text-shadow: 0 2px 5px #000;
  }
  .title { font-weight: 900; letter-spacing: .12em; font-size: 12px; }
  .title span { color: #e6b95e; }
  .stats { display: flex; gap: 8px; }
  .stat {
    padding: 7px 10px; min-width: 66px; text-align: center;
    border: 1px solid #d2b26a55; background: #17130ed9;
  }
  .stat small { display: block; font-size: 9px; color: #c6ad81; letter-spacing: .12em; }
  .stat b { font-size: 14px; }
  .hint {
    position: absolute; z-index: 2; bottom: 15px; left: 50%; transform: translateX(-50%);
    color: #d7c7a8; background: #17130edb; border: 1px solid #d2b26a44;
    padding: 8px 12px; font-size: 10px; letter-spacing: .1em;
    white-space: nowrap; pointer-events: none;
  }
  .overlay {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
    padding: 22px; background: #080807bb; transition: opacity .2s;
  }
  .overlay.off { opacity: 0; pointer-events: none; }
  .card {
    max-width: 330px; padding: 28px 26px; text-align: center;
    background: #201b15; border: 2px solid #8b7040;
    box-shadow: 0 0 0 5px #18140f, 0 20px 60px #000b;
  }
  .mask {
    width: 66px; height: 66px; margin: 0 auto 14px; display: grid; place-items: center;
    font-size: 34px; background: #332718; border: 2px solid #c29b4f;
    color: #f0cb76; box-shadow: 0 0 22px #e3ad4c33;
  }
  h1 { margin: 0; font-size: 23px; letter-spacing: .1em; }
  p { color: #c2b294; line-height: 1.6; margin: 10px 0 20px; }
  button {
    padding: 12px 20px; color: #19140b; background: #e3b95f; border: 0;
    font: 900 11px system-ui; letter-spacing: .13em; cursor: pointer;
  }
  button:hover { background: #f1d183; }
</style>
</head>
<body>
<main class="game">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="title">MASK <span>OF THE DEEP</span></div>
    <div class="stats">
      <div class="stat"><small>TEMPLE</small><b id="stage">01</b></div>
      <div class="stat"><small>RELICS</small><b id="score">000</b></div>
    </div>
  </div>
  <div class="hint">SWIPE TO DASH • KEEP ABOVE THE RISING SAND</div>
  <div class="overlay" id="overlay">
    <div class="card">
      <div class="mask">◉</div>
      <h1 id="heading">THE DEEP TEMPLE</h1>
      <p id="message">Dash through the ancient corridors. Your mask moves until it hits a wall. Don’t let the sand catch you.</p>
      <button id="button">ENTER THE TEMPLE</button>
    </div>
  </div>
</main>
<script>
(() => {
  const canvas = document.querySelector("#c");
  const ctx = canvas.getContext("2d");
  const overlay = document.querySelector("#overlay");
  const button = document.querySelector("#button");
  const stageEl = document.querySelector("#stage");
  const scoreEl = document.querySelector("#score");
  const heading = document.querySelector("#heading");
  const message = document.querySelector("#message");

  const C = 15, R = 35;
  let w, h, dpr, cell, grid, dots, player, level=1, score=0, active=false;
  let last=0, camera=0, sand=0, particles=[], move=null, swipe=null;
  const dirs={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],
    ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};

  function resize(){
    const r=canvas.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=r.width*dpr; canvas.height=r.height*dpr;
    w=r.width; h=r.height; ctx.setTransform(dpr,0,0,dpr,0,0);
    cell=Math.floor(Math.min((w-30)/C,(h-120)/13));
  }
  addEventListener("resize",resize); resize();

  function makeLevel(){
    // Perfect maze, carved from odd-numbered cells.
    grid=Array.from({length:R},()=>Array(C).fill(1));
    const stack=[[1,R-2]], seen=new Set([`1,${R-2}`]); grid[R-2][1]=0;
    while(stack.length){
      const [x,y]=stack[stack.length-1], opts=[];
      for(const [dx,dy] of [[2,0],[-2,0],[0,2],[0,-2]]){
        const nx=x+dx,ny=y+dy,k=`${nx},${ny}`;
        if(nx>0&&nx<C-1&&ny>0&&ny<R-1&&!seen.has(k))opts.push([nx,ny,dx,dy]);
      }
      if(!opts.length){stack.pop();continue;}
      const [nx,ny,dx,dy]=opts[(Math.random()*opts.length)|0];
      grid[y+dy/2][x+dx/2]=0;grid[ny][nx]=0;seen.add(`${nx},${ny}`);stack.push([nx,ny]);
    }
    // The exit is at the far end, so the route steadily climbs.
    grid[1][C-2]=2;
    // Ensure the upper exit connects into the maze.
    grid[1][C-3]=0;grid[2][C-2]=0;
    player={x:1,y:R-2,fromX:1,fromY:R-2,toX:1,toY:R-2,t:1};
    dots=[];
    for(let y=3;y<R-2;y+=2)for(let x=1;x<C-1;x+=2)
      if(grid[y][x]===0&&Math.random()<.42)dots.push({x,y});
    sand=0;camera=Math.max(0,player.y-10);
    stageEl.textContent=String(level).padStart(2,"0");
  }

  function begin(){
    if(!active && level===1 && score===0){makeLevel();}
    active=true;overlay.classList.add("off");last=performance.now();
  }
  button.onclick=begin;

  function dash(dx,dy){
    if(!active||move)return;
    let x=player.x,y=player.y;
    while(true){
      const nx=x+dx,ny=y+dy;
      if(nx<0||nx>=C||ny<0||ny>=R||grid[ny][nx]===1)break;
      x=nx;y=ny;
      if(grid[y][x]===2)break;
    }
    if(x===player.x&&y===player.y)return;
    player.fromX=player.x;player.fromY=player.y;player.toX=x;player.toY=y;player.t=0;
    move={dx,dy,duration:Math.max(.075,Math.min(.19,Math.abs(x-player.x+y-player.y)*.012))};
    // Grab all relics crossed by the dash.
    const steps=Math.max(Math.abs(x-player.x),Math.abs(y-player.y));
    for(let i=1;i<=steps;i++){
      const px=player.x+dx*i,py=player.y+dy*i;
      const index=dots.findIndex(d=>d.x===px&&d.y===py);
      if(index>=0){dots.splice(index,1);score+=1;scoreEl.textContent=String(score).padStart(3,"0");}
    }
  }

  function end(won){
    active=false;move=null;
    if(won){
      level++;heading.textContent="TEMPLE CLEARED";
      message.textContent="The mask has found another buried passage. The next temple awaits.";
      button.textContent="DESCEND";
    }else{
      heading.textContent="BURIED IN THE SANDS";
      message.textContent="The dunes caught up. The temple remains—try another run.";
      button.textContent="TRY AGAIN";level=1;score=0;scoreEl.textContent="000";
    }
    overlay.classList.remove("off");
  }

  function update(dt){
    if(active){
      sand=Math.min(R+4,sand+dt*(.25+level*.012));
      if(move){
        player.t=Math.min(1,player.t+dt/move.duration);
        if(player.t>=1){
          player.x=player.toX;player.y=player.toY;move=null;
          if(grid[player.y][player.x]===2){end(true);return;}
        }
      }
      const target=Math.max(0,player.y-9);
      camera+=(target-camera)*Math.min(1,dt*7);
      if(player.y>R-sand-1){end(false);}
    }
    particles=particles.filter(p=>(p.life-=dt)>0);
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;}
  }

  function draw(now){
    ctx.fillStyle="#171719";ctx.fillRect(0,0,w,h);
    // Warm torchlight ambience.
    const bg=ctx.createRadialGradient(w*.5,h*.48,10,w*.5,h*.48,h*.72);
    bg.addColorStop(0,"#3a3021");bg.addColorStop(1,"#171719");
    ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
    if(!grid||!cell)return;
    const left=(w-C*cell)/2, top=(h-12*cell)/2+6;
    // Draw visible maze rows only.
    const start=Math.max(0,Math.floor(camera)-2), end=Math.min(R,Math.ceil(camera+h/cell)+2);
    for(let y=start;y<end;y++)for(let x=0;x<C;x++){
      const sx=left+x*cell, sy=top+(y-camera)*cell;
      if(grid[y][x]===1){
        ctx.fillStyle="#514332";ctx.fillRect(sx,sy,cell,cell);
        ctx.fillStyle="#68553a";ctx.fillRect(sx+1,sy+1,cell-2,Math.max(2,cell*.12));
        ctx.strokeStyle="#322b23";ctx.lineWidth=1;ctx.strokeRect(sx+.5,sy+.5,cell-1,cell-1);
        // Small chipped-stone marks.
        ctx.fillStyle="#302b24";ctx.fillRect(sx+cell*.25,sy+cell*.48,cell*.16,1.5);
      }else{
        ctx.fillStyle="#211e1a";ctx.fillRect(sx,sy,cell,cell);
        ctx.fillStyle="#29251f";ctx.fillRect(sx+2,sy+2,cell-4,1);
      }
      if(grid[y][x]===2){
        const pulse=.7+.3*Math.sin(now*4);
        ctx.fillStyle=`rgba(237,187,83,${pulse})`;
        ctx.fillRect(sx+cell*.2,sy+cell*.2,cell*.6,cell*.6);
        ctx.fillStyle="#fff0ae";ctx.fillRect(sx+cell*.38,sy+cell*.38,cell*.24,cell*.24);
      }
    }
    for(const d of dots){
      const sy=top+(d.y-camera+.5)*cell;
      if(sy<0||sy>h)continue;
      const x=left+(d.x+.5)*cell,r=Math.max(2,cell*.075);
      ctx.fillStyle="#f3c65e";ctx.fillRect(x-r,sy-r,r*2,r*2);
      ctx.fillStyle="#fff0aa";ctx.fillRect(x-r/2,sy-r/2,r,r);
    }
    // Rising sand wall, anchored to the bottom of the maze.
    const sandY=top+(R-sand-camera)*cell;
    if(sandY<h){
      const y=Math.max(0,sandY);
      const grad=ctx.createLinearGradient(0,y,0,h);
      grad.addColorStop(0,"#d59b43cc");grad.addColorStop(1,"#87562dcc");
      ctx.fillStyle=grad;ctx.fillRect(0,y,w,h-y);
      ctx.fillStyle="#f2c36b";ctx.fillRect(0,y,w,3);
      for(let i=0;i<16;i++){
        const sx=(i*67+now*13)%w;
        ctx.fillStyle="#f3cf83aa";ctx.fillRect(sx,y+8+(i*19)%Math.max(12,h-y),2,2);
      }
    }
    if(player){
      let px=player.x,py=player.y;
      if(move){const t=1-Math.pow(1-player.t,3);px=player.fromX+(player.toX-player.fromX)*t;py=player.fromY+(player.toY-player.fromY)*t;}
      const x=left+(px+.5)*cell,y=top+(py-camera+.5)*cell,r=cell*.36;
      ctx.save();ctx.shadowColor="#ffd15d";ctx.shadowBlur=13;
      ctx.fillStyle="#d9a844";ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#f7db88";ctx.beginPath();ctx.arc(x,y,r*.7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#40311b";
      ctx.fillRect(x-r*.44,y-r*.18,r*.2,r*.27);ctx.fillRect(x+r*.24,y-r*.18,r*.2,r*.27);
      ctx.fillRect(x-r*.23,y+r*.27,r*.46,r*.09);
      ctx.restore();
    }
  }

  function loop(t){
    const dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw(t/1000);requestAnimationFrame(loop);
  }
  addEventListener("keydown",e=>{
    if(dirs[e.key]){e.preventDefault();dash(...dirs[e.key]);}
    if(e.key===" "&&!active)begin();
  },{passive:false});
  canvas.addEventListener("pointerdown",e=>{swipe=[e.clientX,e.clientY];});
  canvas.addEventListener("pointerup",e=>{
    if(!swipe)return;const dx=e.clientX-swipe[0],dy=e.clientY-swipe[1];swipe=null;
    if(Math.hypot(dx,dy)<16)return;
    if(Math.abs(dx)>Math.abs(dy))dash(Math.sign(dx),0);else dash(0,Math.sign(dy));
  });
  makeLevel();
  // Start screen's first button starts the already generated maze; subsequent clears generate a fresh one.
  button.addEventListener("click",()=>{
    if(heading.textContent==="TEMPLE CLEARED"){makeLevel();active=true;}
    else if(heading.textContent==="BURIED IN THE SANDS"){makeLevel();active=true;}
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
