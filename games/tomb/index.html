<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Crypt</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05040a; }
  body {
    display: grid; place-items: center; color: #e9e6ff;
    font: 14px/1.4 "Courier New", monospace; -webkit-user-select: none; user-select: none;
  }
  .game {
    width: min(100vw, 480px); height: min(100vh, 900px); height: min(100dvh, 900px);
    position: relative; overflow: hidden; background: #07060d;
    box-shadow: 0 0 0 2px #1a1630, 0 0 60px #2ef2c822;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; }
  .hud {
    position: absolute; inset: 0 0 auto; z-index: 2; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; background: linear-gradient(#07060df0, #07060d00);
  }
  .hud div { font-weight: 700; letter-spacing: 2px; font-size: 13px; }
  .hud b { color: #2ef2c8; }
  .hud .coins b { color: #ff4fa3; }
  .overlay {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
    padding: 24px; background: #05040ad9; transition: opacity .2s;
  }
  .overlay.off { opacity: 0; pointer-events: none; }
  .card { text-align: center; max-width: 320px; }
  h1 {
    margin: 0 0 6px; font-size: 34px; letter-spacing: 4px; color: #2ef2c8;
    text-shadow: 0 0 12px #2ef2c8aa, 3px 3px 0 #6a3bff;
  }
  .sub { color: #ff4fa3; letter-spacing: 3px; font-size: 12px; margin-bottom: 18px; }
  p { color: #a9a3d6; line-height: 1.6; margin: 0 0 22px; font-size: 13px; }
  .best { color: #e9e6ff; margin-bottom: 18px; letter-spacing: 2px; font-size: 12px; }
  button {
    padding: 12px 26px; color: #07060d; background: #2ef2c8; border: 0;
    font: 700 14px "Courier New", monospace; letter-spacing: 3px; cursor: pointer;
    box-shadow: 4px 4px 0 #6a3bff;
  }
  button:hover { background: #8dfbe3; }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #6a3bff; }
</style>
</head>
<body>
<main class="game">
  <canvas id="c"></canvas>
  <div class="hud">
    <div>LVL <b id="stage">1</b></div>
    <div>SCORE <b id="score">0</b></div>
    <div class="coins">&#9670; <b id="coins">0</b></div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h1 id="heading">NEON CRYPT</h1>
      <div class="sub" id="sub">CLIMB OR DROWN</div>
      <p id="message">Swipe or use arrow keys / WASD. You slide until you hit a wall. Grab the dots, dodge the spikes, reach the gate before the flood gets you.</p>
      <div class="best" id="best"></div>
      <button id="button">PLAY</button>
    </div>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const button = document.getElementById("button");
  const stageEl = document.getElementById("stage");
  const scoreEl = document.getElementById("score");
  const coinsEl = document.getElementById("coins");
  const headingEl = document.getElementById("heading");
  const subEl = document.getElementById("sub");
  const messageEl = document.getElementById("message");
  const bestEl = document.getElementById("best");

  const COLS = 15;
  const SPEED = 32;
  const PAL = {
    bg: "#07060d", wall: "#100e1e", edge: "#2ef2c8", edgeDim: "#1a8f7a",
    dot: "#c9b8ff", coin: "#ff4fa3", spike: "#ff3b5c", flood: "#6a3bff",
    floodTop: "#b49bff", gate: "#ffe14f", body: "#ff9a3c", face: "#fff4e6"
  };
  const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  const KEYS = {
    ArrowUp: 0, w: 0, W: 0, ArrowDown: 1, s: 1, S: 1,
    ArrowLeft: 2, a: 2, A: 2, ArrowRight: 3, d: 3, D: 3
  };

  let w = 0, h = 0, cell = 16, dpr = 1;
  let state = "menu", level = 1, score = 0, coins = 0, best = 0;
  let L = null, player = null, queued = null, camera = 0, flood = 0, floodDelay = 0;
  let particles = [], shake = 0, flash = 0, last = 0, swipe = null;

  try { best = +localStorage.getItem("neoncrypt-best") || 0; } catch (e) {}

  function rand(n) { return Math.floor(Math.random() * n); }

  function slide(g, rows, x, y, dx, dy, exit) {
    const path = [];
    for (;;) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= rows || g[ny][nx] === 1) break;
      x = nx; y = ny; path.push(y * COLS + x);
      if (exit !== undefined && y * COLS + x === exit) break;
    }
    return { x, y, path };
  }

  function deadly(spikes, x, y) {
    for (const [dx, dy] of DIRS) {
      const s = spikes.get((y + dy) * COLS + (x + dx));
      if (s && s[0] === -dx && s[1] === -dy) return true;
    }
    return false;
  }

  function search(g, rows, sx, sy, spikes, exit) {
    const start = sy * COLS + sx;
    const dist = new Map([[start, 0]]);
    const traversed = new Set([start]);
    const queue = [start];
    while (queue.length) {
      const k = queue.shift();
      if (k === exit) continue;
      const x = k % COLS, y = (k / COLS) | 0;
      for (const [dx, dy] of DIRS) {
        const r = slide(g, rows, x, y, dx, dy, exit);
        if (!r.path.length) continue;
        const nk = r.y * COLS + r.x;
        if (nk !== exit && deadly(spikes, r.x, r.y)) continue;
        for (const p of r.path) traversed.add(p);
        if (!dist.has(nk)) { dist.set(nk, dist.get(k) + 1); queue.push(nk); }
      }
    }
    return { dist, traversed };
  }

  function generate(lvl) {
    const rows = 34 + Math.min(lvl, 12) * 4;
    const minMoves = Math.min(6 + lvl, 18);
    for (let attempt = 0; attempt < 400; attempt++) {
      const g = Array.from({ length: rows }, (_, y) =>
        Array.from({ length: COLS }, (_, x) => (x === 0 || x === COLS - 1 || y === 0 || y === rows - 1) ? 1 : 0));
      const segs = Math.floor(rows * (1.5 + Math.random() * 0.5));
      for (let i = 0; i < segs; i++) {
        let x = 1 + rand(COLS - 2), y = 1 + rand(rows - 4);
        const horiz = Math.random() < 0.55, len = 1 + rand(4);
        for (let j = 0; j < len; j++) {
          if (x > 0 && x < COLS - 1 && y > 0 && y < rows - 3) g[y][x] = 1;
          if (horiz) x++; else y++;
        }
      }
      const sy = rows - 2, sx = 1 + rand(COLS - 2);
      g[sy][sx] = 0;
      const open = search(g, rows, sx, sy, new Map());
      let exit = -1, top = rows;
      for (const k of open.dist.keys()) {
        const y = (k / COLS) | 0;
        if (y < top) { top = y; exit = k; }
      }
      if (top > 2 || open.dist.get(exit) < minMoves) continue;

      const spikes = new Map();
      const tries = Math.floor(rows * (0.25 + Math.min(lvl, 10) * 0.07));
      const trav = [...open.traversed];
      for (let i = 0; i < tries; i++) {
        const k = trav[rand(trav.length)];
        if (k === exit || k === sy * COLS + sx) continue;
        const x = k % COLS, y = (k / COLS) | 0;
        const [dx, dy] = DIRS[rand(4)];
        const wx = x + dx, wy = y + dy;
        if (wy <= 0 || wy >= rows - 1 || wx <= 0 || wx >= COLS - 1) continue;
        if (g[wy][wx] !== 1 || spikes.has(wy * COLS + wx)) continue;
        spikes.set(wy * COLS + wx, [-dx, -dy]);
        if (deadly(spikes, sx, sy) || !search(g, rows, sx, sy, spikes, exit).dist.has(exit)) spikes.delete(wy * COLS + wx);
      }

      const final = search(g, rows, sx, sy, spikes, exit);
      if (!final.dist.has(exit)) continue;
      for (let y = 1; y < rows - 1; y++)
        for (let x = 1; x < COLS - 1; x++)
          if (g[y][x] === 0 && !final.traversed.has(y * COLS + x)) g[y][x] = 1;

      const items = new Map();
      for (const k of final.traversed) {
        if (k === exit || k === sy * COLS + sx) continue;
        items.set(k, final.dist.has(k) && Math.random() < 0.18 ? 2 : 1);
      }
      return { g, rows, sx, sy, exit, ex: exit % COLS, ey: (exit / COLS) | 0, spikes, items };
    }
    return null;
  }

  function newLevel() {
    L = null;
    while (!L) L = generate(level);
    player = { x: L.sx, y: L.sy, px: L.sx, py: L.sy, dx: 0, dy: 0, tx: L.sx, ty: L.sy, moving: false, squash: 0, face: 1 };
    queued = null;
    camera = player.y - visibleRows() * 0.62;
    flood = L.rows + 3;
    floodDelay = 1.6;
    particles = [];
    updateHud();
  }

  function visibleRows() { return h / cell; }

  function updateHud() {
    stageEl.textContent = level;
    scoreEl.textContent = score;
    coinsEl.textContent = coins;
  }

  function showOverlay(title, sub, msg, btn) {
    headingEl.textContent = title;
    subEl.textContent = sub;
    messageEl.textContent = msg;
    button.textContent = btn;
    bestEl.textContent = best ? "BEST " + best : "";
    overlay.classList.remove("off");
    button.focus();
  }

  function start() {
    if (state === "playing") return;
    if (state === "menu" || state === "dead") { level = 1; score = 0; coins = 0; }
    newLevel();
    state = "playing";
    overlay.classList.add("off");
  }

  function die() {
    if (state !== "playing") return;
    state = "dead";
    shake = 0.4; flash = 1;
    burst(player.px, player.py, PAL.body, 30);
    if (score > best) {
      best = score;
      try { localStorage.setItem("neoncrypt-best", best); } catch (e) {}
    }
    setTimeout(() => showOverlay("GAME OVER", "LEVEL " + level, "Score " + score + ". The crypt keeps you this time.", "RETRY"), 650);
  }

  function win() {
    state = "cleared";
    score += 50 + level * 10;
    updateHud();
    burst(player.px, player.py, PAL.gate, 40);
    if (score > best) {
      best = score;
      try { localStorage.setItem("neoncrypt-best", best); } catch (e) {}
    }
    level++;
    setTimeout(() => showOverlay("CLEARED", "LEVEL " + (level - 1) + " DONE", "Score " + score + ". The next floor is deeper and the flood is faster.", "NEXT"), 500);
  }

  function tryMove(d) {
    if (state !== "playing") return;
    if (player.moving) { queued = d; return; }
    const [dx, dy] = DIRS[d];
    const r = slide(L.g, L.rows, player.x, player.y, dx, dy, L.exit);
    if (!r.path.length) return;
    player.dx = dx; player.dy = dy; player.tx = r.x; player.ty = r.y; player.moving = true;
    if (dx) player.face = dx;
  }

  function collect(x, y) {
    const k = y * COLS + x;
    const it = L.items.get(k);
    if (!it) return;
    L.items.delete(k);
    if (it === 2) { coins++; score += 5; burst(x, y, PAL.coin, 8); }
    else { score += 1; }
    updateHud();
  }

  function arrive() {
    player.moving = false;
    player.px = player.x = player.tx;
    player.py = player.y = player.ty;
    player.squash = 1;
    shake = Math.max(shake, 0.08);
    burst(player.x + player.dx * 0.45, player.y + player.dy * 0.45, PAL.edge, 6);
    if (player.y * COLS + player.x === L.exit) { win(); return; }
    if (deadly(L.spikes, player.x, player.y)) { die(); return; }
    if (queued !== null) { const q = queued; queued = null; tryMove(q); }
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 7;
      particles.push({ x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + Math.random() * 0.4, color });
    }
  }

  function update(dt) {
    if (state === "playing") {
      if (player.moving) {
        let step = SPEED * dt;
        while (step > 0 && player.moving) {
          const remain = Math.abs(player.tx - player.px) + Math.abs(player.ty - player.py);
          const s = Math.min(step, remain);
          player.px += player.dx * s; player.py += player.dy * s; step -= s;
          const cx = Math.round(player.px), cy = Math.round(player.py);
          if (cx !== player.x || cy !== player.y) {
            player.x = cx; player.y = cy;
            collect(cx, cy);
          }
          if (s >= remain) arrive();
        }
        if (Math.random() < 0.7) particles.push({ x: player.px + 0.5, y: player.py + 0.5, vx: 0, vy: 0, life: 0.18, color: PAL.body });
      }
      if (state === "playing") {
        if (floodDelay > 0) floodDelay -= dt;
        else flood -= dt * (0.85 + Math.min(level, 15) * 0.09);
        flood = Math.min(flood, player.py + visibleRows() * 0.42);
        if (player.py + 0.6 > flood) die();
      }
    }
    if (player) {
      const target = player.py - visibleRows() * 0.62;
      camera += (target - camera) * Math.min(1, dt * 8);
      player.squash = Math.max(0, player.squash - dt * 6);
    }
    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt * 2.5);
    particles = particles.filter(p => (p.life -= dt) > 0);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; }
  }

  function isWall(x, y) {
    return x < 0 || x >= COLS || y < 0 || y >= L.rows || L.g[y][x] === 1;
  }

  function drawSpike(sx, sy, dir) {
    const c = cell, n = 3, [dx, dy] = dir;
    ctx.fillStyle = PAL.spike;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = (i + 0.5) / n, half = 0.5 / n;
      if (dy) {
        const base = dy > 0 ? sy + c : sy, tip = dy > 0 ? sy + c + c * 0.38 : sy - c * 0.38;
        ctx.moveTo(sx + (a - half) * c, base); ctx.lineTo(sx + a * c, tip); ctx.lineTo(sx + (a + half) * c, base);
      } else {
        const base = dx > 0 ? sx + c : sx, tip = dx > 0 ? sx + c + c * 0.38 : sx - c * 0.38;
        ctx.moveTo(base, sy + (a - half) * c); ctx.lineTo(tip, sy + a * c); ctx.lineTo(base, sy + (a + half) * c);
      }
    }
    ctx.fill();
  }

  function drawPlayer(t) {
    const x = (player.px + 0.5) * cell, y = (player.py - camera + 0.5) * cell;
    const s = cell * 0.82, sq = player.squash * 0.25;
    const sxs = player.moving ? (player.dx ? 1.15 : 0.88) : 1 + (player.dy ? sq : -sq);
    const sys = player.moving ? (player.dy ? 1.15 : 0.88) : 1 + (player.dx ? sq : -sq);
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.scale(sxs * player.face, sys);
    const u = s / 8;
    const px = (cx, cy, cw, ch, col) => { ctx.fillStyle = col; ctx.fillRect(-s / 2 + cx * u, -s / 2 + cy * u, cw * u, ch * u); };
    ctx.shadowColor = PAL.body; ctx.shadowBlur = cell * 0.5;
    px(0, 0, 2, 3, PAL.body); px(6, 0, 2, 3, PAL.body);
    px(0, 2, 8, 5, PAL.body);
    ctx.shadowBlur = 0;
    px(1, 1, 1, 1, "#ffcf9c"); px(6, 1, 1, 1, "#ffcf9c");
    px(2, 4, 4, 4, PAL.face); px(1, 6, 6, 2, PAL.face);
    const blink = Math.sin(t * 2.3) > 0.97;
    px(2, 3, 1, blink ? 0.4 : 1, "#07060d"); px(5, 3, 1, blink ? 0.4 : 1, "#07060d");
    px(3.5, 5, 1, 1, "#07060d");
    ctx.restore();
  }

  function draw(t) {
    ctx.fillStyle = PAL.bg;
    ctx.fillRect(0, 0, w, h);
    if (!L) return;
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 20, (Math.random() - 0.5) * shake * 20);
    const offX = (w - COLS * cell) / 2;
    ctx.translate(Math.round(offX), 0);
    const y0 = Math.max(0, Math.floor(camera) - 1), y1 = Math.min(L.rows, Math.ceil(camera + h / cell) + 1);
    const ly = y => Math.round((y - camera) * cell);
    const lw = Math.max(2, Math.round(cell / 8));

    for (let y = y0; y < y1; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!isWall(x, y)) continue;
        const sx = x * cell, sy = ly(y);
        ctx.fillStyle = PAL.wall;
        ctx.fillRect(sx, sy, cell, cell);
        if ((x * 7 + y * 13) % 5 === 0) { ctx.fillStyle = "#17142b"; ctx.fillRect(sx + cell * 0.3, sy + cell * 0.3, cell * 0.2, cell * 0.2); }
      }
    }
    ctx.save();
    ctx.shadowColor = PAL.edge; ctx.shadowBlur = cell * 0.4;
    ctx.fillStyle = PAL.edge;
    for (let y = y0; y < y1; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!isWall(x, y)) continue;
        const sx = x * cell, sy = ly(y);
        if (y > 0 && !isWall(x, y - 1)) ctx.fillRect(sx, sy, cell, lw);
        if (y < L.rows - 1 && !isWall(x, y + 1)) ctx.fillRect(sx, sy + cell - lw, cell, lw);
        if (x > 0 && !isWall(x - 1, y)) ctx.fillRect(sx, sy, lw, cell);
        if (x < COLS - 1 && !isWall(x + 1, y)) ctx.fillRect(sx + cell - lw, sy, lw, cell);
      }
    }
    ctx.restore();

    for (const [k, dir] of L.spikes) {
      const x = k % COLS, y = (k / COLS) | 0;
      if (y < y0 || y >= y1) continue;
      drawSpike(x * cell, ly(y), dir);
    }

    for (const [k, it] of L.items) {
      const x = k % COLS, y = (k / COLS) | 0;
      if (y < y0 || y >= y1) continue;
      const cx = x * cell + cell / 2, cy = ly(y) + cell / 2;
      if (it === 1) {
        const r = Math.max(1, Math.round(cell * 0.09));
        ctx.fillStyle = PAL.dot;
        ctx.fillRect(Math.round(cx - r), Math.round(cy - r), r * 2, r * 2);
      } else {
        const r = cell * (0.26 + Math.sin(t * 5 + k) * 0.04);
        ctx.save();
        ctx.shadowColor = PAL.coin; ctx.shadowBlur = cell * 0.5;
        ctx.fillStyle = PAL.coin;
        ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r * 0.75, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r * 0.75, cy); ctx.fill();
        ctx.restore();
      }
    }

    if (L.ey >= y0 && L.ey < y1) {
      const gx = L.ex * cell, gy = ly(L.ey), p = 0.6 + 0.4 * Math.sin(t * 6);
      ctx.save();
      ctx.shadowColor = PAL.gate; ctx.shadowBlur = cell * p;
      ctx.strokeStyle = PAL.gate; ctx.lineWidth = lw;
      ctx.strokeRect(gx + cell * 0.12, gy + cell * 0.12, cell * 0.76, cell * 0.76);
      ctx.globalAlpha = p;
      ctx.fillStyle = PAL.gate;
      ctx.fillRect(gx + cell * 0.34, gy + cell * 0.34, cell * 0.32, cell * 0.32);
      ctx.restore();
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.fillStyle = p.color;
      const s = Math.max(2, cell * 0.14);
      ctx.fillRect(p.x * cell - s / 2, (p.y - camera) * cell - s / 2, s, s);
    }
    ctx.globalAlpha = 1;

    if (state !== "dead" || flash > 0.5) drawPlayer(t);

    const fy = ly(flood);
    if (fy < h) {
      const top = Math.max(-cell, fy);
      ctx.fillStyle = PAL.flood;
      ctx.globalAlpha = 0.82;
      ctx.beginPath();
      ctx.moveTo(-offX, h);
      for (let x = -offX; x <= w; x += 6) ctx.lineTo(x, top + Math.sin(x * 0.05 + t * 4) * cell * 0.15);
      ctx.lineTo(w, h);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = PAL.floodTop;
      for (let x = -offX; x <= w; x += 6) ctx.fillRect(x, top + Math.sin(x * 0.05 + t * 4) * cell * 0.15 - 1, 6, 2);
    }
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,59,92," + flash * 0.35 + ")";
      ctx.fillRect(0, 0, w, h);
    }
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    w = r.width; h = r.height;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    cell = Math.floor(w / COLS);
  }

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw(now / 1000);
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => { last = performance.now(); });
  window.addEventListener("keydown", e => {
    if (e.key in KEYS) { e.preventDefault(); tryMove(KEYS[e.key]); return; }
    if ((e.key === " " || e.key === "Enter") && state !== "playing") { e.preventDefault(); start(); }
  });
  button.addEventListener("click", e => { e.stopPropagation(); start(); });

  canvas.addEventListener("pointerdown", e => {
    swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", e => {
    if (!swipe || swipe.id !== e.pointerId) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.hypot(dx, dy) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) tryMove(dx > 0 ? 3 : 2); else tryMove(dy > 0 ? 1 : 0);
    swipe.x = e.clientX; swipe.y = e.clientY;
  });
  const endSwipe = () => { swipe = null; };
  canvas.addEventListener("pointerup", endSwipe);
  canvas.addEventListener("pointercancel", endSwipe);

  resize();
  level = 1;
  newLevel();
  showOverlay("NEON CRYPT", "CLIMB OR DROWN", messageEl.textContent, "PLAY");
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
