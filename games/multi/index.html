<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0d0f14;--card:#161a23;--line:#262c3a;--fg:#e8ecf3;--mut:#8b93a7;--acc:#5eead4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#menu{position:fixed;inset:0;overflow:auto;padding:40px 16px}
h1{text-align:center;font-size:44px;letter-spacing:1px}
.sub{text-align:center;color:var(--mut);margin:8px 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;max-width:1000px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:transform .15s,border-color .15s;text-align:left;color:inherit;font:inherit}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--acc);outline:none}
.card i{display:block;height:6px;border-radius:3px;margin-bottom:14px}
.card b{display:block;font-size:20px;margin-bottom:6px}
.card span{color:var(--mut);font-size:14px;line-height:1.45}
#game{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000}
canvas{width:min(100vw,160vh);height:min(100vh,62.5vw);display:block;touch-action:none}
#back{position:fixed;top:10px;left:10px;z-index:5;background:rgba(20,24,32,.85);color:#fff;border:1px solid #333a4a;border-radius:8px;padding:8px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
#back:hover{border-color:var(--acc)}
#fps{position:fixed;inset:0;display:none;z-index:3;background:#000;font-family:'Barlow Condensed',system-ui,sans-serif;color:#eef0f2;user-select:none}
#glc{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;display:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#hud.on{display:block}
#xh{position:absolute;left:50%;top:50%;--g:10px;transition:opacity .1s}
#xh i{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#xh i:nth-child(1){width:2px;height:8px;left:-1px;top:calc(-8px - var(--g))}
#xh i:nth-child(2){width:2px;height:8px;left:-1px;top:var(--g)}
#xh i:nth-child(3){width:8px;height:2px;top:-1px;left:calc(-8px - var(--g))}
#xh i:nth-child(4){width:8px;height:2px;top:-1px;left:var(--g)}
#xh b{position:absolute;width:2px;height:2px;left:-1px;top:-1px;background:#fff}
#hm{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px;opacity:0}
#hm:before,#hm:after{content:'';position:absolute;left:13px;top:0;width:2px;height:28px;background:linear-gradient(#fff 0 35%,transparent 35% 65%,#fff 65%)}
#hm:before{transform:rotate(45deg)}#hm:after{transform:rotate(-45deg)}
#hm.k:before,#hm.k:after{background:linear-gradient(#ff4d4d 0 35%,transparent 35% 65%,#ff4d4d 65%)}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0 38vh,#000 38.3vh)}
#scope .sl{position:absolute;background:rgba(0,0,0,.85)}#scope .h{left:0;right:0;top:50%;height:1px}#scope .v{top:0;bottom:0;left:50%;width:1px}
#vig{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(150,0,0,.8))}
#dirs .dh{position:absolute;left:50%;top:50%;animation:dh 1.1s forwards}
#dirs .dh:before{content:'';position:absolute;left:-60px;top:-160px;width:120px;height:34px;border-top:4px solid rgba(230,60,50,.9);border-radius:50%}
@keyframes dh{to{opacity:0}}
#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;background:rgba(10,12,14,.55);padding:5px 16px;border-radius:4px;font-size:20px;font-weight:600}
#top small{font-size:13px;color:#b8bcc2;font-weight:500}#top b{font-size:24px}
#feed{position:absolute;top:14px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:17px;font-weight:600}
#feed div{background:rgba(10,12,14,.55);padding:3px 10px;border-radius:3px}#feed .me{background:rgba(242,184,75,.28)}
#feed em{font-style:normal;color:#b8bcc2;font-weight:500;margin:0 7px;font-size:14px}
#note{position:absolute;left:50%;top:62%;transform:translateX(-50%);text-align:center;font-size:24px;font-weight:700;opacity:0;white-space:nowrap}
#note.show{animation:nt 1.8s forwards}#note small{display:block;font-size:17px;color:#f2b84b}
@keyframes nt{0%{opacity:0;transform:translate(-50%,8px)}10%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
#aim{position:absolute;left:50%;top:calc(50% + 32px);transform:translateX(-50%);font-size:16px;font-weight:600;color:#ff8a7a}
#rl{position:absolute;left:50%;top:calc(50% + 56px);transform:translateX(-50%);width:110px;height:3px;background:rgba(255,255,255,.15);display:none}
#rl b{display:block;height:100%;background:#f2b84b;width:0}
#radar{position:absolute;left:16px;bottom:100px;width:150px;height:150px;border-radius:50%;background:rgba(10,12,14,.5);border:1px solid rgba(255,255,255,.12)}
#hpbox{position:absolute;left:16px;bottom:18px;width:250px;background:rgba(10,12,14,.55);padding:8px 12px;border-radius:4px}
#hpn{font-size:34px;font-weight:700;line-height:1}#hpbar{height:6px;background:rgba(255,255,255,.12);margin-top:6px}
#hpfill{height:100%;background:#8fd16a;transition:width .15s}#clsn{font-size:14px;color:#b8bcc2;margin-top:4px}
#ammo{position:absolute;right:16px;bottom:18px;text-align:right;background:rgba(10,12,14,.55);padding:8px 14px;border-radius:4px;min-width:190px}
#amn{font-size:40px;font-weight:700;line-height:1}#amn small{font-size:20px;color:#b8bcc2;font-weight:500}
#wn{font-size:16px;margin-top:2px}#nd{font-size:13px;color:#b8bcc2}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:rgba(10,12,14,.88);padding:16px 20px;border-radius:6px;min-width:440px}
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,12,.5);backdrop-filter:blur(3px);overflow:auto;padding:60px 16px 16px}
#panel.on{display:flex}
.pn{background:rgba(18,20,24,.93);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:24px;max-width:1060px;width:100%;display:flex;gap:28px;flex-wrap:wrap;margin:auto}
.pn .col{flex:1 1 520px;min-width:0}.pn .side{flex:1 1 280px}
.pn h2{font-size:42px;font-weight:700;line-height:1.1}.pn h3{font-size:18px;color:#b8bcc2;font-weight:600;margin-bottom:8px}
.mut{color:#9aa0a8;margin:4px 0 14px;font-size:17px}
.ccs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.cc{all:unset;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:12px 14px;transition:border-color .12s,background .12s,transform .12s}
.cc:hover{border-color:rgba(255,255,255,.25);transform:translateY(-2px)}.cc.on{border-color:#f2b84b;background:rgba(242,184,75,.08)}
.cn{font-size:24px;font-weight:700}.cd{font-size:15px;color:#9aa0a8;margin:2px 0 8px;min-height:36px}
.st{display:flex;align-items:center;gap:8px;font-size:13px;color:#9aa0a8;margin:3px 0}.st span{width:46px}.st i{flex:1;height:4px;background:rgba(255,255,255,.1)}.st b{display:block;height:100%;background:#d8dadd}
.cw{font-size:15px;margin-top:8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go{all:unset;cursor:pointer;background:#f2b84b;color:#16130c;font-weight:700;font-size:22px;padding:9px 30px;border-radius:4px}
.go:hover{filter:brightness(1.08)}.go[disabled]{opacity:.5;cursor:default}
.go.ghost{background:transparent;color:#eef0f2;border:1px solid rgba(255,255,255,.25);font-size:18px;padding:9px 20px}
.sens{font-size:15px;color:#b8bcc2;display:flex;align-items:center;gap:8px}
.nm{display:flex;gap:10px;align-items:center;font-size:16px;color:#b8bcc2}
.nm input{font:inherit;font-size:18px;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:5px 10px;outline:none;width:180px}
.keys{font-size:14px;color:#80868f;margin-top:14px;line-height:1.5}
.sb{width:100%;border-collapse:collapse;font-size:17px}
.sb th{text-align:left;color:#80868f;font-weight:500;font-size:13px;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.04)}.sb tr.me td{color:#f2b84b}
.kb{font-size:28px}.kb b{color:#ff8a7a}
@media(max-width:640px){.ccs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="menu">
<h1>Arcade Box</h1>
<p class="sub">pick a game. esc or the back button returns here</p>
<div class="grid" id="cards"></div>
</div>
<div id="game"><button id="back">Back</button><canvas id="c" width="960" height="600"></canvas>
<div id="fps"><canvas id="glc"></canvas>
<div id="hud"><div id="vig"></div><div id="dirs"></div><div id="scope"><div class="sl h"></div><div class="sl v"></div></div>
<div id="xh"><i></i><i></i><i></i><i></i><b></b></div><div id="hm"></div><div id="aim"></div><div id="rl"><b></b></div>
<div id="top"><span id="tk"></span><small>first to 25</small><span id="tl"></span></div><div id="feed"></div><div id="note"></div>
<canvas id="radar" width="150" height="150"></canvas>
<div id="hpbox"><div id="hpn"></div><div id="hpbar"><div id="hpfill"></div></div><div id="clsn"></div></div>
<div id="ammo"><div id="amn"></div><div id="wn"></div><div id="nd"></div></div><div id="board"></div></div>
<div id="panel"></div></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=960,H=600;
const keys={},mouse={x:W/2,y:H/2,moved:false};
let cur=null,down0=null;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function store(k,v){try{if(v===undefined)return +localStorage.getItem('arcade_'+k)||0;localStorage.setItem('arcade_'+k,v)}catch(e){}return 0}
function best(k,s){const b=store(k);if(s>b){store(k,s);return s}return b}
function text(t,x,y,size,color,align,base){ctx.font='bold '+size+'px system-ui,sans-serif';ctx.fillStyle=color||'#fff';ctx.textAlign=align||'center';ctx.textBaseline=base||'middle';ctx.fillText(t,x,y)}
function overlay(title,sub,sub2){ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,0,W,H);text(title,W/2,H/2-36,54);if(sub)text(sub,W/2,H/2+24,22,'#c3c9d6');if(sub2)text(sub2,W/2,H/2+58,18,'#8b93a7')}

let AC=null,NB=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function noise(len,freq,vol){const a=audio();if(!a)return;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=NB;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t,Math.random()*.5);s.stop(t+len)}
function tone(freq,len,vol,type,to){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type||'square';o.frequency.setValueAtTime(freq,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+len);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len)}

const Snake={
  start(){this.reset();this.best=store('snake')},
  reset(){this.cols=32;this.rows=20;this.cs=30;this.s=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];this.dir={x:1,y:0};this.q=[];this.t=0;this.score=0;this.dead=false;this.go=false;this.food=this.place()},
  place(){let p;do{p={x:Math.random()*this.cols|0,y:Math.random()*this.rows|0}}while(this.s.some(c=>c.x===p.x&&c.y===p.y));return p},
  key(c){
    if(this.dead){if(c==='Space'||c==='Enter')this.reset();return}
    const m={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[c];
    if(!m)return;
    const l=this.q.length?this.q[this.q.length-1]:this.dir;
    if(m[0]===-l.x&&m[1]===-l.y)return;
    this.go=true;
    if(m[0]===l.x&&m[1]===l.y)return;
    if(this.q.length<3)this.q.push({x:m[0],y:m[1]});
  },
  down(){if(this.dead)this.reset()},
  swipe(dx,dy){Math.abs(dx)>Math.abs(dy)?this.key(dx>0?'ArrowRight':'ArrowLeft'):this.key(dy>0?'ArrowDown':'ArrowUp')},
  update(dt){
    if(this.dead||!this.go)return;
    this.t+=dt;const step=Math.max(.055,.11-this.score*.0015);
    while(this.t>=step&&!this.dead){this.t-=step;this.tick()}
  },
  tick(){
    if(this.q.length)this.dir=this.q.shift();
    const h={x:this.s[0].x+this.dir.x,y:this.s[0].y+this.dir.y},grow=h.x===this.food.x&&h.y===this.food.y;
    const body=grow?this.s:this.s.slice(0,-1);
    if(h.x<0||h.y<0||h.x>=this.cols||h.y>=this.rows||body.some(c=>c.x===h.x&&c.y===h.y)){this.dead=true;this.best=best('snake',this.score);noise(.4,600,.3);return}
    this.s.unshift(h);
    if(grow){this.score++;tone(660,.08,.08,'square',990);if(this.s.length<this.cols*this.rows)this.food=this.place()}else this.s.pop();
  },
  draw(){
    const cs=this.cs;
    for(let y=0;y<this.rows;y++)for(let x=0;x<this.cols;x++){ctx.fillStyle=(x+y)%2?'#131823':'#161c28';ctx.fillRect(x*cs,y*cs,cs,cs)}
    ctx.fillStyle='#ff5d6c';ctx.beginPath();ctx.arc(this.food.x*cs+cs/2,this.food.y*cs+cs/2,cs*.36,0,7);ctx.fill();
    const n=this.s.length;
    this.s.forEach((c,i)=>{const l=60-i/n*25;ctx.fillStyle='hsl(150,65%,'+l+'%)';ctx.beginPath();ctx.roundRect(c.x*cs+2,c.y*cs+2,cs-4,cs-4,7);ctx.fill()});
    const h=this.s[0];ctx.fillStyle='#0d0f14';
    const ex=this.dir.y?6:0,ey=this.dir.x?6:0;
    ctx.beginPath();ctx.arc(h.x*cs+cs/2+ex+this.dir.x*5,h.y*cs+cs/2+ey+this.dir.y*5,3,0,7);ctx.arc(h.x*cs+cs/2-ex+this.dir.x*5,h.y*cs+cs/2-ey+this.dir.y*5,3,0,7);ctx.fill();
    text('Score '+this.score+'   Best '+Math.max(this.best,this.score),W-16,22,20,'#fff','right');
    if(!this.go&&!this.dead)overlay('Snake','arrows or wasd to move','eat the red dots, dont hit yourself');
    if(this.dead)overlay('Game Over','score '+this.score+'  best '+this.best,'space or click to retry');
  }
};

const Pong={
  start(){this.p=H/2;this.a=H/2;this.ps=0;this.as=0;this.over=false;this.serve(1);this.wait=1.5},
  serve(d){this.b={x:W/2,y:H/2,vx:430*d,vy:(Math.random()*2-1)*220};this.wait=.9;this.trail=[]},
  key(c){if(this.over&&(c==='Space'||c==='Enter'))this.start()},
  down(){if(this.over)this.start()},
  update(dt){
    if(this.over)return;
    if(keys.KeyW||keys.ArrowUp)this.p-=560*dt;
    if(keys.KeyS||keys.ArrowDown)this.p+=560*dt;
    if(mouse.moved){this.p=mouse.y;mouse.moved=false}
    this.p=clamp(this.p,55,H-55);
    const b=this.b,target=b.vx>0?b.y+Math.sin(performance.now()/300)*25:H/2,sp=330+Math.min(this.ps,6)*25;
    this.a+=clamp(target-this.a,-sp*dt,sp*dt);this.a=clamp(this.a,55,H-55);
    if(this.wait>0){this.wait-=dt;return}
    const n=Math.ceil(Math.hypot(b.vx,b.vy)*dt/6);
    for(let i=0;i<n;i++){
      const h=dt/n;b.x+=b.vx*h;b.y+=b.vy*h;
      if(b.y<9){b.y=9;b.vy=Math.abs(b.vy);tone(300,.04,.05)}
      if(b.y>H-9){b.y=H-9;b.vy=-Math.abs(b.vy);tone(300,.04,.05)}
      if(b.vx<0&&b.x-9<44&&b.x>20&&Math.abs(b.y-this.p)<60){b.x=53;b.vx=Math.min(Math.abs(b.vx)*1.06,1150);b.vy=(b.y-this.p)/55*420;tone(500,.05,.07)}
      if(b.vx>0&&b.x+9>W-44&&b.x<W-20&&Math.abs(b.y-this.a)<60){b.x=W-53;b.vx=-Math.min(Math.abs(b.vx)*1.06,1150);b.vy=(b.y-this.a)/55*420;tone(500,.05,.07)}
    }
    this.trail.push({x:b.x,y:b.y});if(this.trail.length>10)this.trail.shift();
    if(b.x<-30){this.as++;tone(200,.3,.08,'sawtooth',90);this.serve(-1)}
    if(b.x>W+30){this.ps++;tone(700,.2,.08,'square',1200);this.serve(1)}
    if(this.ps>=7||this.as>=7){this.over=true;if(this.ps>=7)store('pongwins',store('pongwins')+1)}
  },
  draw(){
    ctx.fillStyle='#0b1020';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1d2640';for(let y=10;y<H;y+=34)ctx.fillRect(W/2-3,y,6,18);
    text(this.ps,W/2-80,60,56,'#3b4a75');text(this.as,W/2+80,60,56,'#3b4a75');
    this.trail.forEach((t,i)=>{ctx.fillStyle='rgba(94,234,212,'+i/30+')';ctx.beginPath();ctx.arc(t.x,t.y,9*i/10,0,7);ctx.fill()});
    ctx.fillStyle='#5eead4';ctx.beginPath();ctx.roundRect(30,this.p-55,14,110,6);ctx.fill();
    ctx.fillStyle='#f472b6';ctx.beginPath();ctx.roundRect(W-44,this.a-55,14,110,6);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.b.x,this.b.y,9,0,7);ctx.fill();
    text('first to 7   w/s, arrows or mouse',W/2,H-18,15,'#4b5677');
    if(this.over)overlay(this.ps>=7?'You Win':'CPU Wins',this.ps+' - '+this.as,'space or click to play again');
  }
};

const Breakout={
  start(){this.lives=3;this.score=0;this.level=1;this.over=false;this.parts=[];this.best=store('breakout');this.build();this.reset()},
  build(){
    this.bricks=[];const cols=12,rows=Math.min(5+this.level,9),bw=72,bh=22,g=5,ox=(W-cols*(bw+g)+g)/2;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      if(this.level%3===2&&(r+c)%5===0)continue;
      this.bricks.push({x:ox+c*(bw+g),y:56+r*(bh+g),w:bw,h:bh,hp:this.level>1&&r<this.level-1?2:1,hue:(r*28+this.level*40)%360});
    }
    this.speed=430+this.level*35;
  },
  reset(){this.px=W/2;this.stuck=true;this.ball={x:W/2,y:H-60,vx:0,vy:0}},
  launch(){if(this.over){this.start();return}if(this.stuck){this.stuck=false;const a=(Math.random()-.5)*.8;this.ball.vx=this.speed*Math.sin(a);this.ball.vy=-this.speed*Math.cos(a)}},
  key(c){if(c==='Space'||c==='Enter')this.launch()},
  down(){this.launch()},
  update(dt){
    this.parts=this.parts.filter(p=>(p.t-=dt)>0);this.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt});
    if(this.over)return;
    const pw=130,py=H-40;
    if(keys.ArrowLeft||keys.KeyA)this.px-=760*dt;
    if(keys.ArrowRight||keys.KeyD)this.px+=760*dt;
    if(mouse.moved){this.px=mouse.x;mouse.moved=false}
    this.px=clamp(this.px,pw/2,W-pw/2);
    const b=this.ball,r=8;

        m.g.rotation.x=e*1.45;m.legL.rotation.x=m.legR.rotation.x=-e*.3;m.armL.rotation.x=m.armR.rotation.x=Math.PI/2+e*.8;
        if(u<1){m.g.position.x+=b.dvx*dt*(1-u);m.g.position.z+=b.dvz*dt*(1-u)}
        if(b.deadT>2.6)m.g.position.y-=dt*.9;if(b.deadT>3.3)m.g.visible=false;
      }
      b.respawnT-=dt;if(b.respawnT<=0&&this.state!=='end'){if(Math.random()<.35)this.setClass(b,CLASSES[Math.random()*4|0]);this.spawn(b)}
      return;
    }
    b.hitT-=dt;b.flashT-=dt;b.prot-=dt;b.switchT-=dt;b.cd-=dt;
    if(T>=b.think){b.think=T+.12+Math.random()*.1;this.botSense(b)}
    const t=b.see&&b.target&&b.target.alive?b.target:null;
    let mx=0,mz=0,spd=9.2*b.cls.spd;
    let w=b.w[b.wi];
    if(t){
      const tx=t.pos.x-P.x,tz=t.pos.z-P.z,dist=Math.hypot(tx,tz)||.01;
      let want=0;if(b.cls.id==='scout')want=dist<11?1:0;else if(b.cls.id==='sniper')want=dist<9?1:0;
      if(want!==b.wi&&b.switchT<=0&&b.w[want]){b.w[b.wi].rt=0;b.wi=want;b.switchT=.6;b.cd=Math.max(b.cd,.4);w=b.w[b.wi];b.spin=0}
      const aimH=t.pos.y+(b.skill>.85?1.6:1.15),dy=aimH-(P.y+1.6);
      b.errT-=dt;if(b.errT<=0){b.errT=.2+Math.random()*.25;const mg=b.err*(1+Math.hypot(t.vel.x,t.vel.z)*.05)*(t.ground?1:1.4);b.ex=(Math.random()-.5)*2*mg;b.ey=(Math.random()-.5)*mg}
      b.err=Math.max(b.baseErr,b.err-dt*.07);
      const dyaw=Math.atan2(-tx,-tz)+b.ex,dp=Math.atan2(dy,dist)+b.ey,ad=angDiff(dyaw,b.yaw);
      b.yaw+=clamp(ad,-b.turn*dt,b.turn*dt);b.pitch+=clamp(dp-b.pitch,-3*dt,3*dt);
      b.strafeT-=dt;if(b.strafeT<=0){b.strafeT=.45+Math.random()*1.2;b.sdir=[-1,1,-1,1,0][Math.random()*5|0]}
      const pref=w.d.pref,fwd=dist>pref*1.2?1:dist<pref*.55?-1:0,fx=tx/dist,fz=tz/dist,sm=w.d.scope?.4:1;
      mx=fx*fwd-fz*b.sdir*sm;mz=fz*fwd+fx*b.sdir*sm;const ml=Math.hypot(mx,mz);if(ml>0){mx/=ml;mz/=ml}
      if(w.d.scope)spd*=.6;
      if(b.ground&&Math.random()<dt*b.hop)this.jump(b);
      if(!b.ground&&b.jumps===1&&b.vel.y<2&&Math.random()<dt*b.hop*2)this.jump(b);
      if(b.react>0)b.react-=dt;
      else if(Math.abs(ad)<.12)this.botFire(b,dt);
      else if(w.d.spin)b.spin=Math.max(0,b.spin-dt);
    }else{
      if(!b.path||b.pi>=b.path.length||T>b.repath){
        let gx,gz;
        if(b.target&&b.target.alive&&T-b.lastSeenT<6){gx=b.lx;gz=b.lz}
        else{const al=this.ents.filter(e=>e!==b&&e.alive);if(al.length&&Math.random()<.75){const e=this.me.alive&&Math.random()<.35?this.me:al[Math.random()*al.length|0];gx=e.pos.x;gz=e.pos.z}else{const s=this.spawns[Math.random()*this.spawns.length|0];gx=s[0];gz=s[1]}}
        b.path=this.path(P.x,P.z,gx,gz);b.pi=0;b.repath=T+2.2+Math.random()*1.5;
      }
      if(b.path&&b.pi<b.path.length){const q=b.path[b.pi],ex=q[0]-P.x,ez=q[1]-P.z,dd=Math.hypot(ex,ez);if(dd<1.4)b.pi++;else{mx=ex/dd;mz=ez/dd}}
      if(mx||mz)b.yaw+=clamp(angDiff(Math.atan2(-mx,-mz),b.yaw),-6*dt,6*dt);
      b.pitch*=Math.exp(-dt*4);
      if(w.d.spin)b.spin=Math.max(0,b.spin-dt);
      if(w.rt<=0&&w.ammo<w.d.mag*.5)w.rt=w.d.rl;
    }
    if(w.rt>0){w.rt-=dt;if(w.rt<=0){w.rt=0;w.ammo=w.d.mag}}
    this.phys(b,mx,mz,spd,dt);
    if((mx||mz)&&b.ground&&b.blocked)this.jump(b);
    b.stT+=dt;if(b.stT>1){if((mx||mz)&&Math.hypot(P.x-b.stX,P.z-b.stZ)<.8){b.path=null;b.sdir=-b.sdir;this.jump(b)}b.stT=0;b.stX=P.x;b.stZ=P.z}
    const hs=Math.hypot(b.vel.x,b.vel.z);b.ph+=dt*hs*1.15;const swg=Math.sin(b.ph)*Math.min(1,hs/6)*.75;
    m.g.position.copy(P);m.g.rotation.set(0,b.yaw,0);
    m.legL.rotation.x=b.ground?swg:-.7;m.legR.rotation.x=b.ground?-swg:.35;
    m.torso.position.y=1.16+Math.abs(Math.sin(b.ph))*.04*Math.min(1,hs/6);
    const kick=b.flashT>0?.12:0;
    m.armR.rotation.set(Math.PI/2+b.pitch+kick,0,0);m.armL.rotation.set(Math.PI/2+b.pitch-.15+kick,0,.45);
    m.head.rotation.x=b.pitch*.6;
    m.fl.visible=b.flashT>0;if(m.fl.visible)m.fl.material.rotation=Math.random()*6;
    m.body.emissive.setRGB(b.hitT>0?.5:0,b.hitT>0?.08:0,b.hitT>0?.05:0);
  },
  botFire(b,dt){
    const w=b.w[b.wi],d=w.d;
    if(w.rt>0||b.cd>0||b.switchT>0)return;
    if(w.ammo<=0){w.rt=d.rl;return}
    if(d.spin){b.spin=Math.min(1,b.spin+dt/d.spin);if(b.spin<1)return}
    if(b.burst<=0)b.burst=d.auto?3+(Math.random()*6|0):1;
    this.fire(b);b.burst--;
    if(b.burst<=0)b.cd=d.auto?.3+Math.random()*.5:d.rate*(1.3+Math.random()*.9)+(d.scope?.8:0);
  },

  update(dt){
    if(!this.ready||this.state==='off')return;
    if(this.state==='paused'||this.state==='end'){this.camUpdate(dt);return}
    this.time+=dt;
    const me=this.me;
    if(me.alive)this.playerUpdate(dt);
    else if(this.state==='dead'){
      this.deathT+=dt;this.respawnWait-=dt;
      if(this.deathT>1.3&&!this.deadShown){this.deadShown=true;if(document.pointerLockElement)document.exitPointerLock();this.classPanel(true)}
      if(this.deadShown&&this.depBtn){const r=Math.ceil(this.respawnWait),tx=r>0?'deploy in '+r:'deploy';if(this.depBtn.textContent!==tx){this.depBtn.textContent=tx;this.depBtn.disabled=r>0}}
    }
    for(const b of this.bots)this.botUpdate(b,dt);
    this.nadeUpdate(dt);this.fxUpdate(dt);this.camUpdate(dt);
    if(me.alive){this.vmUpdate(dt);this.hudUpdate(dt)}
  },
  draw(){
    if(!this.ready||this.state==='off')return;
    const r=this.ren;r.clear();r.render(this.scene,this.cam);
    if(this.me.alive&&this.vmVisible){r.clearDepth();r.render(this.vscene,this.vcam)}
  },
  set(el,k,v){if(el['_'+k]!==v){el['_'+k]=v;if(k==='html')el.innerHTML=v;else if(k==='cls')el.className=v;else if(k==='text')el.textContent=v;else el.style[k]=v}},
  hudUpdate(dt){
    const p=this.me,w=p.w[p.wi],d=w.d,$=this.$;
    this.set($.hpn,'text',String(Math.ceil(p.hp)));
    this.set($.hpfill,'width',(p.hp/p.maxhp*100).toFixed(1)+'%');
    this.set($.hpfill,'background',p.hp/p.maxhp>.35?'#8fd16a':'#e5484d');
    this.set($.clsn,'text',p.cls.name.toLowerCase());
    this.set($.amn,'html',w.rt>0?'<small>reloading</small>':w.ammo+'<small> / '+d.mag+'</small>');
    this.set($.wn,'text',d.name+(p.w.length>1?'   ·   '+p.w[p.wi?0:1].d.name:''));
    this.set($.nd,'text','frag x'+p.nades+'   g to throw');
    this.set($.rl,'display',w.rt>0?'block':'none');if(w.rt>0)$.rl.firstChild.style.width=((1-w.rt/d.rl)*100)+'%';
    const sp=(d.scope?d.sp:d.sp+(d.ads-d.sp)*this.adsK)+this.bloom,gap=Math.round(6+sp*700+(d.pel>1?10:0));
    $.xh.style.setProperty('--g',gap+'px');
    this.set($.xh,'opacity',d.scope&&this.adsK>.85||this.sprint?'0':this.adsK>.6&&!d.scope?'.5':'1');
    this.hmT=(this.hmT||0)-dt;this.set($.hm,'opacity',this.hmT>0?'1':'0');this.set($.hm,'cls',this.hmKill?'k':'');
    this.set($.vig,'opacity',String(Math.max(this.hurt,p.hp<35?.35+Math.sin(this.time*5)*.1:0).toFixed(2)));
    this.set($.aim,'text',this.aimE?this.aimE.name:'');
    let lead=null;for(const e of this.ents)if(e!==p&&(!lead||e.kills>lead.kills))lead=e;
    this.set($.tk,'html','<b>'+p.kills+'</b> you');
    this.set($.tl,'html',lead?esc(lead.name)+' <b>'+lead.kills+'</b>':'');
    $.board.style.display=keys.Tab?'block':'none';if(keys.Tab&&(this.bT=(this.bT||0)-dt)<=0){this.bT=.3;$.board.innerHTML=this.board()}
    if(this.feedDirty||this.feed.length&&this.time-this.feed[this.feed.length-1].t>6){
      this.feed=this.feed.filter(f=>this.time-f.t<6);this.feedDirty=false;
      $.feed.innerHTML=this.feed.map(f=>'<div class="'+(f.me?'me':'')+'">'+(f.k&&f.k!==f.v?esc(f.k)+'<em>'+f.w+(f.h?' · head':'')+'</em>':'<em>'+f.w+'</em>')+esc(f.v)+'</div>').join('');
    }
    const c=this.rctx,R=75;c.clearRect(0,0,150,150);
    c.strokeStyle='rgba(255,255,255,.1)';c.beginPath();c.arc(R,R,R*.5,0,7);c.stroke();c.beginPath();c.moveTo(R,8);c.lineTo(R,142);c.moveTo(8,R);c.lineTo(142,R);c.stroke();
    const sy=Math.sin(p.yaw),cy=Math.cos(p.yaw);
    for(const e of this.bots){
      if(!e.alive)continue;const dx=e.pos.x-p.pos.x,dz=e.pos.z-p.pos.z,dd=Math.hypot(dx,dz);
      if(dd>60||(this.time-e.lastShot>2.5&&dd>14))continue;
      const rx=dx*cy-dz*sy,fz=-dx*sy-dz*cy;c.fillStyle='#e5484d';c.beginPath();c.arc(R+rx/60*R*.95,R-fz/60*R*.95,3.5,0,7);c.fill();
    }
    c.fillStyle='#f2b84b';c.beginPath();c.moveTo(R,R-6);c.lineTo(R+4.5,R+5);c.lineTo(R-4.5,R+5);c.fill();
  }
};

const GAMES=[
  [FPS,'Bot Arena','full 3d free for all shooter vs 9 bots. pick a class, double jump, sniper one shots','#ef4444'],
  [Blocks,'Blocks','stack falling pieces and clear lines','#38bdf8'],
  [Snake,'Snake','eat, grow, dont crash','#4ade80'],
  [Breakout,'Breakout','smash every brick with the ball','#f472b6'],
  [Flappy,'Flappy','tap to fly through the gaps','#facc15'],
  [T2048,'2048','slide and merge tiles to hit 2048','#f59563'],
  [Pong,'Pong','first to 7 against the cpu','#5eead4']
];
const cardsEl=document.getElementById('cards');
GAMES.forEach(([g,n,d,c])=>{const b=document.createElement('button');b.className='card';b.innerHTML='<i style="background:'+c+'"></i><b>'+n+'</b><span>'+d+'</span>';b.onclick=()=>launch(g);cardsEl.appendChild(b)});

function launch(g){audio();for(const k in keys)keys[k]=false;document.getElementById('menu').style.display='none';document.getElementById('game').style.display='flex';cur=g;g.start();mouse.moved=false;cv.focus()}
function exit(){if(cur&&cur.stop)cur.stop();cur=null;if(document.pointerLockElement)document.exitPointerLock();document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block'}
document.getElementById('back').onclick=e=>{e.stopPropagation();exit()};

const BLOCK=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Backspace'];
addEventListener('keydown',e=>{
  if(!cur||e.target.tagName==='INPUT')return;
  if(BLOCK.includes(e.code)||e.code==='Tab'&&cur===FPS)e.preventDefault();
  if((e.code==='Escape'||e.code==='Backspace')&&!cur.noEsc){exit();return}
  keys[e.code]=true;
  if(cur.key)cur.key(e.code,e.repeat);
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(cur&&cur.up){cur.up(0);cur.up(2)}});
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{if(!cur)return;const p=pos(e);mouse.x=p.x;mouse.y=p.y;down0={x:e.clientX,y:e.clientY};if(cur.down)cur.down(e.button)});
addEventListener('pointerup',e=>{if(!cur)return;if(cur.up)cur.up(e.button);if(down0&&cur.swipe){const dx=e.clientX-down0.x,dy=e.clientY-down0.y;if(Math.hypot(dx,dy)>30)cur.swipe(dx,dy)}down0=null});
cv.addEventListener('pointermove',e=>{const p=pos(e);mouse.x=p.x;mouse.y=p.y;mouse.moved=true});
addEventListener('mousemove',e=>{if(cur&&cur.look&&document.pointerLockElement&&Math.abs(e.movementX)<400&&Math.abs(e.movementY)<400)cur.look(e.movementX,e.movementY)});
cv.addEventListener('wheel',e=>{if(cur&&cur.wheel){e.preventDefault();cur.wheel(e.deltaY)}},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(cur){cur.update(dt);if(cur)cur.draw()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
