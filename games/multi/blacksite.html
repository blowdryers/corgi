<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blacksite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<style>
:root{--bg:#0b0d11;--panel:rgba(14,16,20,.94);--panel2:rgba(255,255,255,.035);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--fg:#eceef1;--mut:#9aa0a8;--dim:#737a84;--amb:#f2b84b;--fr:#5eead4;--en:#ff5a4f;--hs:1;--xc:#fff;
  --dsp:'Barlow Condensed',system-ui,sans-serif;--txt:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--dsp);overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#glc{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}
/* ---------- hud ---------- */
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#compass{position:absolute;top:14px;left:50%;width:460px;height:34px;transform:translateX(-50%) scale(var(--hs));transform-origin:top center}
#tl{position:absolute;left:18px;top:18px;transform:scale(var(--hs));transform-origin:top left}
#mmwrap{position:relative;width:196px;height:196px;border:1px solid rgba(255,255,255,.14);background:rgba(10,12,14,.55)}
#mm{width:100%;height:100%;display:block}
#mmtag{position:absolute;left:0;right:0;bottom:-20px;font-size:13px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;display:flex;justify-content:space-between}
#mmtag b{color:var(--amb);font-weight:600}
#scores{margin-top:32px;width:196px;background:rgba(10,12,14,.55);padding:8px 10px 9px;border-left:2px solid var(--amb)}
.srow{display:grid;grid-template-columns:70px 1fr 34px;align-items:center;gap:8px;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:#c9ccd1}
.srow span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.srow+.srow{margin-top:5px}.srow b{font-size:22px;text-align:right;font-weight:700}
.sbar{height:4px;background:rgba(255,255,255,.1)}.sbar i{display:block;height:100%;width:0;transition:width .3s}
#sf i{background:var(--fr)}#se i{background:var(--en)}
#clock{margin-top:7px;font-size:14px;color:var(--mut);letter-spacing:1.5px;display:flex;justify-content:space-between}
#clock b{color:var(--fg);font-weight:600;font-size:16px}
#feed{margin-top:14px;display:flex;flex-direction:column;gap:3px;font-size:16px;font-weight:600}
#feed div{background:rgba(10,12,14,.5);padding:2px 9px;white-space:nowrap;transition:opacity .4s}
#feed div.mine{background:rgba(242,184,75,.16);border-left:2px solid var(--amb)}
#feed em{font-style:normal;color:var(--dim);font-weight:500;margin:0 7px;font-size:13px;letter-spacing:1px}
.tf{color:var(--fr)}.te{color:var(--en)}.tm{color:var(--amb)}
#xh{position:absolute;left:50%;top:50%;--g:8px;transition:opacity .08s}
#xh i{position:absolute;background:var(--xc);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#xh i:nth-child(1){width:2px;height:9px;left:-1px;top:calc(-9px - var(--g))}
#xh i:nth-child(2){width:2px;height:9px;left:-1px;top:var(--g)}
#xh i:nth-child(3){width:9px;height:2px;top:-1px;left:calc(-9px - var(--g))}
#xh i:nth-child(4){width:9px;height:2px;top:-1px;left:var(--g)}
#xh b{display:none;position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:var(--xc);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
#xh u{display:none;position:absolute;border:2px solid var(--xc);border-radius:50%;width:calc(var(--g)*2 + 10px);height:calc(var(--g)*2 + 10px);left:calc(-1 * var(--g) - 5px);top:calc(-1 * var(--g) - 5px)}
#xh.dot i,#xh.circle i,#xh.none i,#xh.none b{display:none}#xh.dot b,#xh.circle b,#xh.circle u{display:block}
#hm{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;opacity:0}
#hm:before,#hm:after{content:'';position:absolute;left:14px;top:0;width:2px;height:30px;background:linear-gradient(#fff 0 33%,transparent 33% 67%,#fff 67%)}
#hm:before{transform:rotate(45deg)}#hm:after{transform:rotate(-45deg)}
#hm.k{width:44px;height:44px;margin:-22px;animation:hk .45s ease-out forwards}
#hm.k:before,#hm.k:after{left:21px;width:3px;height:44px;background:linear-gradient(#ff3b30 0 36%,transparent 36% 64%,#ff3b30 64%);box-shadow:0 0 8px rgba(255,59,48,.7)}
@keyframes hk{0%{transform:scale(1.5);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}
#elim{position:absolute;left:50%;top:calc(50% + 58px);transform:translateX(-50%);text-align:center;opacity:0;white-space:nowrap}
#elim.show{animation:el 1.4s forwards}
#elim small{display:block;font-size:12px;letter-spacing:4px;color:var(--en);font-weight:600}
#elim b{font-size:22px;letter-spacing:2px;text-transform:uppercase}
@keyframes el{0%{opacity:0;transform:translate(-50%,6px)}12%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
#aim{position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);font-size:16px;font-weight:600;letter-spacing:1px;color:var(--en)}
#xp{position:absolute;left:calc(50% + 46px);top:calc(50% - 10px);display:flex;flex-direction:column;gap:2px}
#xp div{font-size:21px;font-weight:700;color:var(--amb);animation:xpa 1.5s forwards;white-space:nowrap;transform-origin:left center}
#xp div small{font-size:14px;color:#d8dadd;font-weight:500;margin-left:6px;letter-spacing:1px;text-transform:uppercase}
@keyframes xpa{0%{opacity:0;transform:scale(1.35)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#medal{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;opacity:0}
#medal.show{animation:md 2s forwards}
#medal .mi{width:54px;height:54px;margin:0 auto 6px;border:2px solid var(--amb);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;background:rgba(242,184,75,.12)}
#medal .mi span{transform:rotate(-45deg);font-weight:800;font-size:20px;color:var(--amb)}
#medal b{display:block;font-size:26px;letter-spacing:3px;text-transform:uppercase}
#medal small{font-size:16px;color:var(--amb);letter-spacing:1px}
@keyframes md{0%{opacity:0;transform:translateX(-50%) scale(1.3)}8%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#prompt{position:absolute;left:50%;top:66%;transform:translateX(-50%);font-size:18px;letter-spacing:1px;color:#d8dadd}
#prompt kbd{font-family:inherit;border:1px solid rgba(255,255,255,.4);padding:0 6px;margin:0 3px;color:var(--amb)}
#br{position:absolute;right:20px;bottom:20px;text-align:right;transform:scale(var(--hs));transform-origin:bottom right}
#streaks{display:flex;flex-direction:column;gap:6px;align-items:flex-end;margin-bottom:22px}
#wname{font-size:16px;letter-spacing:2px;text-transform:uppercase;color:#d8dadd}
#wname small{color:var(--dim);margin-left:8px;font-size:13px}
#ammo{display:flex;align-items:flex-end;justify-content:flex-end;gap:10px;margin-top:2px}
#mag{font-size:52px;font-weight:700;line-height:.9}#mag.low{color:var(--en)}
#res{font-size:22px;color:var(--mut);font-weight:500;padding-bottom:3px}
#ticks{display:flex;gap:2px;justify-content:flex-end;margin-top:6px;height:10px}
#ticks i{width:3px;background:#e9ebee}#ticks i.e{background:rgba(255,255,255,.15)}
#equip{display:flex;gap:14px;justify-content:flex-end;margin-top:8px;font-size:14px;color:var(--mut);letter-spacing:1px}
#equip b{color:var(--fg)}
.sk{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.sk i{width:26px;height:26px;border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.sk.rdy{color:var(--fg)}.sk.rdy i{border-color:var(--amb);color:var(--amb);background:rgba(242,184,75,.12)}
.sk.act{color:var(--fr)}.sk.act i{border-color:var(--fr);color:var(--fr)}
#ladder{display:flex;gap:3px;justify-content:flex-end;margin-bottom:10px}
#ladder i{width:14px;height:4px;background:rgba(255,255,255,.15)}#ladder i.d{background:var(--amb)}#ladder i.c{background:#fff}
#hpline{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:200px;height:3px;background:rgba(255,255,255,.12);opacity:0;transition:opacity .3s}
#hpline i{display:block;height:100%;background:#e9ebee}
#xpbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(520px,60vw);height:3px;background:rgba(255,255,255,.08)}
#xpbar i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35)}#xpbar em{position:absolute;top:0;bottom:0;background:var(--amb);transition:width .4s}
#xpbar span{position:absolute;right:100%;margin-right:10px;top:-7px;font-size:12px;letter-spacing:2px;color:var(--mut);white-space:nowrap}
#dirs{position:absolute;left:50%;top:50%}
#dirs .dh{position:absolute;left:0;top:0;animation:dh 1.2s forwards}
#dirs .dh:before{content:'';position:absolute;left:-70px;top:-170px;width:140px;height:40px;border-top:5px solid rgba(220,50,40,.9);border-radius:50%}
@keyframes dh{to{opacity:0}}
#scope{position:fixed;inset:0;pointer-events:none;display:none;background:radial-gradient(circle at center,transparent 0 37vh,rgba(0,0,0,.6) 37.3vh,#000 38vh)}
#scope:before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.9)}
#scope:after{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(0,0,0,.9)}
#scope i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#d33;border-radius:50%}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(780px,94vw);background:var(--panel);border:1px solid var(--line);padding:18px 22px}
#board h3,.pn h3{font-size:13px;letter-spacing:3px;color:var(--mut);font-weight:600;text-transform:uppercase}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:10px}.bt.one{grid-template-columns:1fr}
.sb{width:100%;border-collapse:collapse;font-size:17px}
.sb th{text-align:left;color:var(--dim);font-weight:500;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
.sb td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.04);font-variant-numeric:tabular-nums}.sb td:not(:first-child),.sb th:not(:first-child){text-align:right}
.sb td:first-child{display:flex;align-items:center;gap:8px}.sb img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.sb tr.me td{color:var(--amb)}.sb tr.dead td{opacity:.5}
.tt{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding-bottom:4px}
.tt b{font-size:30px}
#death{position:absolute;left:50%;top:38%;transform:translateX(-50%);text-align:center}
#death small{display:block;font-size:15px;letter-spacing:4px;color:var(--mut)}
#death b{display:block;font-size:44px;font-weight:700;letter-spacing:2px;color:var(--en)}
#death span{display:block;font-size:17px;color:#d8dadd;margin-top:2px}
#death p{margin-top:16px;font-size:16px;letter-spacing:2px;color:var(--mut)}
#banner{position:absolute;left:50%;top:30%;transform:translateX(-50%);text-align:center;opacity:0;white-space:nowrap}
#banner.show{animation:md 3s forwards}
#banner b{display:block;font-size:46px;font-weight:800;letter-spacing:6px;text-transform:uppercase}
#banner small{font-size:18px;letter-spacing:3px;color:var(--amb);text-transform:uppercase}
#surf{position:absolute;inset:0}
#st_top{position:absolute;top:22px;left:50%;transform:translateX(-50%);text-align:center}
#st_time{font-size:48px;font-weight:700;letter-spacing:1px;line-height:1}
#st_info{margin-top:6px;font-size:14px;letter-spacing:3px;color:var(--mut);text-transform:uppercase;display:flex;gap:18px;justify-content:center}
#st_info b{color:var(--fg);font-weight:600}
#st_split{margin-top:6px;font-size:18px;font-weight:600;letter-spacing:1px;opacity:0;transition:opacity .3s}
#st_speed{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);text-align:center}
#st_speed b{display:block;font-size:44px;font-weight:700;line-height:1}
#st_speed small{font-size:12px;letter-spacing:4px;color:var(--mut)}
#st_keys{position:absolute;left:24px;bottom:22px;font-size:13px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;line-height:1.7}
#st_keys b{color:var(--mut);font-weight:600;margin-right:6px}
#fpsc{position:fixed;right:10px;top:8px;font-size:13px;letter-spacing:1px;color:var(--mut);pointer-events:none;z-index:5;text-shadow:0 1px 2px #000}
/* ---------- menu ---------- */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(8,9,12,.82) 0,rgba(8,9,12,0) 140px),linear-gradient(0deg,rgba(8,9,12,.96) 0,rgba(8,9,12,.82) 38%,rgba(8,9,12,0) 70%)}
#top{display:flex;align-items:center;gap:36px;padding:0 36px;height:72px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-size:30px;font-weight:800;letter-spacing:5px}
.logo span{font-size:12px;letter-spacing:2px;color:var(--dim)}
#nav{display:flex;height:100%}
#nav button{all:unset;cursor:pointer;display:flex;align-items:center;padding:0 18px;font-size:17px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
#nav button:hover{color:var(--fg)}#nav button.on{color:var(--fg);border-color:var(--amb)}
#chip{margin-left:auto;display:flex;align-items:center;gap:12px;cursor:pointer;padding:8px 10px;border:1px solid transparent;transition:border-color .15s}
#chip:hover{border-color:var(--line2)}
#chip img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--line2)}
#chip .who b{display:block;font-size:19px;font-weight:700;letter-spacing:1px;line-height:1.1}
#chip .who span{display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}
#chip .bar{width:150px;height:3px;background:rgba(255,255,255,.1);margin-top:5px}#chip .bar i{display:block;height:100%;background:var(--amb)}
.ins{display:inline-block;vertical-align:middle}
#play{margin-top:auto;display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(260px,1.1fr) minmax(280px,1fr);gap:28px;padding:0 36px 26px}
.col h4{display:flex;align-items:baseline;gap:10px;font-size:13px;font-weight:600;letter-spacing:3px;color:var(--mut);text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.col h4 i{font-style:normal;color:var(--amb);font-size:12px}
.li{all:unset;cursor:pointer;display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;width:100%;box-sizing:border-box;padding:10px 12px 10px 10px;border-left:2px solid transparent;transition:background .12s,border-color .12s}
.li:hover{background:rgba(255,255,255,.04)}.li.on{background:rgba(242,184,75,.07);border-color:var(--amb)}
.li.off{opacity:.35;pointer-events:none}
.li .sw{width:54px;height:36px;border:1px solid var(--line2)}
.li .nm{font-size:22px;font-weight:700;letter-spacing:1px;line-height:1.05}
.li .ds{font-family:var(--txt);font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.li .tg{font-size:12px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;align-self:start;padding-top:4px}
.li.mode{grid-template-columns:40px 1fr}
.li.mode .ab{width:40px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);font-size:13px;font-weight:700;letter-spacing:1px;color:var(--mut)}
.li.mode.on .ab{color:var(--amb);border-color:rgba(242,184,75,.5)}
.setup .opt{grid-template-columns:110px 1fr;padding:7px 0}
#deploy{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin-top:16px;width:100%;box-sizing:border-box;background:var(--amb);color:#14110a;padding:14px 18px;font-size:26px;font-weight:800;letter-spacing:4px;text-transform:uppercase;transition:filter .12s}
#deploy:hover{filter:brightness(1.07)}#deploy small{font-size:13px;letter-spacing:2px;font-weight:600;opacity:.7}
#mfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 36px 14px;border-top:1px solid var(--line);font-family:var(--txt);font-size:12px;color:var(--dim)}
#mfoot b{color:var(--mut);font-weight:600}
#mfoot button{all:unset;cursor:pointer;font-family:var(--dsp);font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}#mfoot button:hover{color:var(--fg)}
/* ---------- sheets ---------- */
#panel{position:fixed;inset:0;display:none;align-items:stretch;justify-content:flex-end;background:rgba(6,8,10,.5);backdrop-filter:blur(3px)}
#panel.on{display:flex}#panel.center{justify-content:center;align-items:center;padding:30px 16px;overflow:auto}
.pn{background:var(--panel);border-left:1px solid var(--line);padding:30px 34px;width:min(880px,100%);overflow:auto;animation:sh .22s ease-out}
#panel.center .pn{border:1px solid var(--line);max-height:100%}
@keyframes sh{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.pn h2{font-size:44px;font-weight:800;letter-spacing:2px;line-height:1.05;text-transform:uppercase;margin-top:2px}
.pn .mut{font-family:var(--txt);color:var(--mut);margin:6px 0 18px;font-size:14px;line-height:1.5}
.ccs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0 20px}
.cc{all:unset;cursor:pointer;position:relative;background:var(--panel2);border:1px solid var(--line);padding:12px 14px;transition:border-color .12s,background .12s}
.cc:hover{border-color:var(--line2)}.cc.on{border-color:var(--amb);background:rgba(242,184,75,.06)}
.cc.lock{opacity:.45;cursor:not-allowed}.cc .lk{position:absolute;right:10px;top:10px;font-size:11px;letter-spacing:2px;color:var(--amb);text-transform:uppercase}
.cn{font-size:23px;font-weight:700;letter-spacing:1px}.ct{font-size:12px;letter-spacing:2px;color:var(--amb);text-transform:uppercase}
.cd{font-family:var(--txt);font-size:12.5px;color:var(--mut);margin:4px 0 8px;min-height:34px;line-height:1.4}
.st{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:4px 0}
.st span{width:64px}.st i{flex:1;height:3px;background:rgba(255,255,255,.08)}.st b{display:block;height:100%;background:#d8dadd}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.go{all:unset;cursor:pointer;background:var(--amb);color:#14110a;font-weight:700;font-size:19px;letter-spacing:2px;text-transform:uppercase;padding:9px 24px}
.go:hover{filter:brightness(1.08)}
.go.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2);font-size:17px;padding:8px 18px}.go.ghost:hover{border-color:rgba(255,255,255,.4)}
.go.sm{font-size:14px;padding:5px 12px;letter-spacing:1px}.go.danger{color:var(--en);border-color:rgba(255,90,79,.4)}
.opt{display:grid;grid-template-columns:200px 1fr 64px;gap:14px;align-items:center;font-size:18px;padding:8px 0;border-bottom:1px solid var(--line)}
.opt label{color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;font-size:14px}
.opt output{text-align:right;color:var(--amb);font-weight:600;font-variant-numeric:tabular-nums}
.opt input[type=range]{width:100%;accent-color:var(--amb)}

<script>

/* ============================== profile and levels ============================== */

/* ============================== renderer ============================== */

let ENV_I=1,ENVK='day';const DAY={};

/* ============================== assets ============================== */

const TEXSETS={asph:'asphalt_02',conc:'concrete_wall_008',corr:'corrugated_iron',brick:'red_brick_03',wood:'wood_planks_dirt',rust:'rusty_metal_02'};
const AU={c:null};
try{AU.c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
function loadAssets(progress){
  const jobs=[];let done=0;const tick=()=>{done++;progress(done/jobs.length)};
  const job=p=>{jobs.push(p.then(tick,e=>{console.warn('asset failed',e);tick()}))};

  const tex=(f,srgb)=>new Promise((res,rej)=>tl.load(BASE+'tex/'+f,t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,R.capabilities.getMaxAnisotropy());if(srgb)t.encoding=THREE.sRGBEncoding;res(t)},undefined,rej));
  for(const k in TEXSETS){const n=TEXSETS[k];job(Promise.all([tex(n+'_diff.jpg',true),tex(n+'_nor_gl.jpg'),tex(n+'_rough.jpg')]).then(([d,nn,r])=>{ASSET.tex[k]={d,n:nn,r}}))}

  if(AU.c)for(const n of['rifle','pistol','sniper','shotgun','reload_rifle','reload_pistol','pump'])job(fetch(BASE+'sfx/'+n+'.wav').then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}).then(b=>new Promise((res,rej)=>AU.c.decodeAudioData(b,res,rej))).then(buf=>{ASSET.sfx[n]=buf}));
  return Promise.all(jobs)}

/* ============================== procedural textures ============================== */
function tileNoise(size,oct,base){const out=new Float32Array(size*size);let amp=1,tot=0;
  for(let o=0;o<oct;o++){const p=base<<o,lat=new Float32Array(p*p);for(let i=0;i<lat.length;i++)lat[i]=Math.random();
    for(let y=0;y<size;y++){const fy=y/size*p,y0=fy|0,ty=fy-y0,sy=ty*ty*(3-2*ty),y1=(y0+1)%p;

    tot+=amp;amp*=.5}for(let i=0;i<out.length;i++)out[i]/=tot;return out}
function makeTex(size,pix,post,srgb=true,w){const c=document.createElement('canvas');c.width=w||size;c.height=size;const g=c.getContext('2d');
  if(pix){const id=g.createImageData(size,size),d=id.data;for(let y=0;y<size;y++)for(let x=0;x<size;x++){const i=y*size+x,col=pix(x,y,i);d[i*4]=col[0];d[i*4+1]=col[1];d[i*4+2]=col[2];d[i*4+3]=col[3]===undefined?255:col[3]}g.putImageData(id,0,0)}
  if(post)post(g,size);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=Math.min(8,R.capabilities.getMaxAnisotropy());return t}
const TX={};
function buildFallbackTex(){const N=256,nA=tileNoise(N,5,4),nB=tileNoise(N,3,32);
  const gray=(b,k)=>makeTex(N,(x,y,i)=>{const v=.6+.4*(nA[i]-.5)+k*(nB[i]-.5);return[b[0]*v,b[1]*v,b[2]*v]});
  TX.asph=gray([82,81,80],.2);TX.conc=gray([150,147,139],.15);TX.corr=makeTex(N,(x,y,i)=>{const v=.8+.1*Math.sin(x/N*PI*40)+.1*(nB[i]-.5);return[200*v,200*v,200*v]});TX.brick=gray([150,72,52],.2);TX.wood=gray([170,128,84],.2);TX.rust=gray([180,178,176],.15);
  const camo=cols=>makeTex(256,(x,y)=>{const i=(y%N)*N+(x%N);const a=nA[i],b=nB[i];return a>.58?cols[0]:b>.55?cols[1]:a<.4?cols[2]:cols[3]});
  TX.camoF=camo([[110,102,70],[92,72,50],[188,172,136],[160,140,102]]);TX.camoE=camo([[34,35,38],[66,70,76],[22,22,24],[52,54,58]]);TX.mask=makeTex(N,(x,y,i)=>{const v=nA[i]*255;return[v,v,v]},null,false)}

      '<div class="brk">'+br.map(([l,v])=>'<span>'+l+'</span><b>+'+v.toLocaleString()+'</b>').join('')+'<span style="color:var(--fg)">Total XP</span><b style="color:var(--amb)">+'+total.toLocaleString()+'</b></div>'+
      '<div class="lvl">'+insignia(res.after.l,32)+'<b style="font-size:40px">'+res.after.l+'</b><span>'+rankOf(res.after.l)+'</span></div><div class="xpl"><em style="width:'+(lvUp?0:before.pct*100)+'%"></em><i id="endxp" style="width:'+(lvUp?0:before.pct*100)+'%"></i></div>'+
      '<div class="xpt"><span class="num">'+res.after.cur.toLocaleString()+' / '+res.after.need.toLocaleString()+' XP</span><span>'+(lvUp?'Level up':'')+'</span></div>'+(lvUp?'<div class="lvup">Promoted to '+rankOf(res.after.l)+' · Level '+res.after.l+'</div>':'')+
      '<div style="margin-top:18px">'+boardHTML()+'</div><div class="row" style="margin-top:20px"><button class="go" id="e_again">Play again</button><button class="go ghost" id="e_menu">Main menu</button></div></div>',true);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const e=$('endxp');if(e)e.style.width=(res.after.pct*100)+'%'}));
    $('e_again').onclick=()=>startMatch(match.mode);$('e_menu').onclick=()=>toMenu()},1600);
  banner(title,isTeam()?'Final '+match.scores[0]+' – '+match.scores[1]:'')}

/* ============================== main loop ============================== */
let time=0,last=performance.now(),orbit=0,fpsAcc=0,fpsN=0;
function frame(now){const real=Math.max(0,Math.min(.05,(now-last)/1000));last=now;let dt=real;
  if(hitstop>0&&state==='play'){hitstop-=real;dt=real*.22}frameDt=real;
  fpsAcc+=real;fpsN++;if(fpsAcc>.5){if(S.fps)$('fpsc').textContent=Math.round(fpsN/fpsAcc)+' FPS';fpsAcc=0;fpsN=0}
  const paused=state==='play'&&panel.classList.contains('on')&&!match.over;
  if(state!=='load'&&!paused){time+=dt;if(state==='play'){updPlayer(dt);if(!match.over&&match.mode!=='surf'){match.time-=dt;if(match.time<=0){match.time=0;checkEnd()}}}
    for(const b of bots)updBot(b,dt);updNades(dt);updJet(dt);if(match.mode==='kc')updTags(dt)}
  if(state==='menu'){const o=MAP()?MAP().orbit:[0,2,0,58,44,24];orbit+=real*.035;cam.position.set(o[0]+Math.cos(orbit)*o[3],o[1]+o[5]+Math.sin(orbit*.7)*3,o[2]+Math.sin(orbit)*o[4]);cam.lookAt(o[0],o[1],o[2]);if(cam.fov!==50){cam.fov=50;cam.updateProjectionMatrix();updPointScale()}}
  else if(state==='play')updCamera(dt);
  updViewmodel(dt);if(!paused&&FXadd){FXadd.update(dt);FXsmoke.update(dt);updTracers(dt);updLights(dt)}
  sky.position.copy(cam.position);skyU.uT.value=time;if(dust){dust.uniforms.uT.value=time;dust.uniforms.uC.value.copy(cam.position)}if(neonMat)neonMat.uniforms.uT.value=time;
  const C=PP.comp.uniforms;C.uFlash.value=Math.max(0,C.uFlash.value-real*2.5);killPulse=Math.max(0,killPulse-real*5);C.uKill.value=killPulse;
  // weather
  if(ENVK==='rain'){if(rainFX){rainFX.material.uniforms.uT.value=time;rainFX.material.uniforms.uC.value.copy(cam.position);rainFX.material.uniforms.uF.value=flashS}if(wetLayer)wetLayer.material.uniforms.uT.value=time;
    lightningT-=real;if(lightningT<=0){lightningT=rand(9,22);flashS=1;C.uFlash.value=Math.max(C.uFlash.value,.35);SND.thunder(rand(.4,2))}flashS*=Math.exp(-real*(flashS>.5?3:7));
    skyU.uFlashS.value=flashS+(Math.random()<.05&&flashS>.2?.6:0);sun.intensity=.55+flashS*7;
    for(let i=0;i<4;i++){const a=Math.random()*6.28,r=Math.sqrt(Math.random())*14;FXadd.spawn(cam.position.x+Math.cos(a)*r,.04,cam.position.z+Math.sin(a)*r,rand(-.3,.3),rand(.7,1.5),rand(-.3,.3),.16,.035,.01,1.1,1.2,1.4,.55,2,9)}
    C.uRain.value=S.lensRain&&state==='play'?.85:0;if(AU.rainG)AU.rainG.gain.value=.12}else{C.uRain.value=0;if(AU.rainG)AU.rainG.gain.value=0}
  if(state==='play'){const hpk=1-P.hp/100;P.hurtFlash=Math.max(0,(P.hurtFlash||0)-real*3);C.uDmg.value=P.alive?clamp(hpk*1.15+P.hurtFlash*.35,0,1):.9;C.uDesat.value=P.alive?hpk*.55+(P.suppress||0)*.25:.75;C.uLow.value=P.alive?clamp((hpk-.55)*2,0,1):.5;
    C.uAber.value=(.012+(P.suppress||0)*.03+hpk*.02)*S.aberration;updHUD();if(match.mode!=='surf'){drawCompass();drawMinimap()}}
  else{C.uDmg.value=0;C.uDesat.value=.1;C.uLow.value=0;C.uAber.value=.012*S.aberration}
  if(state!=='load')render();requestAnimationFrame(frame)}

/* ============================== boot ============================== */
(async function boot(){
  const lbar=$('lbar'),lmsg=$('lmsg');
  await loadAssets(p=>{lbar.style.width=Math.round(p*80)+'%'}).catch(()=>{});
  lmsg.textContent='Building maps';await new Promise(r=>setTimeout(r,30));
  buildFallbackTex();fxTextures();setupSky();vmMats();buildMaterials();buildFX();
  nadeMat=new THREE.MeshStandardMaterial({color:0x3b4030,roughness:.6,metalness:.3});jetMat=new THREE.MeshStandardMaterial({color:0x50555b,metalness:.6,roughness:.4});
  prepSoldierTemplate();buildVMfx();
  // author colors are sRGB; shading happens in linear space and the final pass encodes
  for(const l of[sun,hemi,vmSun]){l.color.convertSRGBToLinear();if(l.groundColor)l.groundColor.convertSRGBToLinear()}
  vmScene.traverse(o=>{if(o.isHemisphereLight&&o!==hemi){o.color.convertSRGBToLinear();o.groundColor.convertSRGBToLinear()}});
  DAY.sunCol=sun.color.clone();DAY.hc=hemi.color.clone();DAY.hg=hemi.groundColor.clone();
  for(const m of[nadeMat,jetMat,scorchMat,holeMat,...Object.values(VM_M).filter(x=>x.isMeshStandardMaterial),...contMats,...Object.values(M).filter(x=>x.isMeshStandardMaterial)]){if(!m.userData.lin){m.userData.lin=true;m.color.convertSRGBToLinear();m.envMapIntensity=ENV_I*(VM_M&&Object.values(VM_M).includes(m)?.45:m===M.puddle?.4:1)}}
  buildViewmodels();lbar.style.width='92%';
  resize();applySettings(false);addEventListener('resize',resize);
  if(!MAPS[S.map])S.map='dockyard';loadMap(S.map);
  if(MAPS[S.map].env!=='void'){setupBots('tdm');for(const b of bots)spawnBot(b)}
  try{R.compile(scene,cam)}catch(e){}
  lbar.style.width='100%';$('load').remove();toMenu();requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)})})();
</script>
</body>
