<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html, body {
  margin: 0;
  height: 100%;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}


#start {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #00aaff;
  font-size: 32px;
  cursor: pointer;
}

video {
  display: none;
  width: 100vw;
  height: 100vh;
  object-fit: contain;
}

img {
  position: absolute;
  display: none;
}
</style>
</head>
<body>

<div id="start">click the screen</div>

<video id="v" src="/games/gubby/isthatagubby.mp4"></video>

<img id="kreek" src="kreek.jpg" style="left:601px; top:307px;">
<img id="gubby" src="gubby.jpg" style="left:1259px; top:548px;">

<script>
const start = document.getElementById("start");
const v = document.getElementById("v");
const kreek = document.getElementById("kreek");
const gubby = document.getElementById("gubby");

start.onclick = () => {
  start.style.display = "none";
  v.style.display = "block";
  v.play();
};

v.onended = () => {
  v.style.display = "none";
  kreek.style.display = "block";
  gubby.style.display = "block";
};
</script>

</body>
</html>
