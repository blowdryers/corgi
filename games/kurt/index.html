<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>System Scan</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
  color: #00ffcc;
}

/* CLICK SCREEN */
#start {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  cursor: pointer;
  z-index: 10;
  background: black;
}

/* VIDEO */
video {
  position: fixed;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

/* CENTER INFO PANEL */
#info {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 22px;
  text-align: center;
  white-space: pre-line;
  z-index: 5;
  background: rgba(0,0,0,0.65);
  padding: 25px;
  border: 1px solid #00ffcc;
  min-width: 60%;
}
</style>
</head>

<body>

<div id="start">CLICK ANYWHERE TO START SCAN</div>

<video id="vid" muted loop>
  <source src="videoplayback (5).mp4" type="video/mp4">
</video>

<audio id="audio" loop>
  <source src="Basement - Covet [Slowed] [TIKTOK VER.].mp3" type="audio/mpeg">
</audio>

<div id="info"></div>

<script>
const start = document.getElementById("start");
const vid = document.getElementById("vid");
const audio = document.getElementById("audio");
const info = document.getElementById("info");

function getGPU() {
  try {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    const debug = gl.getExtension("WEBGL_debug_renderer_info");
    return debug
      ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
      : "Unknown GPU";
  } catch {
    return "Unavailable";
  }
}

async function getIP() {
  try {
    const res = await fetch("https://api.ipify.org?format=json");
    const data = await res.json();
    return data.ip;
  } catch {
    return "Unavailable";
  }
}

start.onclick = async () => {
  start.style.display = "none";

  vid.play();
  audio.play();

  const ip = await getIP();

  const lines = [
    "INITIALIZING SYSTEM SCAN...",
    "COLLECTING DEVICE DATA...",
    "-----",
    "IP ADDRESS: " + ip,
    "USER AGENT: " + navigator.userAgent,
    "PLATFORM: " + navigator.platform,
    "LANGUAGE: " + navigator.language,
    "CPU CORES: " + (navigator.hardwareConcurrency || "Unknown"),
    "SCREEN: " + screen.width + "x" + screen.height,
    "COLOR DEPTH: " + screen.colorDepth,
    "GPU: " + getGPU(),
    "TIMEZONE: " + Intl.DateTimeFormat().resolvedOptions().timeZone,
    "NETWORK: " + (navigator.connection ? navigator.connection.effectiveType : "Unknown"),
    "SCAN COMPLETE."
  ];

  let i = 0;

  function showNextLine() {
    if (i < lines.length) {
      info.textContent += lines[i] + "\n";
      i++;
      setTimeout(showNextLine, 500);
    }
  }

  showNextLine();
};
</script>

</body>
</html>
