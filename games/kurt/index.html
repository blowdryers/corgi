<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Device Info</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  color: white;
  font-family: "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight: 700;
}

#start {
  position: fixed;
  width: 100%;
  height: 100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  z-index:999;
}

video {
  position: fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

#info {
  position: fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:22px;
  white-space:pre-line;
  text-align:center;
  z-index:5;
}
</style>
</head>

<body>

<div id="start">click</div>

<video id="vid" muted loop>
  <source src="videoplayback (5).mp4">
</video>

<audio id="audio" loop>
  <source src="Basement - Covet [Slowed] [TIKTOK VER.].mp3">
</audio>

<div id="info"></div>

<script>
const start = document.getElementById("start");
const info = document.getElementById("info");
const vid = document.getElementById("vid");
const audio = document.getElementById("audio");

function hash(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h << 5) - h + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h).toString(16);
}

function canvasFP(){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  ctx.textBaseline = "top";
  ctx.font = "14px Arial";
  ctx.fillText("device_fp_test_123", 2, 2);
  return hash(c.toDataURL());
}

function webglFP(){
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl");
    if(!gl) return "no-webgl";

    const debug = gl.getExtension("WEBGL_debug_renderer_info");
    const vendor = gl.getParameter(gl.VENDOR);
    const renderer = debug
      ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
      : gl.getParameter(gl.RENDERER);

    return hash(vendor + renderer);
  } catch {
    return "error";
  }
}

async function getIP(){
  try {
    const ip = await fetch("https://api.ipify.org?format=json").then(r=>r.json());
    const geo = await fetch("https://ipapi.co/json/").then(r=>r.json());
    return { ip: ip.ip, geo };
  } catch {
    return { ip:"unknown", geo:{} };
  }
}

start.onclick = async () => {
  start.style.display = "none";

  vid.play();
  audio.play();

  const { ip, geo } = await getIP();

  const data = {
    "IP": ip,
    "Country": geo.country_name || "unknown",
    "City": geo.city || "unknown",
    "Region": geo.region || "unknown",
    "ISP": geo.org || "unknown",

    "User Agent": navigator.userAgent,
    "Platform": navigator.platform,
    "Language": navigator.language,
    "Timezone": Intl.DateTimeFormat().resolvedOptions().timeZone,

    "CPU Cores": navigator.hardwareConcurrency || "unknown",
    "Device Memory (GB)": navigator.deviceMemory || "unknown",

    "Screen": screen.width + "x" + screen.height,
    "Window": innerWidth + "x" + innerHeight,
    "Pixel Ratio": devicePixelRatio,
    "Color Depth": screen.colorDepth,

    "GPU": (() => {
      try {
        const c = document.createElement("canvas");
        const gl = c.getContext("webgl");
        const ext = gl.getExtension("WEBGL_debug_renderer_info");
        return ext
          ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)
          : "hidden";
      } catch {
        return "unavailable";
      }
    })(),

    "Canvas Hash": canvasFP(),
    "WebGL Hash": webglFP(),

    "WebRTC": !!window.RTCPeerConnection,
    "WebGL Support": !!window.WebGLRenderingContext,
    "WebGPU": !!navigator.gpu,
    "Touch Points": navigator.maxTouchPoints || 0,

    "Storage": [
      "localStorage" in window ? "localStorage" : null,
      "sessionStorage" in window ? "sessionStorage" : null,
      "indexedDB" in window ? "indexedDB" : null
    ].filter(Boolean).join(", "),

    "Cookies": navigator.cookieEnabled,
    "Do Not Track": navigator.doNotTrack,
    "Referrer": document.referrer || "direct",

    "Notifications Permission": Notification.permission
  };

  const lines = Object.entries(data).map(([k,v]) => `${k}: ${v}`);

  let i = 0;
  function show(){
    if(i < lines.length){
      info.textContent += lines[i] + "\n";
      i++;
      setTimeout(show, 500);
    }
  }
  show();
};
</script>

</body>
</html>
