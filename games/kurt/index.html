<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Info</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  color: #814430;
  font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 700;
}

/* CLICK SCREEN (FULL OVERLAY) */
#start {
  position: fixed;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  cursor: pointer;
  z-index: 999;
  background: black;
  color: #814430;
}

/* VIDEO */
video {
  position: fixed;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

/* CENTER TEXT (NO BOX) */
#info {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 28px;
  text-align: center;
  white-space: pre-line;
  z-index: 5;
}
</style>
</head>

<body>

<div id="start">click</div>

<video id="vid" muted loop>
  <source src="videoplayback (5).mp4" type="video/mp4">
</video>

<audio id="audio" loop>
  <source src="Basement - Covet [Slowed] [TIKTOK VER.].mp3" type="audio/mpeg">
</audio>

<div id="info"></div>

<script>
const start = document.getElementById("start");
const vid = document.getElementById("vid");
const audio = document.getElementById("audio");
const info = document.getElementById("info");

function getGPU() {
  try {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    const debug = gl.getExtension("WEBGL_debug_renderer_info");
    return debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : "unknown";
  } catch {
    return "unknown";
  }
}

async function getIP() {
  try {
    const r = await fetch("https://api.ipify.org?format=json");
    const d = await r.json();
    return d.ip;
  } catch {
    return "unknown";
  }
}

start.onclick = async () => {
  start.style.display = "none";

  vid.play();
  audio.play();

  const ip = await getIP();

  const lines = [
    "IP: " + ip,
    "USER AGENT: " + navigator.userAgent,
    "PLATFORM: " + navigator.platform,
    "LANG: " + navigator.language,
    "CPU CORES: " + (navigator.hardwareConcurrency || "unknown"),
    "SCREEN: " + screen.width + "x" + screen.height,
    "COLOR DEPTH: " + screen.colorDepth,
    "GPU: " + getGPU(),
    "TIMEZONE: " + Intl.DateTimeFormat().resolvedOptions().timeZone,
    "NETWORK: " + (navigator.connection ? navigator.connection.effectiveType : "unknown")
  ];

  let i = 0;

  function show() {
    if (i < lines.length) {
      info.textContent += lines[i] + "\n";
      i++;
      setTimeout(show, 500);
    }
  }

  show();
};
</script>

</body>
</html>
