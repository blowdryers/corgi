<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Physics Stress Test</title>
<style>
html,body{margin:0;overflow:hidden;background:#050509;color:white;font-family:Arial}
#info{position:fixed;z-index:5;top:15px;left:15px;padding:12px 15px;
background:#0009;border:1px solid #ffffff33;border-radius:12px;line-height:1.5}
strong{color:#75e6ff}#status{color:#9dffa9;font-size:13px}
#error{display:none;position:fixed;z-index:20;bottom:15px;left:15px;right:15px;
padding:12px;background:#900;color:white;border:2px solid #f77;white-space:pre-wrap;font:13px monospace}
#crosshair{position:fixed;z-index:4;left:50%;top:50%;width:14px;height:14px;
transform:translate(-50%,-50%);border:1px solid white;border-radius:50%;pointer-events:none}
</style>
</head>
<body>
<div id="info"><strong>Hold SPACE for 0.5 seconds</strong><br>
Move the mouse to aim<br><span id="status">Objects: 0</span></div>
<div id="crosshair"></div><div id="error"></div>

<script>
addEventListener("error",e=>{
 let x=document.querySelector("#error");x.style.display="block";
 x.textContent="JavaScript error:\n"+e.message+"\n"+e.filename+":"+e.lineno
});
addEventListener("unhandledrejection",e=>{
 let x=document.querySelector("#error");x.style.display="block";
 x.textContent="Module error:\n"+e.reason
});
</script>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
import * as CANNON from
"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js";
import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js";

/* Increase this number for a stronger browser stress test. */
const objectsPerFrame=20;
const status=document.querySelector("#status");
const objects=[];

/* Scene */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050509);
scene.fog=new THREE.FogExp2(0x050509,.018);

const camera=new THREE.PerspectiveCamera(
60,innerWidth/innerHeight,.1,500
);
camera.position.set(0,12,22);

const renderer=new THREE.WebGLRenderer({
antialias:true,powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,4,0);

scene.add(new THREE.HemisphereLight(0xa8c7ff,0x241126,2.2));

const light=new THREE.DirectionalLight(0xffffff,3.5);
light.position.set(-8,18,10);
light.castShadow=true;
light.shadow.mapSize.set(1024,1024);
scene.add(light);

const pink=new THREE.PointLight(0xff3dbe,35,40);
pink.position.set(5,8,-8);
scene.add(pink);

/* Physics */
const world=new CANNON.World({
gravity:new CANNON.Vec3(0,-15,0)
});
world.broadphase=new CANNON.SAPBroadphase(world);
world.allowSleep=true;
world.defaultContactMaterial.friction=.55;
world.defaultContactMaterial.restitution=.35;

const physicsMaterial=new CANNON.Material("objects");
world.addContactMaterial(new CANNON.ContactMaterial(
physicsMaterial,physicsMaterial,{
friction:.65,restitution:.4,
contactEquationStiffness:1e7,
contactEquationRelaxation:4
}));

const floorBody=new CANNON.Body({
mass:0,material:physicsMaterial,shape:new CANNON.Plane()
});
floorBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(floorBody);

const floor=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({
color:0x111322,roughness:.45,metalness:.2
})
);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(100,100,0x303a70,0x161b35);
grid.position.y=.01;
scene.add(grid);

/* Shader */
const vs=`
varying vec3 n,p;
void main(){
 n=normalize(normalMatrix*normal);
 vec4 w=modelMatrix*vec4(position,1.);
 p=w.xyz;
 gl_Position=projectionMatrix*viewMatrix*w;
}`;

const fs=`
uniform vec3 color;
uniform float time;
varying vec3 n,p;
void main(){
 vec3 v=normalize(cameraPosition-p);
 float l=dot(normalize(n),normalize(vec3(-.3,.8,.6)));
 l=smoothstep(-.4,1.,l);
 float rim=pow(1.-max(dot(n,v),0.),2.5);
 vec3 c=color*(.42+l*.75)+color*rim*.65;
 c*=.96+sin(time*2.+p.y)*.04;
 gl_FragColor=vec4(c,1.);
}`;

/* Random geometry */
function shape(){
 const t=Math.floor(Math.random()*6),r=.35+Math.random()*.55;
 if(t===0)return{
  g:new THREE.SphereGeometry(r,16,12),
  s:new CANNON.Sphere(r)
 };
 if(t===1){
  const z=.55+Math.random()*.9;
  return{
   g:new THREE.BoxGeometry(z,z,z),
   s:new CANNON.Box(new CANNON.Vec3(z/2,z/2,z/2))
  };
 }
 if(t===2){
  const h=.7+Math.random()*1.2;
  return{
   g:new THREE.CylinderGeometry(r,r,h,16),
   s:new CANNON.Cylinder(r,r,h,12)
  };
 }
 if(t===3)return{
  g:new THREE.IcosahedronGeometry(r,1),
  s:new CANNON.Sphere(r)
 };
 if(t===4){
  const h=.8+Math.random()*1.1;
  return{
   g:new THREE.CapsuleGeometry(r,h,6,12),
   s:new CANNON.Sphere(r+h*.35)
  };
 }
 return{
  g:new THREE.TorusKnotGeometry(r,r*.32,32,8),
  s:new CANNON.Sphere(r*1.7)
 };
}

function makeObject(pos){
 const q=shape(),color=new THREE.Color();
 color.setHSL(Math.random(),.75,.52);

 const mesh=new THREE.Mesh(q.g,new THREE.ShaderMaterial({
  vertexShader:vs,fragmentShader:fs,
  uniforms:{color:{value:color},time:{value:Math.random()*10}}
 }));
 mesh.position.copy(pos);
 mesh.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
 mesh.castShadow=true;
 scene.add(mesh);

 const body=new CANNON.Body({
  mass:.8+Math.random()*2.4,
  material:physicsMaterial,
  shape:q.s,
  linearDamping:.08,
  angularDamping:.15
 });
 body.position.set(pos.x,pos.y,pos.z);
 body.velocity.set(
  (Math.random()-.5)*3,
  Math.random()*3,
  (Math.random()-.5)*3
 );
 body.angularVelocity.set(
  Math.random()*8,Math.random()*8,Math.random()*8
 );
 world.addBody(body);

 objects.push({mesh,body,impact:0,lastSpeed:0});
}

/* Cursor spawn position */
const pointer=new THREE.Vector2();
const ray=new THREE.Raycaster();
const point=new THREE.Vector3();

addEventListener("pointermove",e=>{
 pointer.x=e.clientX/innerWidth*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;
});

function spawnPosition(){
 ray.setFromCamera(pointer,camera);
 const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
 if(!ray.ray.intersectPlane(plane,point))point.set(0,0,0);
 return new THREE.Vector3(point.x,2.5,point.z);
}

/* Keyboard input */
let space=false,spawning=false,timer=null;

function setStatus(x){
 status.textContent=x+" | Objects: "+objects.length;
}

function start(){
 if(spawning)return;
 spawning=true;
 setStatus("SPAWNING");
}

function stop(){
 spawning=false;
 if(timer){clearTimeout(timer);timer=null}
 setStatus("Stopped");
}

document.addEventListener("keydown",e=>{
 if(e.code!=="Space"&&e.key!==" ")return;
 e.preventDefault();
 if(space)return;
 space=true;

 /* Immediate test object proves that keyboard input works. */
 makeObject(spawnPosition());
 setStatus("Holding Space");

 timer=setTimeout(()=>{
  if(space)start();
 },500);
});

document.addEventListener("keyup",e=>{
 if(e.code!=="Space"&&e.key!==" ")return;
 e.preventDefault();
 space=false;
 stop();
});

addEventListener("blur",()=>{
 space=false;
 stop();
});

/* Animation */
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 if(spawning){
  for(let i=0;i<objectsPerFrame;i++){
   makeObject(spawnPosition());
  }
 }

 world.step(1/60,dt,3);

 for(const o of objects){
  const b=o.body,m=o.mesh;
  m.position.set(b.position.x,b.position.y,b.position.z);
  m.quaternion.set(
   b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w
  );

  const speed=b.velocity.length();
  const hit=o.lastSpeed-speed;
  if(hit>1.5)o.impact=Math.min(1,o.impact+hit*.04);
  o.impact=Math.max(0,o.impact-dt*3.5);

  const s=o.impact*.35;
  const stretch=Math.min(speed*.025,.3);
  m.scale.x=THREE.MathUtils.lerp(m.scale.x,1+s,.2);
  m.scale.y=THREE.MathUtils.lerp(m.scale.y,1-s*.65+stretch,.2);
  m.scale.z=THREE.MathUtils.lerp(m.scale.z,1+s,.2);

  m.material.uniforms.time.value+=dt;
  o.lastSpeed=speed;
 }

 controls.update();
 if(spawning)setStatus("SPAWNING");
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
