<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gubby</title>

<style>
html,body{
  margin:0;
  overflow:hidden;
  background:#050509;
  color:#fff;
  font:14px Arial,sans-serif;
}

#ui{
  position:fixed;
  z-index:5;
  top:15px;
  left:15px;
  padding:12px 15px;
  background:#0009;
  border:1px solid #fff3;
  border-radius:12px;
  line-height:1.6;
  user-select:none;
}

#ui b{
  color:#75e6ff;
}

#optimized{
  accent-color:#75e6ff;
  vertical-align:middle;
}

#status{
  color:#9f9;
}

#error{
  display:none;
  position:fixed;
  z-index:20;
  bottom:15px;
  left:15px;
  right:15px;
  padding:12px;
  background:#900;
  border:2px solid #f77;
  white-space:pre-wrap;
  font:13px monospace;
}

#cross{
  position:fixed;
  z-index:4;
  left:50%;
  top:50%;
  width:14px;
  height:14px;
  transform:translate(-50%,-50%);
  border:1px solid #fff;
  border-radius:50%;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="ui">
  <b>Hold SPACE for 0.5 seconds</b><br>
  Move the mouse to aim<br>

  <label>
    <input type="checkbox" id="optimized">
    Optimization mode
  </label>

  <br>
  <span id="status">Objects: 0</span>
</div>

<div id="cross"></div>
<div id="error"></div>

<script>
addEventListener("error",e=>{
  const x=document.querySelector("#error");
  x.style.display="block";
  x.textContent=
    "JavaScript error:\n"+
    e.message+"\n"+
    e.filename+":"+e.lineno;
});

addEventListener("unhandledrejection",e=>{
  const x=document.querySelector("#error");
  x.style.display="block";
  x.textContent="Module error:\n"+e.reason;
});
</script>

<script type="module">
import * as T from "three";
import * as C from "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const ui=document.querySelector("#status");
const optimizedToggle=document.querySelector("#optimized");

const items=[];
const geometryCache=new Map();

let optimized=false;
let spawning=false;
let down=false;
let timer=null;
let lastStatus="";
let lastStatusTime=0;

/* Scene */
const scene=new T.Scene();
scene.background=new T.Color(0x050509);
scene.fog=new T.FogExp2(0x050509,.018);

const cam=new T.PerspectiveCamera(
  60,
  innerWidth/innerHeight,
  .1,
  500
);

cam.position.set(0,12,22);

/* Renderer */
const out=new T.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
});

out.setSize(innerWidth,innerHeight,false);
out.setPixelRatio(Math.min(devicePixelRatio,1.5));
out.shadowMap.enabled=false;
out.outputColorSpace=T.SRGBColorSpace;

document.body.appendChild(out.domElement);

/* Controls */
const controls=new OrbitControls(cam,out.domElement);
controls.enableDamping=true;
controls.target.set(0,4,0);

/* Lighting */
scene.add(
  new T.HemisphereLight(
    0xa8c7ff,
    0x241126,
    2.2
  )
);

const dl=new T.DirectionalLight(0xffffff,3.5);
dl.position.set(-8,18,10);
dl.castShadow=false;
scene.add(dl);

const pl=new T.PointLight(0xff3dbe,35,40);
pl.position.set(5,8,-8);
scene.add(pl);

/* Physics */
const world=new C.World({
  gravity:new C.Vec3(0,-15,0)
});

world.broadphase=new C.SAPBroadphase(world);
world.allowSleep=true;
world.defaultContactMaterial.friction=.55;
world.defaultContactMaterial.restitution=.35;

const pm=new C.Material("objects");

world.addContactMaterial(
  new C.ContactMaterial(pm,pm,{
    friction:.65,
    restitution:.4,
    contactEquationStiffness:1e7,
    contactEquationRelaxation:4
  })
);

const fb=new C.Body({
  mass:0,
  material:pm,
  shape:new C.Plane()
});

fb.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(fb);

/* Floor */
const floor=new T.Mesh(
  new T.PlaneGeometry(100,100),
  new T.MeshStandardMaterial({
    color:0x111322,
    roughness:.45,
    metalness:.2
  })
);

floor.rotation.x=-Math.PI/2;
floor.receiveShadow=false;
scene.add(floor);

const grid=new T.GridHelper(
  100,
  100,
  0x303a70,
  0x161b35
);

grid.position.y=.01;
scene.add(grid);

/* Object shader */
const vs=`
varying vec3 n;
varying vec3 p;

void main(){
  n=normalize(normalMatrix*normal);

  vec4 w=modelMatrix*vec4(position,1.0);
  p=w.xyz;

  gl_Position=projectionMatrix*viewMatrix*w;
}
`;

const fs=`
uniform vec3 color;
uniform float time;

varying vec3 n;
varying vec3 p;

void main(){
  vec3 v=normalize(cameraPosition-p);

  float l=dot(
    normalize(n),
    normalize(vec3(-.3,.8,.6))
  );

  l=smoothstep(-.4,1.0,l);

  float r=pow(
    1.0-max(dot(n,v),0.0),
    2.5
  );

  vec3 c=color*(.42+l*.75)+color*r*.65;

  c*=.96+sin(time*2.0+p.y)*.04;

  gl_FragColor=vec4(c,1.0);
}
`;

/*
  Cache a limited number of geometry variations.
  This prevents every object from creating a unique
  GPU geometry allocation.
*/
function cachedGeometry(key,create){
  if(!geometryCache.has(key)){
    geometryCache.set(key,create());
  }

  return geometryCache.get(key);
}

function randomShape(){
  const type=Math.floor(Math.random()*6);
  const r=.35+Math.random()*.55;

  if(type===0){
    const radius=Math.round(r*10)/10;

    return cachedGeometry(
      `sphere-${radius}`,
      ()=>({
        g:new T.SphereGeometry(
          radius,
          optimized?8:16,
          optimized?6:12
        ),
        s:new C.Sphere(radius)
      })
    );
  }

  if(type===1){
    const z=Math.round((.55+Math.random()*.9)*10)/10;

    return cachedGeometry(
      `box-${z}`,
      ()=>({
        g:new T.BoxGeometry(z,z,z),
        s:new C.Box(
          new C.Vec3(z/2,z/2,z/2)
        )
      })
    );
  }

  if(type===2){
    const radius=Math.round(r*10)/10;
    const height=Math.round((.7+Math.random()*1.2)*10)/10;

    return cachedGeometry(
      `cylinder-${radius}-${height}`,
      ()=>({
        g:new T.CylinderGeometry(
          radius,
          radius,
          height,
          optimized?8:16
        ),
        s:new C.Cylinder(
          radius,
          radius,
          height,
          optimized?8:12
        )
      })
    );
  }

  if(type===3){
    const radius=Math.round(r*10)/10;

    return cachedGeometry(
      `ico-${radius}`,
      ()=>({
        g:new T.IcosahedronGeometry(
          radius,
          optimized?0:1
        ),
        s:new C.Sphere(radius)
      })
    );
  }

  /*
    More expensive shapes are replaced with simple
    spheres in optimization mode.
  */
  if(type===4 && !optimized){
    const height=.8+Math.random()*1.1;

    return {
      g:new T.CapsuleGeometry(
        r,
        height,
        4,
        8
      ),
      s:new C.Sphere(r+height*.35)
    };
  }

  if(!optimized){
    return {
      g:new T.TorusKnotGeometry(
        r,
        r*.32,
        16,
        6
      ),
      s:new C.Sphere(r*1.7)
    };
  }

  return {
    g:new T.SphereGeometry(r,8,6),
    s:new C.Sphere(r)
  };
}

function createMaterial(color){
  return new T.ShaderMaterial({
    vertexShader:vs,
    fragmentShader:fs,
    uniforms:{
      color:{value:color},
      time:{value:Math.random()*10}
    }
  });
}

function make(pos){
  const q=randomShape();

  const color=new T.Color();
  color.setHSL(
    Math.random(),
    .75,
    .52
  );

  const mesh=new T.Mesh(
    q.g,
    createMaterial(color)
  );

  mesh.position.copy(pos);

  mesh.rotation.set(
    Math.random()*6,
    Math.random()*6,
    Math.random()*6
  );

  mesh.castShadow=false;
  scene.add(mesh);

  const body=new C.Body({
    mass:.8+Math.random()*2.4,
    material:pm,
    shape:q.s,
    linearDamping:.08,
    angularDamping:.15,
    allowSleep:true
  });

  body.position.set(
    pos.x,
    pos.y,
    pos.z
  );

  body.velocity.set(
    (Math.random()-.5)*3,
    Math.random()*3,
    (Math.random()-.5)*3
  );

  body.angularVelocity.set(
    Math.random()*8,
    Math.random()*8,
    Math.random()*8
  );

  world.addBody(body);

  items.push({
    mesh,
    body,
    impact:0,
    last:0
  });
}

/* Mouse aiming */
const pointer=new T.Vector2();
const ray=new T.Raycaster();
const hit=new T.Vector3();

addEventListener("pointermove",e=>{
  pointer.x=e.clientX/innerWidth*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;
});

function spawnPoint(){
  ray.setFromCamera(pointer,cam);

  const plane=new T.Plane(
    new T.Vector3(0,1,0),
    0
  );

  if(!ray.ray.intersectPlane(plane,hit)){
    hit.set(0,0,0);
  }

  return new T.Vector3(
    hit.x,
    2.5,
    hit.z
  );
}

/* UI */
function status(text){
  const now=performance.now();

  /*
    Updating text every frame becomes expensive when
    thousands of objects are present.
  */
  if(
    text!==lastStatus ||
    now-lastStatusTime>250
  ){
    ui.textContent=
      `${text} | Objects: ${items.length}`;

    lastStatus=text;
    lastStatusTime=now;
  }
}

/* Optimization mode */
optimizedToggle.addEventListener("change",()=>{
  optimized=optimizedToggle.checked;

  if(optimized){
    out.setPixelRatio(1);
    out.shadowMap.enabled=false;

    scene.fog.density=.012;
    dl.intensity=2.2;
    pl.intensity=15;

    status("Optimization mode enabled");
  }else{
    out.setPixelRatio(
      Math.min(devicePixelRatio,1.5)
    );

    scene.fog.density=.018;
    dl.intensity=3.5;
    pl.intensity=35;

    status("Normal mode enabled");
  }

  out.setSize(
    innerWidth,
    innerHeight,
    false
  );
});

/* Keyboard control */
function stop(){
  spawning=false;

  if(timer){
    clearTimeout(timer);
    timer=null;
  }

  status("Stopped");
}

document.addEventListener("keydown",e=>{
  if(e.code!=="Space" && e.key!==" ")return;

  e.preventDefault();

  if(down)return;

  down=true;

  /*
    Spawn one object immediately so the button
    feels responsive.
  */
  make(spawnPoint());
  status("Holding Space");

  timer=setTimeout(()=>{
    if(down){
      spawning=true;
      status("SPAWNING");
    }
  },500);
});

document.addEventListener("keyup",e=>{
  if(e.code!=="Space" && e.key!==" ")return;

  e.preventDefault();

  down=false;
  stop();
});

addEventListener("blur",()=>{
  down=false;
  stop();
});

/* Animation */
const clock=new T.Clock();
let frameCounter=0;

function loop(){
  requestAnimationFrame(loop);

  const dt=Math.min(
    clock.getDelta(),
    .05
  );

  if(spawning){
    /*
      Adaptive spawning:
      - Normal mode tries to spawn more objects.
      - Optimization mode uses smaller batches.
      - If the frame rate drops, spawning slows
        instead of locking the browser.
    */
    let amount=optimized?4:10;

    if(dt>.035){
      amount=1;
    }else if(dt>.025){
      amount=Math.max(
        1,
        Math.floor(amount/2)
      );
    }

    for(let i=0;i<amount;i++){
      make(spawnPoint());
    }

    status("SPAWNING");
  }

  /*
    One physics substep in optimization mode is much
    cheaper than three and is enough for large tests.
  */
  world.step(
    1/60,
    dt,
    optimized?1:3
  );

  for(const o of items){
    const mesh=o.mesh;
    const body=o.body;

    mesh.position.set(
      body.position.x,
      body.position.y,
      body.position.z
    );

    mesh.quaternion.set(
      body.quaternion.x,
      body.quaternion.y,
      body.quaternion.z,
      body.quaternion.w
    );

    const speed=body.velocity.length();

    /*
      Squash/stretch animation is disabled in
      optimization mode to reduce CPU and GPU work.
    */
    if(!optimized){
      const impact=o.last-speed;

      if(impact>1.5){
        o.impact=Math.min(
          1,
          o.impact+impact*.04
        );
      }

      o.impact=Math.max(
        0,
        o.impact-dt*3.5
      );

      const z=o.impact*.35;
      const stretch=Math.min(
        speed*.025,
        .3
      );

      mesh.scale.x=T.MathUtils.lerp(
        mesh.scale.x,
        1+z,
        .2
      );

      mesh.scale.y=T.MathUtils.lerp(
        mesh.scale.y,
        1-z*.65+stretch,
        .2
      );

      mesh.scale.z=T.MathUtils.lerp(
        mesh.scale.z,
        1+z,
        .2
      );

      mesh.material.uniforms.time.value+=dt;
    }

    o.last=speed;
  }

  controls.update();

  if(frameCounter++%15===0){
    status(spawning?"SPAWNING":"Running");
  }

  out.render(scene,cam);
}

loop();

/* Resize */
addEventListener("resize",()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();

  out.setSize(
    innerWidth,
    innerHeight,
    false
  );
});
</script>

</body>
</html>
