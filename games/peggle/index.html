<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peggle Clone</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #273b73, #11182e 70%);
      color: white;
      font-family: system-ui, sans-serif;
    }

    .game-wrap {
      width: min(94vw, 760px);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      letter-spacing: 3px;
      color: #ffd166;
      text-shadow: 0 3px #a44d8f;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 10px 15px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.3);
      font-weight: 700;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 4px solid #6c5ce7;
      border-radius: 16px;
      background: #172348;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
      cursor: crosshair;
    }

    button {
      margin-top: 12px;
      border: 0;
      border-radius: 999px;
      padding: 10px 20px;
      background: #ff6b6b;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #ff8787;
    }

    .help {
      margin-top: 8px;
      color: #c9d4ff;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="game-wrap">
    <h1>PEGGLE</h1>

    <div class="hud">
      <span>Score: <b id="score">0</b></span>
      <span>Pegs left: <b id="left">0</b></span>
      <span>Balls: <b id="balls">∞</b></span>
    </div>

    <canvas id="game" width="720" height="820"></canvas>

    <button id="restart">Restart Game</button>

    <div class="help">
      Move the mouse to aim. Click to fire. Hold Space for 0.5 seconds to rapid-fire.
    </div>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const leftEl = document.getElementById("left");
    const ballsEl = document.getElementById("balls");
    const restartBtn = document.getElementById("restart");

    const W = canvas.width;
    const H = canvas.height;

    const shooter = {
      x: W / 2,
      y: 48,
      angle: Math.PI / 2
    };

    const gravity = 0.22;
    const ballRadius = 9;
    const pegRadius = 17;

    let pegs = [];
    let balls = [];
    let particles = [];

    let score = 0;
    let gameOver = false;
    let message = "";

    let spaceHeld = false;
    let rapidFireTimer = null;
    let spaceHoldTimer = null;

    function makeLevel() {
      pegs = [];

      const rows = 8;
      const cols = 8;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const offset = row % 2 ? 45 : 0;
          const x = 70 + col * 84 + offset;
          const y = 145 + row * 72;

          if (x < W - 35 && Math.random() > 0.08) {
            pegs.push({
              x,
              y,
              active: true,
              color: Math.random() < 0.2 ? "orange" : "blue"
            });
          }
        }
      }

      // Guarantee that some orange pegs exist
      if (pegs.length > 3) {
        pegs[3].color = "orange";
        pegs[pegs.length - 4].color = "orange";
      }
    }

    function resetGame() {
      clearTimeout(spaceHoldTimer);
      clearInterval(rapidFireTimer);

      spaceHeld = false;
      rapidFireTimer = null;
      spaceHoldTimer = null;

      score = 0;
      balls = [];
      particles = [];
      gameOver = false;
      message = "";

      makeLevel();
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = score;
      leftEl.textContent = pegs.filter(peg => peg.active).length;
      ballsEl.textContent = "∞";
    }

    function getMousePosition(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) * W / rect.width,
        y: (event.clientY - rect.top) * H / rect.height
      };
    }

    function aimAt(x, y) {
      shooter.angle = Math.atan2(y - shooter.y, x - shooter.x);

      // Keep the cannon aimed mostly downward
      shooter.angle = Math.max(
        0.22,
        Math.min(Math.PI - 0.22, shooter.angle)
      );
    }

    function shoot() {
      if (gameOver) return;

      const speed = 9;

      balls.push({
        x: shooter.x,
        y: shooter.y,
        vx: Math.cos(shooter.angle) * speed,
        vy: Math.sin(shooter.angle) * speed,
        life: 0
      });
    }

    function hitPeg(ball, peg) {
      const dx = ball.x - peg.x;
      const dy = ball.y - peg.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const minDistance = ballRadius + pegRadius;

      if (distance < minDistance) {
        const nx = dx / (distance || 1);
        const ny = dy / (distance || 1);

        // Push ball outside the peg
        ball.x = peg.x + nx * minDistance;
        ball.y = peg.y + ny * minDistance;

        // Reflect velocity
        const dot = ball.vx * nx + ball.vy * ny;

        ball.vx -= 2 * dot * nx;
        ball.vy -= 2 * dot * ny;

        ball.vx *= 0.94;
        ball.vy *= 0.94;

        peg.active = false;

        score += peg.color === "orange" ? 100 : 25;

        burst(peg.x, peg.y, peg.color);
        updateHud();

        if (pegs.every(peg => !peg.active)) {
          gameOver = true;
          message = "LEVEL CLEARED!";
        }
      }
    }

    function updateBall(ball) {
      ball.life++;

      ball.vy += gravity;
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Left wall
      if (ball.x - ballRadius < 0) {
        ball.x = ballRadius;
        ball.vx *= -0.85;
      }

      // Right wall
      if (ball.x + ballRadius > W) {
        ball.x = W - ballRadius;
        ball.vx *= -0.85;
      }

      // Ceiling
      if (ball.y - ballRadius < 0) {
        ball.y = ballRadius;
        ball.vy *= -0.85;
      }

      for (const peg of pegs) {
        if (peg.active) {
          hitPeg(ball, peg);
        }
      }
    }

    function update() {
      if (!gameOver) {
        for (const ball of balls) {
          updateBall(ball);
        }

        // Remove balls after they fall below the screen
        balls = balls.filter(ball => ball.y < H + 60);
      }

      updateParticles();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);

      gradient.addColorStop(0, "#24366c");
      gradient.addColorStop(1, "#0d1530");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      // Stars
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";

      for (let i = 0; i < 45; i++) {
        const x = (i * 137) % W;
        const y = 80 + ((i * 83) % 700);

        ctx.fillRect(x, y, 2, 2);
      }
    }

    function drawShooter() {
      const length = 45;
      const endX = shooter.x + Math.cos(shooter.angle) * length;
      const endY = shooter.y + Math.sin(shooter.angle) * length;

      ctx.save();

      ctx.lineWidth = 13;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#f5f7ff";

      ctx.beginPath();
      ctx.moveTo(shooter.x, shooter.y);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.arc(shooter.x, shooter.y, 15, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ff9f1c";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    function drawPegs() {
      for (const peg of pegs) {
        if (!peg.active) continue;

        const color = peg.color === "orange"
          ? "#ff7b22"
          : "#4cc9f0";

        const highlight = peg.color === "orange"
          ? "#ffd166"
          : "#b8f2ff";

        ctx.save();

        ctx.shadowColor = color;
        ctx.shadowBlur = 12;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(peg.x, peg.y, pegRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = highlight;

        ctx.beginPath();
        ctx.arc(peg.x - 6, peg.y - 6, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawBalls() {
      for (const ball of balls) {
        ctx.save();

        ctx.shadowColor = "#fff";
        ctx.shadowBlur = 14;

        const gradient = ctx.createRadialGradient(
          ball.x - 3,
          ball.y - 4,
          1,
          ball.x,
          ball.y,
          ballRadius
        );

        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(0.4, "#ffe66d");
        gradient.addColorStop(1, "#ff8c42");

        ctx.fillStyle = gradient;

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawParticles() {
      for (const particle of particles) {
        ctx.globalAlpha = particle.life / particle.maxLife;
        ctx.fillStyle = particle.color;

        ctx.beginPath();
        ctx.arc(
          particle.x,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    function drawMessage() {
      if (!message) return;

      ctx.save();

      ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
      ctx.fillRect(0, H / 2 - 70, W, 140);

      ctx.textAlign = "center";

      ctx.fillStyle = "#ffd166";
      ctx.font = "bold 42px system-ui";
      ctx.fillText(message, W / 2, H / 2);

      ctx.fillStyle = "white";
      ctx.font = "18px system-ui";
      ctx.fillText(
        "Press Restart Game to play again",
        W / 2,
        H / 2 + 38
      );

      ctx.restore();
    }

    function burst(x, y, color) {
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 4,
          color: color === "orange" ? "#ff9f1c" : "#4cc9f0",
          life: 1,
          maxLife: 35 + Math.random() * 25
        });
      }
    }

    function updateParticles() {
      for (const particle of particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += 0.08;
        particle.life++;
      }

      particles = particles.filter(
        particle => particle.life < particle.maxLife
      );
    }

    canvas.addEventListener("mousemove", event => {
      const mouse = getMousePosition(event);
      aimAt(mouse.x, mouse.y);
    });

    canvas.addEventListener("click", shoot);

    document.addEventListener("keydown", event => {
      if (event.code !== "Space") return;
      if (event.repeat || spaceHeld) return;

      event.preventDefault();

      spaceHeld = true;

      // Fire immediately when Space is pressed
      shoot();

      // Wait 0.5 seconds before starting rapid-fire
      spaceHoldTimer = setTimeout(() => {
        if (!spaceHeld) return;

        /*
          JavaScript cannot truly run every 0.00001 seconds.
          The browser runs this as fast as its timer and event loop allow.
        */
        rapidFireTimer = setInterval(() => {
          if (spaceHeld && !gameOver) {
            shoot();
          }
        }, 1);
      }, 500);
    });

    document.addEventListener("keyup", event => {
      if (event.code !== "Space") return;

      event.preventDefault();

      spaceHeld = false;

      clearTimeout(spaceHoldTimer);
      clearInterval(rapidFireTimer);

      spaceHoldTimer = null;
      rapidFireTimer = null;
    });

    restartBtn.addEventListener("click", resetGame);

    function gameLoop() {
      update();
      draw();

      requestAnimationFrame(gameLoop);
    }

    resetGame();
    gameLoop();
  </script>
</body>
</html>
