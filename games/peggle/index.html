<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peggle Clone</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #273b73, #11182e 70%);
      color: white;
      font-family: Arial, sans-serif;
    }

    .game-wrap {
      width: min(94vw, 760px);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: #ffd166;
      letter-spacing: 4px;
      text-shadow: 0 3px #a44d8f;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 10px 15px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.35);
      font-weight: bold;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 4px solid #6c5ce7;
      border-radius: 16px;
      background: #172348;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      cursor: crosshair;
    }

    button {
      margin-top: 12px;
      padding: 11px 22px;
      border: 0;
      border-radius: 999px;
      background: #ff6b6b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff8787;
    }

    .help {
      margin-top: 8px;
      color: #c9d4ff;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="game-wrap">
    <h1>PEGGLE</h1>

    <div class="hud">
      <span>Score: <b id="score">0</b></span>
      <span>Pegs left: <b id="left">0</b></span>
      <span>Balls: <b>∞</b></span>
    </div>

    <canvas id="game" width="720" height="820"></canvas>

    <button id="restart">Restart Game</button>

    <div class="help">
      Move the mouse to aim. Click to fire. Hold Space for 0.5 seconds to rapid-fire.
    </div>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const leftElement = document.getElementById("left");
    const restartButton = document.getElementById("restart");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const BALL_RADIUS = 9;
    const PEG_RADIUS = 17;
    const GRAVITY = 0.22;

    const shooter = {
      x: WIDTH / 2,
      y: 48,
      angle: Math.PI / 2
    };

    let pegs = [];
    let balls = [];
    let particles = [];

    let score = 0;
    let gameOver = false;
    let message = "";

    let spaceHeld = false;
    let spaceHoldTimer = null;
    let rapidFireTimer = null;

    function createLevel() {
      pegs = [];

      const rows = 8;
      const columns = 8;

      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          const offset = row % 2 === 1 ? 42 : 0;
          const x = 70 + column * 84 + offset;
          const y = 145 + row * 72;

          if (x < WIDTH - 35) {
            pegs.push({
              x,
              y,
              active: true,
              color: Math.random() < 0.2 ? "orange" : "blue"
            });
          }
        }
      }

      // Guarantee orange pegs
      if (pegs.length >= 4) {
        pegs[3].color = "orange";
        pegs[pegs.length - 4].color = "orange";
      }
    }

    function resetGame() {
      clearTimeout(spaceHoldTimer);
      clearInterval(rapidFireTimer);

      spaceHeld = false;
      spaceHoldTimer = null;
      rapidFireTimer = null;

      score = 0;
      balls = [];
      particles = [];
      gameOver = false;
      message = "";

      createLevel();
      updateHud();
    }

    function updateHud() {
      scoreElement.textContent = score;
      leftElement.textContent = pegs.filter(peg => peg.active).length;
    }

    function getMousePosition(event) {
      const rectangle = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - rectangle.left) * WIDTH / rectangle.width,
        y: (event.clientY - rectangle.top) * HEIGHT / rectangle.height
      };
    }

    function aimAt(x, y) {
      shooter.angle = Math.atan2(y - shooter.y, x - shooter.x);

      // Keep the cannon aimed downward
      shooter.angle = Math.max(
        0.22,
        Math.min(Math.PI - 0.22, shooter.angle)
      );
    }

    function shoot() {
      if (gameOver) return;

      const speed = 9;

      balls.push({
        x: shooter.x,
        y: shooter.y,
        vx: Math.cos(shooter.angle) * speed,
        vy: Math.sin(shooter.angle) * speed,
        life: 0
      });
    }

    function hitPeg(ball, peg) {
      const dx = ball.x - peg.x;
      const dy = ball.y - peg.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const minimumDistance = BALL_RADIUS + PEG_RADIUS;

      if (distance >= minimumDistance) return;

      const normalX = dx / (distance || 1);
      const normalY = dy / (distance || 1);

      // Move ball outside of peg
      ball.x = peg.x + normalX * minimumDistance;
      ball.y = peg.y + normalY * minimumDistance;

      // Bounce ball away from peg
      const velocityAlongNormal =
        ball.vx * normalX + ball.vy * normalY;

      ball.vx -= 2 * velocityAlongNormal * normalX;
      ball.vy -= 2 * velocityAlongNormal * normalY;

      ball.vx *= 0.94;
      ball.vy *= 0.94;

      peg.active = false;

      score += peg.color === "orange" ? 100 : 25;

      createBurst(peg.x, peg.y, peg.color);
      updateHud();

      if (pegs.every(peg => !peg.active)) {
        gameOver = true;
        message = "LEVEL CLEARED!";
      }
    }

    function updateBall(ball) {
      ball.life++;

      ball.vy += GRAVITY;
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Left wall
      if (ball.x - BALL_RADIUS < 0) {
        ball.x = BALL_RADIUS;
        ball.vx *= -0.85;
      }

      // Right wall
      if (ball.x + BALL_RADIUS > WIDTH) {
        ball.x = WIDTH - BALL_RADIUS;
        ball.vx *= -0.85;
      }

      // Ceiling
      if (ball.y - BALL_RADIUS < 0) {
        ball.y = BALL_RADIUS;
        ball.vy *= -0.85;
      }

      for (const peg of pegs) {
        if (peg.active) {
          hitPeg(ball, peg);
        }
      }
    }

    function update() {
      if (!gameOver) {
        for (const ball of balls) {
          updateBall(ball);
        }

        // Remove balls once they fall below the screen.
        // This does not limit how many balls can be fired.
        balls = balls.filter(ball => ball.y < HEIGHT + 70);
      }

      updateParticles();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);

      gradient.addColorStop(0, "#24366c");
      gradient.addColorStop(1, "#0d1530");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Background stars
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";

      for (let i = 0; i < 55; i++) {
        const x = (i * 137) % WIDTH;
        const y = 80 + ((i * 83) % 700);

        ctx.fillRect(x, y, 2, 2);
      }
    }

    function drawShooter() {
      const barrelLength = 45;

      const endX =
        shooter.x + Math.cos(shooter.angle) * barrelLength;

      const endY =
        shooter.y + Math.sin(shooter.angle) * barrelLength;

      ctx.save();

      ctx.lineWidth = 13;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#f5f7ff";

      ctx.beginPath();
      ctx.moveTo(shooter.x, shooter.y);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.arc(shooter.x, shooter.y, 15, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ff9f1c";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    function drawPegs() {
      for (const peg of pegs) {
        if (!peg.active) continue;

        const pegColor =
          peg.color === "orange" ? "#ff7b22" : "#4cc9f0";

        const highlightColor =
          peg.color === "orange" ? "#ffd166" : "#b8f2ff";

        ctx.save();

        ctx.shadowColor = pegColor;
        ctx.shadowBlur = 14;

        ctx.fillStyle = pegColor;
        ctx.beginPath();
        ctx.arc(peg.x, peg.y, PEG_RADIUS, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = highlightColor;

        ctx.beginPath();
        ctx.arc(peg.x - 6, peg.y - 6, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawBalls() {
      for (const ball of balls) {
        ctx.save();

        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 14;

        const gradient = ctx.createRadialGradient(
          ball.x - 3,
          ball.y - 4,
          1,
          ball.x,
          ball.y,
          BALL_RADIUS
        );

        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(0.4, "#ffe66d");
        gradient.addColorStop(1, "#ff8c42");

        ctx.fillStyle = gradient;

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawParticles() {
      for (const particle of particles) {
        ctx.globalAlpha = particle.life / particle.maxLife;
        ctx.fillStyle = particle.color;

        ctx.beginPath();
        ctx.arc(
          particle.x,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    function drawMessage() {
      if (!message) return;

      ctx.save();

      ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
      ctx.fillRect(0, HEIGHT / 2 - 70, WIDTH, 140);

      ctx.textAlign = "center";

      ctx.fillStyle = "#ffd166";
      ctx.font = "bold 42px Arial";
      ctx.fillText(message, WIDTH / 2, HEIGHT / 2);

      ctx.fillStyle = "white";
      ctx.font = "18px Arial";
      ctx.fillText(
        "Press Restart Game to play again",
        WIDTH / 2,
        HEIGHT / 2 + 38
      );

      ctx.restore();
    }

    function createBurst(x, y, pegColor) {
      const color =
        pegColor === "orange" ? "#ff9f1c" : "#4cc9f0";

      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 4,
          color,
          life: 0,
          maxLife: 35 + Math.random() * 25
        });
      }
    }

    function updateParticles() {
      for (const particle of particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += 0.08;
        particle.life++;
      }

      particles = particles.filter(
        particle => particle.life < particle.maxLife
      );
    }

    function draw() {
      drawBackground();
      drawPegs();
      drawShooter();
      drawBalls();
      drawParticles();
      drawMessage();
    }

    canvas.addEventListener("mousemove", event => {
      const mouse = getMousePosition(event);
      aimAt(mouse.x, mouse.y);
    });

    canvas.addEventListener("click", () => {
      shoot();
    });

    document.addEventListener("keydown", event => {
      if (event.code !== "Space") return;
      if (event.repeat || spaceHeld) return;

      event.preventDefault();
      spaceHeld = true;

      // Fire once immediately
      shoot();

      // Start rapid-fire after 0.5 seconds
      spaceHoldTimer = setTimeout(() => {
        if (!spaceHeld) return;

        /*
          A browser cannot reliably fire every 0.00001 seconds.
          16ms is approximately 60 balls per second and prevents freezing.
        */
        rapidFireTimer = setInterval(() => {
          if (spaceHeld && !gameOver) {
            shoot();
          }
        }, 16);
      }, 500);
    });

    document.addEventListener("keyup", event => {
      if (event.code !== "Space") return;

      event.preventDefault();

      spaceHeld = false;

      clearTimeout(spaceHoldTimer);
      clearInterval(rapidFireTimer);

      spaceHoldTimer = null;
      rapidFireTimer = null;
    });

    restartButton.addEventListener("click", resetGame);

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    resetGame();
    gameLoop();
  </script>
</body>
</html>
