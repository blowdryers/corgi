<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LyricType</title>
<style>
:root{--a:#8b5cf6;--b:#ec4899;--bg:#020617;--panel:#0f172acc;--muted:#94a3b8}
*{box-sizing:border-box}body{margin:0;color:#f8fafc;background:var(--bg);font:15px system-ui,sans-serif}
body:before{content:"";position:fixed;inset:-50px;z-index:-2;background:var(--bg);background-image:linear-gradient(#020617aa,#020617cc),var(--art);background-size:cover;background-position:center;filter:blur(28px);transform:scale(1.1);transition:.6s}
.app{width:min(1050px,calc(100% - 28px));margin:auto;padding:25px 0 60px}
h1{margin:0;font-size:clamp(27px,5vw,40px)}p{margin:3px 0;color:var(--muted)}
.logo{display:inline-grid;place-items:center;width:43px;height:43px;margin-right:10px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));font-size:23px;vertical-align:middle}
.box,.card{border:1px solid #ffffff20;border-radius:22px;background:var(--panel);box-shadow:0 20px 70px #0005;backdrop-filter:blur(18px)}
.box{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px;margin:24px 0 12px}
.row{display:flex;gap:9px}.row input{flex:1}
input{min-width:0;padding:14px 15px;border:1px solid #ffffff20;border-radius:13px;outline:0;color:white;background:#020617aa;font:inherit}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px #8b5cf633}
button{border:0;border-radius:13px;padding:0 19px;color:white;background:linear-gradient(135deg,var(--a),var(--b));font:inherit;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.info{display:flex;align-items:center;gap:10px}.cover{width:48px;height:48px;border-radius:9px;object-fit:cover}
.name{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:bold}.artist,.status{color:var(--muted);font-size:13px}.status{grid-column:1/-1;min-height:18px}
.results{display:grid;gap:8px;margin-bottom:12px}.result{display:flex;align-items:center;gap:11px;width:100%;padding:9px;text-align:left;background:#0f172aee;border:1px solid #ffffff20}
.result img{width:50px;height:50px;border-radius:8px;object-fit:cover}.result div{overflow:hidden}.result b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result small{color:var(--muted)}
.card{min-height:440px;padding:clamp(22px,5vw,48px);display:flex;flex-direction:column;justify-content:center}
.empty{text-align:center;color:var(--muted)}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.progress{height:6px;border-radius:9px;background:#ffffff18;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:.2s}
.lyrics{min-height:125px;font-size:clamp(23px,4vw,39px);line-height:1.55;font-weight:650;overflow-wrap:anywhere}
.pending{color:#f8fafc55}.correct{color:#86efac}.wrong{color:#fb7185;text-decoration:underline}.cursor{display:inline-block;width:3px;height:1em;background:#c4b5fd;margin-left:3px;animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}
#typing{width:100%;margin-top:30px;font-size:18px}.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;padding:17px;text-align:center}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}
@media(max-width:700px){.box{grid-template-columns:1fr}.info{justify-content:flex-start}.row{flex-direction:column}.row button{height:48px}}
</style>
</head>
<body>
<main class="app">
<h1><span class="logo">♪</span>LyricType</h1>
<p>Type the lyrics. Find your flow.</p>

<section class="box">
  <div class="row">
    <input id="search" placeholder="Search for a song and artist..." autocomplete="off">
    <button id="find">Search</button>
  </div>
  <div class="info">
    <img id="cover" class="cover" src="https://placehold.co/100x100/111827/94a3b8?text=%E2%99%AA">
    <div><div id="song" class="name">No song selected</div><div id="artist" class="artist">Search above to begin</div></div>
  </div>
  <div id="status" class="status"></div>
</section>

<div id="results" class="results"></div>

<section class="card">
  <div id="empty" class="empty">Search for a song to load its lyrics.</div>
  <div id="game" hidden>
    <div class="progress-label"><span id="line">Line 1</span><span id="percent">0%</span></div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="lyrics" class="lyrics"></div>
    <input id="typing" placeholder="Start typing here..." disabled spellcheck="false" autocomplete="off">
    <div class="hint">Capital letters and punctuation are ignored.</div>
  </div>
</section>

<section class="stats">
  <div class="stat"><b id="wpm">0</b><small>WPM</small></div>
  <div class="stat"><b id="accuracy">100%</b><small>ACCURACY</small></div>
  <div class="stat"><b id="mistakes">0</b><small>MISTAKES</small></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id),search=$("search"),find=$("find"),results=$("results");
const status=$("status"),cover=$("cover"),song=$("song"),artistEl=$("artist"),typing=$("typing");
const lyricsEl=$("lyrics"),game=$("game"),empty=$("empty"),bar=$("bar"),lineEl=$("line"),percent=$("percent");
let tracks=[],chosen=null,lines=[],line=0,start=0,typedTotal=0,correctTotal=0,mistakesTotal=0;

find.onclick=searchSongs;
search.onkeydown=e=>{if(e.key==="Enter")searchSongs()};
typing.oninput=typeLine;

async function fetcher(url,ms=10000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{return await fetch(url,{signal:c.signal})}finally{clearTimeout(t)}
}

async function searchSongs(){
  let q=search.value.trim();if(!q)return;
  find.disabled=true;results.innerHTML="";status.textContent="Searching...";
  try{
    let r=await fetcher("https://itunes.apple.com/search?term="+encodeURIComponent(q)+"&entity=song&limit=12");
    let d=await r.json();tracks=d.results||[];
    if(!tracks.length){status.textContent="No songs found.";return}
    status.textContent="Choose a song:";
    tracks.forEach((t,i)=>{
      let b=document.createElement("button");b.className="result";
      b.innerHTML=`<img src="${art(t.artworkUrl100)}"><div><b>${esc(t.trackName)}</b><small>${esc(t.artistName)}${t.collectionName?" • "+esc(t.collectionName):""}</small></div>`;
      b.onclick=()=>loadSong(t);results.appendChild(b);
    });
  }catch(e){status.textContent="Song search failed. Check your connection."}
  finally{find.disabled=false}
}

async function loadSong(t){
  chosen=t;results.innerHTML="";song.textContent=t.trackName;artistEl.textContent=t.artistName;
  let image=art(t.artworkUrl100);cover.src=image;
  document.body.style.setProperty("--art",`url("${image}")`);
  status.textContent="Trying lyric providers...";typing.disabled=true;game.hidden=true;empty.hidden=false;
  try{
    let got=await getLyrics(t.artistName,t.trackName);
    if(!got)throw Error("No lyrics were found for this song.");
    lines=clean(got);if(!lines.length)throw Error("The lyrics response was empty.");
    reset();status.textContent="Lyrics loaded.";empty.hidden=true;game.hidden=false;typing.disabled=false;typing.focus();
  }catch(e){status.textContent=e.message}
}

async function getLyrics(a,t){
  let providers=[
    async()=>{let r=await fetcher("https://lrclib.net/api/get?artist_name="+encodeURIComponent(a)+"&track_name="+encodeURIComponent(t));if(!r.ok)return"";let d=await r.json();return d.plainLyrics||strip(d.syncedLyrics)},
    async()=>{let r=await fetcher("https://lrclib.net/api/search?track_name="+encodeURIComponent(t)+"&artist_name="+encodeURIComponent(a));if(!r.ok)return"";let d=await r.json(),x=d.find(x=>x.plainLyrics||x.syncedLyrics);return x?.plainLyrics||strip(x?.syncedLyrics)},
    async()=>{let r=await fetcher("https://api.lyrics.ovh/v1/"+encodeURIComponent(a)+"/"+encodeURIComponent(t));if(!r.ok)return"";return(await r.json()).lyrics||""}
  ];
  for(let p of providers)try{let x=await p();if(x&&x.trim())return x}catch(e){}
  return"";
}

function strip(x){return(x||"").replace(/\[\d{1,2}:\d{2}(?:[.:]\d{1,3})?\]/g,"")}
function clean(x){return x.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(x=>x&&!/^\[.*\]$/.test(x))}
function art(x){return x?x.replace("100x100","1000x1000"):"https://placehold.co/1000x1000/111827/94a3b8?text=%E2%99%AA"}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

/* Lowercase and remove punctuation before comparing. Spaces remain meaningful. */
function norm(x){return x.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,"").replace(/\s+/g," ")}
function reset(){line=0;start=0;typedTotal=correctTotal=mistakesTotal=0;typing.value="";render();stats()}
function render(){
  if(line>=lines.length)return finish();
  lyricsEl.innerHTML=[...lines[line]].map(c=>`<span class="pending">${c===" "?" ":esc(c)}</span>`).join("")+'<i class="cursor"></i>';
  lineEl.textContent=`Line ${line+1} of ${lines.length}`;let p=Math.round(line/lines.length*100);
  percent.textContent=p+"%";bar.style.width=p+"%";typing.value="";
}
function typeLine(){
  let expected=lines[line],raw=typing.value;
  if(!start&&raw)start=Date.now();
  let e=norm(expected),v=norm(raw),sp=lyricsEl.querySelectorAll("span");
  typedTotal=lines.slice(0,line).reduce((n,x)=>n+norm(x).length,0)+v.length;
  correctTotal=lines.slice(0,line).reduce((n,x)=>n+norm(x).length,0);
  for(let i=0;i<v.length;i++)if(v[i]===e[i])correctTotal++;
  mistakesTotal=0;for(let i=0;i<v.length;i++)if(v[i]!==e[i])mistakesTotal++;
  [...sp].forEach((s,i)=>{s.className=i<v.length?(norm(raw)[i]===norm(expected)[i]?"correct":"wrong"):"pending"});
  stats();
  if(v===e){
    line++;setTimeout(()=>{if(line<lines.length){render();typing.focus()}else finish()},120)
  }
}
function stats(){
  let acc=typedTotal?Math.max(0,Math.round(correctTotal/typedTotal*100)):100;
  let wpm=start?Math.round(correctTotal/5/Math.max((Date.now()-start)/60000,.01)):0;
  $("wpm").textContent=wpm;$("accuracy").textContent=acc+"%";$("mistakes").textContent=missees();
}
function missees(){return mistakesTotal}
function finish(){bar.style.width="100%";percent.textContent="100%";lineEl.textContent="Complete";lyricsEl.innerHTML='<span class="correct">Nice work — song complete!</span>';typing.disabled=true;stats()}
setInterval(stats,1000);
</script>
</body>
</html>
