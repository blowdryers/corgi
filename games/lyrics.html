<script>
const $=id=>document.getElementById(id);
const search=$("search"),find=$("find"),results=$("results"),status=$("status");
const cover=$("cover"),song=$("song"),artistEl=$("artist"),typing=$("typing");
const lyricsEl=$("lyrics"),game=$("game"),empty=$("empty"),bar=$("bar");
const lineEl=$("line"),percent=$("percent");

let lines=[],line=0,start=0,typedTotal=0,correctTotal=0,mistakesTotal=0;

const FALLBACK="https://placehold.co/1000x1000/111827/94a3b8?text=%E2%99%AA";
const cache=new Map;

find.onclick=searchSongs;
search.onkeydown=e=>{if(e.key==="Enter")searchSongs()};
typing.oninput=typeLine;
typing.onkeydown=e=>{
  if(e.key==="Tab"){e.preventDefault();advanceLine()}
};

async function get(url,timeout=9000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);
  try{
    const r=await fetch(url,{signal:c.signal});
    if(!r.ok)throw Error(r.status);
    return await r.json();
  }finally{clearTimeout(t)}
}

function art(x){
  return x?.replace("100x100","1000x1000")||FALLBACK
}

function esc(x){
  return String(x??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m])
}

function strip(x){
  return (x||"")
    .replace(/\[(\d{1,2}:)?\d{1,2}:\d{2}(?:[.:]\d{1,3})?\]/g,"")
    .replace(/\{[^}]*\}/g,"")
}

function clean(x){
  return strip(x).replace(/\r/g,"").split("\n")
    .map(x=>x.trim().replace(/['()]/g,""))
    .filter(x=>x&&!/^\[.*\]$/.test(x))
}

function norm(x){
  return x.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}\s]/gu,"")
    .replace(/\s+/g," ").trim()
}

async function searchSongs(){
  const q=search.value.trim();
  if(!q)return;

  find.disabled=true;
  results.innerHTML="";
  status.textContent="Searching multiple catalogs...";

  const jobs=[
    get("https://itunes.apple.com/search?term="+encodeURIComponent(q)+"&entity=song&limit=8")
      .then(d=>(d.results||[]).map(x=>({
        title:x.trackName,artist:x.artistName,album:x.collectionName,
        image:x.artworkUrl100,preview:x.previewUrl
      }))),
    get("https://api.deezer.com/search?q="+encodeURIComponent(q)+"&limit=8")
      .then(d=>(d.data||[]).map(x=>({
        title:x.title,artist:x.artist?.name,album:x.album?.title,
        image:x.album?.cover_medium,preview:x.preview
      }))),
    get("https://api.lyrics.ovh/suggest/"+encodeURIComponent(q))
      .then(d=>(d.data||[]).map(x=>({
        title:x.title,artist:x.artist?.name,album:x.album?.title,
        image:x.album?.cover_medium
      })))
  ];

  try{
    const all=(await Promise.allSettled(jobs))
      .flatMap(x=>x.status==="fulfilled"?x.value:[]);
    const seen=new Set;
    const list=all.filter(x=>{
      const k=(x.artist+" "+x.title).toLowerCase();
      if(!x.title||seen.has(k))return false;
      seen.add(k);return true;
    }).slice(0,18);

    if(!list.length){status.textContent="No songs found.";return}
    status.textContent="Choose a song:";

    list.forEach(t=>{
      const b=document.createElement("button");
      b.className="result";
      b.innerHTML=`<img src="${art(t.image)}" alt="">
        <div><b>${esc(t.title)}</b><small>${esc(t.artist||"Unknown artist")}
        ${t.album?" • "+esc(t.album):""}</small></div>`;
      b.onclick=()=>loadSong(t);
      results.appendChild(b);
    });
  }catch(e){
    status.textContent="Search failed. Try another title.";
  }finally{find.disabled=false}
}

async function loadSong(t){
  const a=t.artist||"",title=t.title||"";
  results.innerHTML="";
  song.textContent=title;
  artistEl.textContent=a;
  cover.src=art(t.image);
  document.body.style.setProperty("--art",`url("${art(t.image)}")`);
  status.textContent="Checking lyric providers...";
  typing.disabled=true;game.hidden=true;empty.hidden=false;

  try{
    const text=await getLyrics(a,title);
    lines=clean(text);
    if(!lines.length)throw Error("No lyrics were found for this song.");
    reset();
    status.textContent="Lyrics loaded.";
    empty.hidden=true;game.hidden=false;typing.disabled=false;
    typing.focus();
  }catch(e){status.textContent=e.message}
}

/*
  These are the realistic public/keyless browser sources.
  LRCLIB is queried in several ways because its search endpoint
  often finds songs that exact matching misses.
*/
async function getLyrics(a,t){
  const key=(a+"|"+t).toLowerCase();
  if(cache.has(key))return cache.get(key);

  const A=encodeURIComponent(a),T=encodeURIComponent(t);
  const jobs=[
    get(`https://lrclib.net/api/get?artist_name=${A}&track_name=${T}`)
      .then(x=>x.plainLyrics||strip(x.syncedLyrics)),
    get(`https://lrclib.net/api/search?artist_name=${A}&track_name=${T}`)
      .then(x=>{
        const v=x.find(y=>y.plainLyrics||y.syncedLyrics);
        return v?.plainLyrics||strip(v?.syncedLyrics)
      }),
    get(`https://lrclib.net/api/search?q=${encodeURIComponent(a+" "+t)}`)
      .then(x=>{
        const v=x.find(y=>y.plainLyrics||y.syncedLyrics);
        return v?.plainLyrics||strip(v?.syncedLyrics)
      }),
    get(`https://api.lyrics.ovh/v1/${A}/${T}`)
      .then(x=>x.lyrics),
    get(`https://api.lyrics.ovh/suggest/${encodeURIComponent(a+" "+t)}`)
      .then(async x=>{
        const v=(x.data||[]).find(y=>
          norm(y.title)==norm(t)&&norm(y.artist?.name)==norm(a));
        if(!v)return"";
        return get(`https://api.lyrics.ovh/v1/${
          encodeURIComponent(v.artist.name)}/${encodeURIComponent(v.title)}`)
          .then(y=>y.lyrics)
      })
  ];

  return new Promise(resolve=>{
    let left=jobs.length,done=false;
    jobs.forEach(p=>Promise.resolve(p).then(x=>{
      if(!done&&x?.trim()){
        done=true;cache.set(key,x);resolve(x)
      }
    }).catch(()=>{}).finally(()=>{
      if(!--left&&!done)resolve("")
    }));
  });
}

function reset(){
  line=0;start=0;typedTotal=0;correctTotal=0;mistakesTotal=0;
  typing.value="";render();stats()
}

function render(){
  if(line>=lines.length)return finish();
  lyricsEl.innerHTML=[...lines[line]].map(c=>
    `<span class="pending">${c===" "?"&nbsp;":esc(c)}</span>`
  ).join("")+'<i class="cursor"></i>';
  lineEl.textContent=`Line ${line+1} of ${lines.length}`;
  const p=Math.round(line/lines.length*100);
  percent.textContent=p+"%";bar.style.width=p+"%";typing.value=""
}

function typeLine(){
  if(line>=lines.length)return;
  const expected=norm(lines[line]),typed=norm(typing.value);
  if(!start&&typed)start=Date.now();

  typedTotal=lines.slice(0,line).reduce((n,x)=>n+norm(x).length,0)+typed.length;
  correctTotal=lines.slice(0,line).reduce((n,x)=>n+norm(x).length,0);
  mistakesTotal=0;

  for(let i=0;i<typed.length;i++)
    typed[i]===expected[i]?correctTotal++:mistakesTotal++;

  const spans=lyricsEl.querySelectorAll("span");
  let p=0;
  spans.forEach(s=>{
    if(!/[a-zA-Z0-9À-ÿ]/.test(s.textContent)){
      s.className="pending";return
    }
    s.className=p>=typed.length?"pending":
      typed[p]===expected[p]?"correct":"wrong";
    p++
  });

  stats();
  const words=expected.split(" ").filter(Boolean).length;
  if(typed.split(" ").filter(Boolean).length>=words&&words)advanceLine()
}

function advanceLine(){
  if(line>=lines.length)return;
  line++;
  setTimeout(()=>{
    line<lines.length?(render(),typing.focus()):finish()
  },100)
}

function stats(){
  const accuracy=typedTotal?Math.max(0,Math.round(correctTotal/typedTotal*100)):100;
  const minutes=start?Math.max((Date.now()-start)/60000,.01):1;
  $("wpm").textContent=start?Math.round(correctTotal/5/minutes):0;
  $("accuracy").textContent=accuracy+"%";
  $("mistakes").textContent=mistakesTotal;
}

function finish(){
  bar.style.width="100%";percent.textContent="100%";
  lineEl.textContent="Complete";
  lyricsEl.innerHTML='<span class="correct">Nice work — song complete!</span>';
  typing.disabled=true;stats()
}

setInterval(stats,1000);
</script>
