<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LyricType</title>

<style>
:root{
  --a:#8b5cf6;
  --b:#ec4899;
  --bg:#020617;
  --muted:#cbd5e1;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  color:#f8fafc;
  background:#020617;
  font:15px system-ui,sans-serif;
}

/* Album cover is the only page background */
body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:var(--art) center/cover no-repeat;
  transition:.6s;
}

/* Dark overlay for readability */
body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:#02061788;
  pointer-events:none;
}

.app{
  width:min(1050px,calc(100% - 28px));
  margin:auto;
  padding:25px 0 60px;
}

h1{
  margin:0;
  font-size:clamp(27px,5vw,40px);
}

p{
  margin:3px 0;
  color:var(--muted);
}

.logo{
  display:inline-grid;
  place-items:center;
  width:43px;
  height:43px;
  margin-right:10px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--a),var(--b));
  font-size:23px;
  vertical-align:middle;
}

.box,
.card{
  border:1px solid #ffffff35;
  border-radius:22px;
  background:transparent;
  box-shadow:none;
  backdrop-filter:none;
}

.box{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  padding:15px;
  margin:24px 0 12px;
}

.row{
  display:flex;
  gap:9px;
}

.row input{
  flex:1;
}

input{
  min-width:0;
  padding:14px 15px;
  border:1px solid #ffffff30;
  border-radius:13px;
  outline:0;
  color:white;
  background:#02061799;
  font:inherit;
}

input:focus{
  border-color:var(--a);
  box-shadow:0 0 0 3px #8b5cf633;
}

button{
  border:0;
  border-radius:13px;
  padding:0 19px;
  color:white;
  background:linear-gradient(135deg,var(--a),var(--b));
  font:inherit;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.info{
  display:flex;
  align-items:center;
  gap:10px;
}

.cover{
  width:48px;
  height:48px;
  border-radius:9px;
  object-fit:cover;
}

.name{
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:bold;
}

.artist,
.status{
  color:var(--muted);
  font-size:13px;
}

.status{
  grid-column:1/-1;
  min-height:18px;
}

.results{
  display:grid;
  gap:8px;
  margin-bottom:12px;
}

.result{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  padding:9px;
  text-align:left;
  background:#0f172acc;
  border:1px solid #ffffff25;
}

.result img{
  width:50px;
  height:50px;
  border-radius:8px;
  object-fit:cover;
}

.result div{
  overflow:hidden;
}

.result b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result small{
  color:var(--muted);
}

.card{
  min-height:440px;
  padding:clamp(22px,5vw,48px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.empty{
  text-align:center;
  color:var(--muted);
}

.progress-label{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
}

.progress{
  height:6px;
  border-radius:9px;
  background:#ffffff30;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--a),var(--b));
  transition:.2s;
}

.lyrics{
  min-height:125px;
  font-size:clamp(23px,4vw,39px);
  line-height:1.55;
  font-weight:650;
  overflow-wrap:anywhere;
}

.pending{
  color:#f8fafc88;
}

.correct{
  color:#86efac;
}

.wrong{
  color:#fb7185;
  text-decoration:underline;
}

.cursor{
  display:inline-block;
  width:3px;
  height:1em;
  background:#c4b5fd;
  margin-left:3px;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{
    opacity:0;
  }
}

#typing{
  width:100%;
  margin-top:30px;
  font-size:18px;
}

.hint{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
  padding:17px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:22px;
}

.stat small{
  color:var(--muted);
}

@media(max-width:700px){
  .box{
    grid-template-columns:1fr;
  }

  .info{
    justify-content:flex-start;
  }

  .row{
    flex-direction:column;
  }

  .row button{
    height:48px;
  }
}
</style>
</head>

<body>

<main class="app">

  <h1>
    <span class="logo">♪</span>
    LyricType
  </h1>

  <p>Type the lyrics. Find your flow.</p>

  <section class="box">
    <div class="row">
      <input
        id="search"
        placeholder="Search for a song and artist..."
        autocomplete="off"
      >
      <button id="find">Search</button>
    </div>

    <div class="info">
      <img
        id="cover"
        class="cover"
        src="https://placehold.co/100x100/111827/94a3b8?text=%E2%99%AA"
        alt="Album cover"
      >

      <div>
        <div id="song" class="name">No song selected</div>
        <div id="artist" class="artist">Search above to begin</div>
      </div>
    </div>

    <div id="status" class="status"></div>
  </section>

  <div id="results" class="results"></div>

  <section class="card">
    <div id="empty" class="empty">
      Search for a song to load its lyrics.
    </div>

    <div id="game" hidden>
      <div class="progress-label">
        <span id="line">Line 1</span>
        <span id="percent">0%</span>
      </div>

      <div class="progress">
        <div id="bar" class="bar"></div>
      </div>

      <div id="lyrics" class="lyrics"></div>

      <input
        id="typing"
        placeholder="Start typing here..."
        disabled
        spellcheck="false"
        autocomplete="off"
      >

      <div class="hint">
        Spelling, capital letters, punctuation, and anything inside parentheses are ignored.
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <b id="wpm">0</b>
      <small>WPM</small>
    </div>

    <div class="stat">
      <b id="accuracy">100%</b>
      <small>ACCURACY</small>
    </div>

    <div class="stat">
      <b id="mistakes">0</b>
      <small>MISTAKES</small>
    </div>
  </section>

</main>

<script>
const $ = id => document.getElementById(id);

const search = $("search");
const find = $("find");
const results = $("results");
const status = $("status");
const cover = $("cover");
const song = $("song");
const artistEl = $("artist");
const typing = $("typing");
const lyricsEl = $("lyrics");
const game = $("game");
const empty = $("empty");
const bar = $("bar");
const lineEl = $("line");
const percent = $("percent");

let tracks = [];
let chosen = null;
let lines = [];
let line = 0;
let start = 0;
let typedTotal = 0;
let correctTotal = 0;
let mistakesTotal = 0;

find.onclick = searchSongs;

search.onkeydown = event => {
  if(event.key === "Enter"){
    searchSongs();
  }
};

typing.oninput = typeLine;

async function fetcher(url, ms = 10000){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), ms);

  try{
    return await fetch(url, {
      signal:controller.signal
    });
  }finally{
    clearTimeout(timeout);
  }
}

async function searchSongs(){
  const query = search.value.trim();

  if(!query){
    return;
  }

  find.disabled = true;
  results.innerHTML = "";
  status.textContent = "Searching...";

  try{
    const response = await fetcher(
      "https://itunes.apple.com/search?term=" +
      encodeURIComponent(query) +
      "&entity=song&limit=12"
    );

    const data = await response.json();
    tracks = data.results || [];

    if(!tracks.length){
      status.textContent = "No songs found.";
      return;
    }

    status.textContent = "Choose a song:";

    tracks.forEach(track => {
      const button = document.createElement("button");
      button.className = "result";

      button.innerHTML = `
        <img src="${art(track.artworkUrl100)}" alt="Album cover">
        <div>
          <b>${esc(track.trackName)}</b>
          <small>
            ${esc(track.artistName)}
            ${track.collectionName ? " • " + esc(track.collectionName) : ""}
          </small>
        </div>
      `;

      button.onclick = () => loadSong(track);
      results.appendChild(button);
    });

  }catch(error){
    status.textContent = "Song search failed. Check your connection.";
  }finally{
    find.disabled = false;
  }
}

async function loadSong(track){
  chosen = track;
  results.innerHTML = "";

  song.textContent = track.trackName;
  artistEl.textContent = track.artistName;

  const image = art(track.artworkUrl100);

  cover.src = image;

  document.body.style.setProperty(
    "--art",
    `url("${image}")`
  );

  status.textContent = "Trying lyric providers...";
  typing.disabled = true;
  game.hidden = true;
  empty.hidden = false;

  try{
    const lyrics = await getLyrics(
      track.artistName,
      track.trackName
    );

    if(!lyrics){
      throw new Error("No lyrics were found for this song.");
    }

    lines = clean(lyrics);

    if(!lines.length){
      throw new Error("The lyrics response was empty.");
    }

    reset();

    status.textContent = "Lyrics loaded.";
    empty.hidden = true;
    game.hidden = false;
    typing.disabled = false;
    typing.focus();

  }catch(error){
    status.textContent = error.message;
  }
}

async function getLyrics(artist, title){
  const providers = [

    async() => {
      const response = await fetcher(
        "https://lrclib.net/api/get?artist_name=" +
        encodeURIComponent(artist) +
        "&track_name=" +
        encodeURIComponent(title)
      );

      if(!response.ok){
        return "";
      }

      const data = await response.json();

      return data.plainLyrics || strip(data.syncedLyrics);
    },

    async() => {
      const response = await fetcher(
        "https://lrclib.net/api/search?track_name=" +
        encodeURIComponent(title) +
        "&artist_name=" +
        encodeURIComponent(artist)
      );

      if(!response.ok){
        return "";
      }

      const data = await response.json();

      const result = data.find(item =>
        item.plainLyrics || item.syncedLyrics
      );

      return result?.plainLyrics || strip(result?.syncedLyrics);
    },

    async() => {
      const response = await fetcher(
        "https://api.lyrics.ovh/v1/" +
        encodeURIComponent(artist) +
        "/" +
        encodeURIComponent(title)
      );

      if(!response.ok){
        return "";
      }

      const data = await response.json();

      return data.lyrics || "";
    }

  ];

  for(const provider of providers){
    try{
      const result = await provider();

      if(result && result.trim()){
        return result;
      }
    }catch(error){
      // Try the next provider
    }
  }

  return "";
}

function strip(text){
  return (text || "").replace(
    /\[\d{1,2}:\d{2}(?:[.:]\d{1,3})?\]/g,
    ""
  );
}

function clean(text){
  return text
    .replace(/\r/g, "")
    .split("\n")
    .map(line => line.trim())
    .filter(line => line && !/^\[.*\]$/.test(line));
}

function art(url){
  return url
    ? url.replace("100x100", "1000x1000")
    : "https://placehold.co/1000x1000/111827/94a3b8?text=%E2%99%AA";
}

function esc(text){
  return String(text).replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[character])
  );
}

/*
  This function:

  - Converts everything to lowercase
  - Removes anything inside parentheses
  - Removes punctuation
  - Removes extra spaces

  Example:
  "I'm falling (yeah!)"

  becomes:

  "im falling"
*/
function norm(text){
  return text
    .replace(/\([^)]*\)/g, "")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, "")
    .replace(/\s+/g, " ")
    .trim();
}

function reset(){
  line = 0;
  start = 0;
  typedTotal = 0;
  correctTotal = 0;
  mistakesTotal = 0;

  typing.value = "";

  render();
  stats();
}

function render(){
  if(line >= lines.length){
    finish();
    return;
  }

  const currentLine = lines[line];

  lyricsEl.innerHTML =
    [...currentLine]
      .map(character => {
        if(character === "("){
          return `<span class="pending">[</span>`;
        }

        if(character === ")"){
          return `<span class="pending">]</span>`;
        }

        return `
          <span class="pending">
            ${character === " " ? "&nbsp;" : esc(character)}
          </span>
        `;
      })
      .join("") +
    `<i class="cursor"></i>`;

  lineEl.textContent =
    `Line ${line + 1} of ${lines.length}`;

  const progress = Math.round(
    line / lines.length * 100
  );

  percent.textContent = progress + "%";
  bar.style.width = progress + "%";
  typing.value = "";
}

function typeLine(){
  if(line >= lines.length){
    return;
  }

  const expected = lines[line];
  const raw = typing.value;

  if(!start && raw.trim()){
    start = Date.now();
  }

  const expectedText = norm(expected);
  const typedText = norm(raw);

  const expectedWords = expectedText
    .split(" ")
    .filter(Boolean);

  const typedWords = typedText
    .split(" ")
    .filter(Boolean);

  const completedCharacters = lines
    .slice(0, line)
    .reduce((total, lyricLine) => {
      return total + norm(lyricLine).length;
    }, 0);

  typedTotal = completedCharacters + typedText.length;
  correctTotal = completedCharacters;
  mistakesTotal = 0;

  /*
    Spelling mistakes are counted for accuracy,
    but they do not prevent moving forward.
  */
  for(let i = 0; i < typedText.length; i++){
    if(typedText[i] === expectedText[i]){
      correctTotal++;
    }else{
      mistakesTotal++;
    }
  }

  /*
    Show typed letters as correct or wrong.
    Parentheses and punctuation are ignored.
  */
  const lyricSpans = lyricsEl.querySelectorAll("span");
  let normalizedPosition = 0;

  lyricSpans.forEach(span => {
    const originalCharacter = span.textContent;

    if(!/[a-zA-Z0-9À-ÿ]/.test(originalCharacter)){
      span.className = "pending";
      return;
    }

    if(normalizedPosition >= typedText.length){
      span.className = "pending";
    }else if(
      typedText[normalizedPosition] === expectedText[normalizedPosition]
    ){
      span.className = "correct";
    }else{
      span.className = "wrong";
    }

    normalizedPosition++;
  });

  stats();

  /*
    The line completes when the user has typed the same
    number of words as the lyric line.

    The spelling of those words does not matter.
  */
  if(
    typedWords.length >= expectedWords.length &&
    expectedWords.length > 0
  ){
    line++;

    setTimeout(() => {
      if(line < lines.length){
        render();
        typing.focus();
      }else{
        finish();
      }
    }, 120);
  }
}

function stats(){
  const accuracy = typedTotal
    ? Math.max(
        0,
        Math.round(correctTotal / typedTotal * 100)
      )
    : 100;

  const wpm = start
    ? Math.round(
        correctTotal /
        5 /
        Math.max((Date.now() - start) / 60000, 0.01)
      )
    : 0;

  $("wpm").textContent = wpm;
  $("accuracy").textContent = accuracy + "%";
  $("mistakes").textContent = mistakesTotal;
}

function finish(){
  bar.style.width = "100%";
  percent.textContent = "100%";
  lineEl.textContent = "Complete";

  lyricsEl.innerHTML =
    `<span class="correct">Nice work — song complete!</span>`;

  typing.disabled = true;
  stats();
}

setInterval(stats, 1000);
</script>

</body>
</html>
