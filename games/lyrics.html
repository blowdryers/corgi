<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LyricType</title>

  <style>
    :root {
      --accent: #8b5cf6;
      --accent-light: #c4b5fd;
      --text: #f8fafc;
      --muted: #94a3b8;
      --panel: rgba(15, 23, 42, 0.74);
      --panel-border: rgba(255, 255, 255, 0.13);
      --correct: #86efac;
      --wrong: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background: #020617;
    }

    body {
      overflow-x: hidden;
    }

    .background {
      position: fixed;
      inset: -40px;
      z-index: -3;
      background:
        radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.35), transparent 35%),
        #020617;
      background-size: cover;
      background-position: center;
      filter: blur(26px) saturate(1.3);
      transform: scale(1.08);
      transition: background-image 0.7s ease;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.7);
    }

    .app {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 70px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      font-size: 21px;
      box-shadow: 0 8px 35px rgba(139, 92, 246, 0.4);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .controls,
    .game-card,
    .stats {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      min-width: 0;
    }

    input,
    button {
      font: inherit;
    }

    #songSearch {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      outline: none;
      padding: 14px 16px;
      color: var(--text);
      background: rgba(2, 6, 23, 0.56);
    }

    #songSearch:focus,
    #typingInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 0 20px;
      color: white;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 230px;
      justify-content: flex-end;
    }

    .cover {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
    }

    .song-name {
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .artist-name {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    .status {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
    }

    .game-card {
      padding: clamp(22px, 5vw, 48px);
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .progress-wrap {
      margin-bottom: 26px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .progress {
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      transition: width 0.2s ease;
    }

    .lyrics-display {
      font-size: clamp(23px, 4vw, 39px);
      line-height: 1.55;
      font-weight: 650;
      letter-spacing: -0.7px;
      min-height: 125px;
      overflow-wrap: break-word;
    }

    .character {
      transition: color 0.1s ease;
    }

    .character.pending {
      color: rgba(248, 250, 252, 0.35);
    }

    .character.correct {
      color: var(--correct);
    }

    .character.wrong {
      color: var(--wrong);
      text-decoration: underline;
      text-decoration-thickness: 3px;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 1.05em;
      margin-left: 2px;
      vertical-align: -0.12em;
      background: var(--accent-light);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    #typingInput {
      width: 100%;
      margin-top: 35px;
      padding: 17px 18px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 15px;
      outline: none;
      color: var(--text);
      background: rgba(2, 6, 23, 0.68);
      font-size: 18px;
    }

    #typingInput:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 18px;
      margin-top: 16px;
      text-align: center;
    }

    .stat-value {
      display: block;
      font-size: 23px;
      font-weight: 800;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      font-size: 17px;
    }

    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .song-info {
        justify-content: flex-start;
      }

      .search-row {
        flex-direction: column;
      }

      .search-row button {
        min-height: 48px;
      }

      .stats {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="background" id="background"></div>

  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">♪</div>
        <div>
          <h1>LyricType</h1>
          <p class="subtitle">Type the lyrics. Find your flow.</p>
        </div>
      </div>
    </header>

    <section class="controls">
      <div class="search-row">
        <input
          id="songSearch"
          type="text"
          placeholder="Search for a song, e.g. Blinding Lights The Weeknd"
          autocomplete="off"
        />
        <button id="searchButton">Find song</button>
      </div>

      <div class="song-info">
        <img
          id="cover"
          class="cover"
          src="https://placehold.co/100x100/111827/94a3b8?text=♪"
          alt="Album cover"
        />
        <div>
          <div id="songName" class="song-name">No song selected</div>
          <div id="artistName" class="artist-name">Search above to begin</div>
        </div>
      </div>

      <div id="status" class="status"></div>
    </section>

    <section class="game-card">
      <div id="emptyState" class="empty">
        Search for a song to load its lyrics.
      </div>

      <div id="game" hidden>
        <div class="progress-wrap">
          <div class="progress-label">
            <span id="lineLabel">Line 1</span>
            <span id="percentLabel">0%</span>
          </div>
          <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </div>

        <div id="lyricsDisplay" class="lyrics-display"></div>

        <input
          id="typingInput"
          type="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          disabled
          placeholder="Start typing here..."
        />

        <div class="hint">
          Type each line exactly. The next line appears automatically when you finish.
        </div>
      </div>
    </section>

    <section class="stats">
      <div>
        <span id="wpm" class="stat-value">0</span>
        <span class="stat-label">WPM</span>
      </div>
      <div>
        <span id="accuracy" class="stat-value">100%</span>
        <span class="stat-label">Accuracy</span>
      </div>
      <div>
        <span id="mistakes" class="stat-value">0</span>
        <span class="stat-label">Mistakes</span>
      </div>
    </section>
  </main>

  <script>
    const songSearch = document.getElementById("songSearch");
    const searchButton = document.getElementById("searchButton");
    const statusEl = document.getElementById("status");
    const coverEl = document.getElementById("cover");
    const songNameEl = document.getElementById("songName");
    const artistNameEl = document.getElementById("artistName");
    const backgroundEl = document.getElementById("background");

    const emptyState = document.getElementById("emptyState");
    const game = document.getElementById("game");
    const lyricsDisplay = document.getElementById("lyricsDisplay");
    const typingInput = document.getElementById("typingInput");

    const lineLabel = document.getElementById("lineLabel");
    const percentLabel = document.getElementById("percentLabel");
    const progressBar = document.getElementById("progressBar");

    const wpmEl = document.getElementById("wpm");
    const accuracyEl = document.getElementById("accuracy");
    const mistakesEl = document.getElementById("mistakes");

    let lines = [];
    let currentLine = 0;
    let totalTypedCharacters = 0;
    let correctCharacters = 0;
    let mistakes = 0;
    let startTime = null;
    let isLoading = false;

    searchButton.addEventListener("click", loadSong);

    songSearch.addEventListener("keydown", event => {
      if (event.key === "Enter") loadSong();
    });

    typingInput.addEventListener("input", handleTyping);

    async function loadSong() {
      const query = songSearch.value.trim();

      if (!query || isLoading) return;

      isLoading = true;
      searchButton.disabled = true;
      statusEl.textContent = "Searching for the song...";
      emptyState.hidden = false;
      game.hidden = true;

      try {
        const track = await findTrack(query);

        if (!track) {
          throw new Error("Song not found. Try including the artist name.");
        }

        const artist = track.artistName;
        const title = track.trackName;

        statusEl.textContent = `Loading lyrics for “${title}”...`;

        const lyricsResponse = await fetch(
          `https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`
        );

        if (!lyricsResponse.ok) {
          throw new Error("Lyrics could not be found for this song.");
        }

        const lyricsData = await lyricsResponse.json();

        if (!lyricsData.lyrics) {
          throw new Error("This song does not have lyrics available.");
        }

        const artwork = getLargeArtwork(track.artworkUrl100);

        coverEl.src = artwork;
        backgroundEl.style.backgroundImage = `url("${artwork}")`;

        songNameEl.textContent = title;
        artistNameEl.textContent = artist;

        lines = cleanLyrics(lyricsData.lyrics);

        if (!lines.length) {
          throw new Error("No usable lyrics were returned.");
        }

        resetGame();

        statusEl.textContent = "";
        emptyState.hidden = true;
        game.hidden = false;
        typingInput.disabled = false;
        typingInput.focus();
      } catch (error) {
        statusEl.textContent = error.message;
        typingInput.disabled = true;
      } finally {
        isLoading = false;
        searchButton.disabled = false;
      }
    }

    async function findTrack(query) {
      const response = await fetch(
        `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`
      );

      if (!response.ok) {
        throw new Error("Song search failed.");
      }

      const data = await response.json();
      return data.results?.[0] || null;
    }

    function getLargeArtwork(url) {
      if (!url) {
        return "https://placehold.co/1000x1000/111827/94a3b8?text=♪";
      }

      return url.replace("100x100", "1000x1000");
    }

    function cleanLyrics(rawLyrics) {
      return rawLyrics
        .replace(/\r/g, "")
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .filter(line => !/^\[.*\]$/.test(line));
    }

    function resetGame() {
      currentLine = 0;
      totalTypedCharacters = 0;
      correctCharacters = 0;
      mistakes = 0;
      startTime = null;
      typingInput.value = "";

      updateStats();
      renderLine();
    }

    function renderLine() {
      const currentText = lines[currentLine];

      if (!currentText) {
        finishGame();
        return;
      }

      lyricsDisplay.innerHTML = "";

      [...currentText].forEach(character => {
        const span = document.createElement("span");
        span.className = "character pending";
        span.textContent = character === " " ? "\u00A0" : character;
        lyricsDisplay.appendChild(span);
      });

      const cursor = document.createElement("span");
      cursor.className = "cursor";
      lyricsDisplay.appendChild(cursor);

      lineLabel.textContent = `Line ${currentLine + 1} of ${lines.length}`;

      const percent = Math.round((currentLine / lines.length) * 100);
      percentLabel.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;

      typingInput.value = "";
    }

    function handleTyping() {
      if (!lines[currentLine]) return;

      if (!startTime && typingInput.value.length > 0) {
        startTime = Date.now();
      }

      const expected = lines[currentLine];
      const typed = typingInput.value;
      const characterSpans = lyricsDisplay.querySelectorAll(".character");

      characterSpans.forEach((span, index) => {
        span.className = "character";

        if (index >= typed.length) {
          span.classList.add("pending");
        } else if (typed[index] === expected[index]) {
          span.classList.add("correct");
        } else {
          span.classList.add("wrong");
        }
      });

      totalTypedCharacters = calculateTotalTypedCharacters();
      correctCharacters = calculateCorrectCharacters();
      mistakes = calculateMistakes();

      updateStats();

      if (typed === expected) {
        currentLine++;

        setTimeout(() => {
          if (currentLine >= lines.length) {
            finishGame();
          } else {
            renderLine();
            typingInput.focus();
          }
        }, 140);
      }
    }

    function calculateTotalTypedCharacters() {
      let count = 0;

      for (let i = 0; i < currentLine; i++) {
        count += lines[i].length;
      }

      return count + typingInput.value.length;
    }

    function calculateCorrectCharacters() {
      let count = 0;

      for (let i = 0; i < currentLine; i++) {
        count += lines[i].length;
      }

      const expected = lines[currentLine] || "";
      const typed = typingInput.value;

      for (let i = 0; i < typed.length; i++) {
        if (typed[i] === expected[i]) count++;
      }

      return count;
    }

    function calculateMistakes() {
      let count = 0;
      const expected = lines[currentLine] || "";
      const typed = typingInput.value;

      for (let i = 0; i < typed.length; i++) {
        if (typed[i] !== expected[i]) count++;
      }

      return count;
    }

    function updateStats() {
      const accuracy =
        totalTypedCharacters === 0
          ? 100
          : Math.max(0, Math.round((correctCharacters / totalTypedCharacters) * 100));

      let wpm = 0;

      if (startTime && totalTypedCharacters > 0) {
        const elapsedMinutes = (Date.now() - startTime) / 60000;
        wpm = Math.round((correctCharacters / 5) / Math.max(elapsedMinutes, 0.01));
      }

      wpmEl.textContent = wpm;
      accuracyEl.textContent = `${accuracy}%`;
      mistakesEl.textContent = mistakes;
    }

    function finishGame() {
      progressBar.style.width = "100%";
      percentLabel.textContent = "100%";
      lineLabel.textContent = "Complete";

      lyricsDisplay.innerHTML = `
        <div style="color: var(--correct);">
          Nice work — song complete!
        </div>
      `;

      typingInput.value = "";
      typingInput.disabled = true;
      updateStats();
    }

    setInterval(updateStats, 1000);
  </script>
</body>
</html>
